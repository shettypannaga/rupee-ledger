// ---------- statements ----------
ACTIONS.openStatement = (d) => openStatement(d.acct);
function openStatement(accountId) {
  const a = C.acct(S, accountId);
  const isCard = a.kind === 'card';
  let h = '<form data-form="statement" data-acct="' + a.id + '">';
  if (isCard) {
    h += '<div class="field-row">' + field('Statement date', dateInput('date')) + field('Due date', '<input type="date" name="dueDate" required>') + '</div>' +
      field('Statement balance', moneyInput('statementBalance', '', 'required')) + field('Minimum due', moneyInput('minimumDue', ''), 'Optional') +
      '<label class="check"><input type="checkbox" name="confirm" checked><span>Use the statement balance as the confirmed card balance on that date</span></label>';
  } else {
    h += field('Statement date', dateInput('date')) +
      field(a.kind === 'flexi' ? 'Closing utilized balance' : 'Closing balance', moneyInput('closingBalance', '', 'required'), 'This becomes the confirmed balance from that date on.');
  }
  h += '<div class="field-row">' + field('Interest charged', moneyInput('interest', ''), 'Optional') + field('Fees / late charges', moneyInput('fees', ''), 'Optional') + '</div>' +
    '<label class="check"><input type="checkbox" name="recordCharges" checked><span>Also record the interest and fees as charges dated the statement date</span></label>' +
    '<div class="note small">The app compares this balance with its own calculation and flags any difference for review. Your entries are never changed.</div>' +
    errorsBox() + '<div class="sticky-actions"><button class="btn primary" type="submit">Save statement</button></div></form>';
  openSheet(esc(a.name) + ' statement', h);
}
FORMS.statement = (form) => {
  const a = C.acct(S, form.dataset.acct);
  const date = fval(form, 'date');
  const errors = [];
  if (!C.isValidDate(date)) errors.push('Enter the statement date.');
  const interest = optAmount(form, 'interest'), fees = optAmount(form, 'fees');
  if (Number.isNaN(interest) || Number.isNaN(fees) || (interest != null && interest < 0) || (fees != null && fees < 0)) errors.push('Interest and fees must be numbers (or blank).');
  const st = { id: 'st' + C.uid(), accountId: a.id, date, interestCharged: interest || 0, fees: fees || 0, createdAt: new Date().toISOString() };
  if (a.kind === 'card') {
    st.dueDate = fval(form, 'dueDate');
    st.statementBalance = famount(form, 'statementBalance');
    st.minimumDue = optAmount(form, 'minimumDue') || 0;
    if (!C.isValidDate(st.dueDate)) errors.push('Enter the due date.');
    if (!isFinite(st.statementBalance) || st.statementBalance < 0) errors.push('Enter the statement balance.');
    if (fchecked(form, 'confirm') && isFinite(st.statementBalance)) st.closingBalance = st.statementBalance;
  } else {
    st.closingBalance = famount(form, 'closingBalance');
    if (!isFinite(st.closingBalance)) errors.push('Enter the closing balance.');
  }
  if (errors.length) return showErrors(form, errors);
  if (fchecked(form, 'recordCharges')) {
    if (interest) C.addTx(S, { type: 'loan_interest', amount: interest, date, from: a.id, description: 'Interest per statement' });
    if (fees) C.addTx(S, { type: 'loan_fee', amount: fees, date, from: a.id, description: 'Fees per statement' });
  }
  S.statements.push(st);
  const r = st.closingBalance != null ? C.reconcile(S, a.id).find((x) => x.statement.id === st.id) : null;
  closeSheet();
  commit(!r || r.difference == null ? 'Statement saved' : Math.abs(r.difference) < 1 ? 'Statement saved. It matches the app.' : 'Statement saved. It differs from the app by ' + money(r.difference, { sign: true }) + ' (see Needs review).');
};
ACTIONS.deleteStatement = async (d) => {
  const st = S.statements.find((s) => s.id === d.id);
  if (!st) return;
  const ok = await confirmBox({ title: 'Delete statement?', body: 'Statement of ' + esc(fmtDate(st.date, true)) + '. Balances will be recalculated from your entries. Interest entries you recorded from it stay.', confirm: 'Delete', danger: true });
  if (!ok) return;
  S.statements = S.statements.filter((s) => s.id !== d.id);
  commit('Statement deleted');
};

// ---------- accounts ----------
ACTIONS.editAccount = (d) => openAccountEditor(C.acct(S, d.id));
ACTIONS.addAccount = (d) => openAccountEditor(null, d.kind);
function openAccountEditor(a, newKind) {
  const kind = a ? a.kind : (newKind || 'bank');
  const o = (a && a.opening) || {};
  let h = '<form data-form="account" data-id="' + (a ? a.id : '') + '">';
  if (!a && !newKind) h += field('Type', selectInput('kind', [['bank', 'Bank account'], ['cash', 'Cash'], ['savings', 'Savings account'], ['card', 'Credit card']], kind));
  else h += '<input type="hidden" name="kind" value="' + kind + '">';
  h += field('Name', '<input name="name" required value="' + esc(a ? a.name : kind === 'card' ? '' : '') + '" placeholder="' + (kind === 'card' ? 'e.g. HDFC Millennia' : 'e.g. SBI savings') + '">');
  const balLabel = kind === 'card' ? 'Outstanding today' : kind === 'flexi' ? 'Utilized balance' : kind === 'loan' ? 'Outstanding balance' : 'Balance';
  h += '<div class="field-row">' + field(balLabel, moneyInput('balance', o.balance != null ? o.balance : '')) + field('As of', '<input type="date" name="balanceDate" value="' + esc(o.date || today()) + '">') + '</div>';
  h += '<p class="small faint">Entries dated on or after this day adjust the balance from here.' + (kind === 'bank' || kind === 'cash' ? ' Leave blank if you are not sure yet.' : '') + '</p>';
  if (kind === 'flexi' || kind === 'loan') {
    h += '<label class="check"><input type="checkbox" name="confirmed"' + (o.confirmed ? ' checked' : '') + '><span>This is the figure my lender currently shows</span></label>';
    h += '<div class="field-row">' + field('Interest rate (% a year)', '<input name="rate" inputmode="decimal" value="' + esc(a.rate) + '">') +
      (kind === 'flexi' ? field('Days per year', selectInput('dayCount', [['365', '365 (default)'], ['360', '360']], a.dayCount || 365)) : field('Tenure (months)', '<input name="tenureMonths" inputmode="numeric" value="' + esc(a.tenureMonths || '') + '">')) + '</div>';
  }
  if (kind === 'flexi') {
    h += field('Original loan amount', moneyInput('original', a.original)) + field('Remaining tenure', '<input name="reportedTenure" value="' + esc(a.reportedTenure || '') + '">');
  }
  if (kind === 'loan') {
    h += field('Repayment start date', '<input type="date" name="repaymentStart" value="' + esc(a.repaymentStart || '') + '">', 'Leave blank until confirmed.') +
      field('Interest before repayment starts', selectInput('moratoriumInterest', [['unknown', 'Not confirmed'], ['capitalized', 'Added to the principal (capitalized)'], ['simple', 'Accrues without compounding'], ['paid', 'I pay it monthly']], a.moratoriumInterest || 'unknown')) +
      field('Notes', '<textarea name="note">' + esc(a.note || '') + '</textarea>');
  }
  if (kind === 'card') {
    h += field('Credit limit', moneyInput('limit', a && a.limit ? a.limit : ''), 'Optional') +
      '<div class="field-row">' + field('Statement day', '<input name="statementDay" inputmode="numeric" value="' + esc((a && a.statementDay) || '') + '" placeholder="1–31">') +
      field('Due day', '<input name="dueDay" inputmode="numeric" value="' + esc((a && a.dueDay) || '') + '" placeholder="1–31">') + '</div>';
  }
  h += errorsBox() + '<div class="sticky-actions">' + (a && !['flexi', 'eduloan', 'bank', 'cash'].includes(a.id) ? '<button class="btn danger" type="button" data-act="removeAccount" data-id="' + a.id + '">Remove</button>' : '') +
    '<button class="btn primary" type="submit">Save</button></div></form>';
  openSheet(a ? 'Edit ' + a.name : 'Add ' + (newKind === 'card' ? 'card' : 'account'), h);
}
FORMS.account = (form) => {
  const id = form.dataset.id;
  const kind = fval(form, 'kind');
  const errors = [];
  const name = fval(form, 'name');
  if (!name) errors.push('Enter a name.');
  const bal = optAmount(form, 'balance');
  if (Number.isNaN(bal)) errors.push('Enter the balance as a number, or leave it blank.');
  const bd = fval(form, 'balanceDate');
  if (bal != null && !C.isValidDate(bd)) errors.push('Enter the date of that balance.');
  const num = (n, lo, hi) => { const v = fval(form, n); if (v === '') return null; const x = Number(v); return isFinite(x) && x >= lo && x <= hi ? x : NaN; };
  const a = id ? C.acct(S, id) : { id: kind + '-' + C.uid(), kind };
  if (kind === 'flexi' || kind === 'loan') {
    const rate = num('rate', 0, 60);
    if (rate == null || Number.isNaN(rate)) errors.push('Enter an interest rate between 0 and 60.');
    else a.rate = rate;
  }
  if (kind === 'card') {
    const lim = optAmount(form, 'limit'), sd = num('statementDay', 1, 31), dd = num('dueDay', 1, 31);
    if (Number.isNaN(lim) || Number.isNaN(sd) || Number.isNaN(dd)) errors.push('Limit must be a number; statement and due days must be 1–31.');
    a.limit = lim; a.statementDay = sd; a.dueDay = dd;
  }
  if (kind === 'loan') {
    const tm = num('tenureMonths', 1, 360);
    if (Number.isNaN(tm)) errors.push('Tenure must be 1–360 months.');
    a.tenureMonths = tm; a.repaymentStart = fval(form, 'repaymentStart'); a.moratoriumInterest = fval(form, 'moratoriumInterest'); a.note = fval(form, 'note');
  }
  if (kind === 'flexi') {
    a.dayCount = Number(fval(form, 'dayCount')) || 365;
    const orig = optAmount(form, 'original');
    if (Number.isNaN(orig)) errors.push('Original amount must be a number.'); else a.original = orig;
    a.reportedTenure = fval(form, 'reportedTenure');
  }
  if (errors.length) return showErrors(form, errors);
  a.name = name;
  if (bal == null) a.opening = null;
  else {
    const prev = a.opening || {};
    const changed = prev.balance !== bal || prev.date !== bd;
    const confirmed = kind === 'flexi' || kind === 'loan' ? fchecked(form, 'confirmed') : true;
    a.opening = { date: bd, balance: bal, confirmed, source: changed || confirmed !== prev.confirmed ? (confirmed ? (kind === 'flexi' || kind === 'loan' ? 'Confirmed by you on ' + fmtDate(today(), true) : 'Entered by you') : 'Entered by you (not confirmed with lender)') : prev.source };
  }
  if (!id) S.accounts.push(a);
  closeSheet(); commit('Saved');
};
ACTIONS.removeAccount = async (d) => {
  const a = C.acct(S, d.id);
  const used = S.transactions.some((x) => x.from === a.id || x.to === a.id);
  const ok = await confirmBox({ title: 'Remove ' + esc(a.name) + '?', body: used ? 'It has entries, so it will be hidden from forms but kept for your history and totals.' : 'It has no entries and will be deleted.', confirm: 'Remove', danger: true });
  if (!ok) return;
  if (used) a.archived = true; else S.accounts = S.accounts.filter((x) => x.id !== a.id);
  closeAllSheets(); commit('Removed');
};

let pendingImport = null;
ACTIONS.importCard = (d) => {
  const a = C.acct(S, d.id);
  openSheet('Import ' + a.name + ' statement',
    '<div class="note small">Choose a CSV file exported from your card\'s website, or paste its contents. It needs a <b>Date</b> column and an <b>Amount</b> (or Debit/Credit) column. Nothing is added until you review it.</div>' +
    '<form data-form="importRead" data-acct="' + a.id + '">' + field('CSV file', '<input type="file" name="file" accept=".csv,text/csv,text/plain">') +
    field('…or paste CSV text', '<textarea name="text" placeholder="Date,Description,Amount"></textarea>') + errorsBox() +
    '<button class="btn primary" type="submit">Read statement</button></form><div id="import-review"></div>');
};
FORMS.importRead = async (form) => {
  const acctId = form.dataset.acct;
  let text = fval(form, 'text');
  const file = form.elements.file.files[0];
  if (file) { try { text = await file.text(); } catch (e) { return showErrors(form, ['Could not read that file.']); } }
  if (!text) return showErrors(form, ['Choose a file or paste the CSV text.']);
  const prep = C.prepareCardImport(S, acctId, text);
  if (!prep.ok) return showErrors(form, prep.errors);
  showErrors(form, []);
  pendingImport = { acctId, items: prep.items };
  const box = $('#import-review');
  box.innerHTML = '<div class="eyebrow">Review ' + plural(prep.items.length, 'row') + '</div>' +
    (prep.skipped.length ? '<div class="note warn small">' + plural(prep.skipped.length, 'line') + ' could not be read and will be skipped (lines ' + prep.skipped.map((s) => s.line).slice(0, 10).join(', ') + ').</div>' : '') +
    '<div class="note small">Rows that look like ones you already logged, and card-payment credits, are unticked. Record bill payments with <b>Pay bill</b> so they link to the account that paid. Imported purchases land in <b>Needs categorization</b>.</div>' +
    '<div class="group">' + prep.items.map((it, i) =>
      '<label class="row"><input type="checkbox" data-change="importToggle" data-i="' + i + '"' + (it.include ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--accent)">' +
      '<span class="label">' + esc(it.tx.description || '(no description)') + '<span class="sub">' + fmtDate(it.tx.date, true) + ' · ' + (it.isCredit ? 'Credit / refund' : 'Purchase') + '</span>' +
      ((it.duplicates.length || it.looksLikePayment) ? '<span class="meta">' + (it.duplicates.length ? badge('Possible duplicate', 'warn') : '') + (it.looksLikePayment ? badge('Looks like a bill payment', 'warn') : '') + '</span>' : '') +
      '</span><span class="value">' + (it.isCredit ? '+' : '') + money(it.tx.amount) + '</span></label>').join('') + '</div>' +
    '<button class="btn primary block" data-act="importCommit">Add selected rows</button>';
  box.scrollIntoView({ block: 'start', behavior: 'smooth' });
};
CHANGES.importToggle = (el) => { pendingImport.items[Number(el.dataset.i)].include = el.checked; };
ACTIONS.importCommit = () => {
  if (!pendingImport) return;
  const n = pendingImport.items.filter((i) => i.include).length;
  if (!n) return toast('No rows selected.');
  const res = C.commitImport(S, pendingImport.items);
  pendingImport = null;
  closeSheet(); commit(plural(res.added.length, 'row') + ' imported' + (res.errors.length ? ', ' + res.errors.length + ' skipped' : '') + '. Categorize them in Needs review.');
};

FORMS.goal = (form) => {

// ---------- gaming: reflection, urges, attempts ----------
function openReflection(txId) {
  const x = C.txById(S, txId);
  const fx = flexiAcct();
  const ser = fx ? C.flexiSeries(S, fx.id, today(), today()) : [];
  const daily = ser.length ? ser[0].estInterest : null;
  const goal = firstGoal();
  const facts = [];
  if (daily) facts.push('about ' + Math.max(1, Math.round(x.amount / daily)) + ' days of flexi-loan interest at today\'s balance');
  if (goal) facts.push(pct(x.amount / goal.target) + ' of the ' + goal.name + ' target');
  openSheet('Quick check-in', '<form data-form="reflect" data-id="' + x.id + '">' +
    '<div class="note small"><b>Logged ' + money(x.amount) + '.</b>If you like, note what was going on. It helps you spot patterns later. You can skip this.</div>' +
    '<div class="field"><span>What prompted it?</span>' + chipRadio('trigger', Object.entries(C.GAMING_TRIGGERS), '') + '</div>' +
    '<div class="field"><span>Did you wait before buying?</span>' + chipRadio('waited', [['yes', 'Waited 24h or more'], ['some', 'Waited a little'], ['no', 'Bought straight away']], '') + '</div>' +
    field('Anything else', '<textarea name="note" placeholder="Optional"></textarea>') +
    (facts.length ? '<div class="note small">For scale, this amount is ' + facts.join(', or ') + '.</div>' : '') +
    '<div class="sticky-actions"><button class="btn" type="button" data-act="closeSheet">Skip</button><button class="btn primary" type="submit">Save check-in</button></div></form>');
}
FORMS.reflect = (form) => {

};

    '<div class="field"><span>What prompted it?</span>' + chipRadio('trigger', Object.entries(C.GAMING_TRIGGERS), '') + '</div>' +

FORMS.urge = (form) => {
  const amount = optAmount(form, 'amount');
  if (Number.isNaN(amount) || (amount != null && amount < 0)) return showErrors(form, ['Amount must be a number, or leave it blank.']);
  const now = new Date();
  const entry = { id: 'g' + C.uid(), kind: 'urge', date: today(), time: now.toTimeString().slice(0, 5), item: fval(form, 'what'), amount: amount || null,
    trigger: (form.querySelector('input[name="trigger"]:checked') || {}).value || '', coolOffUntil: fchecked(form, 'cool') ? new Date(now.getTime() + 864e5).toISOString() : null, outcome: fchecked(form, 'cool') ? null : 'pending' };
  S.gamingLog.push(entry);
  closeSheet(); commit('Logged');
  if (entry.coolOffUntil) {
    const end = new Date(entry.coolOffUntil);
    openSheet('Cooling-off started', '<div class="note info"><b>Ends ' + esc(end.toLocaleString('en-IN', { weekday: 'short', hour: 'numeric', minute: '2-digit' })) + '</b>It shows on the Goals tab with a countdown. When it ends, you decide: skip it, or log the purchase.</div>' +
      '<div class="btn-row"><button class="btn" data-act="urgeReminder" data-id="' + entry.id + '">Add calendar reminder</button><button class="btn primary" data-act="closeSheet">Done</button></div>');
  }
};
ACTIONS.urgeReminder = (d) => {
  const g = S.gamingLog.find((x) => x.id === d.id);
  offerReminder('Cooling-off finished: ' + (g.item || 'purchase'), new Date(g.coolOffUntil), 'Decide whether you still want it. Open SpendWise → Goals.');
};
ACTIONS.urgeDecide = (d) => {
  const g = S.gamingLog.find((x) => x.id === d.id);
  if (!g) return;
  const cooling = g.coolOffUntil && new Date(g.coolOffUntil) > new Date();
  let h = '<div class="group">' + row('What', esc(g.item || '—')) + row('Amount', g.amount ? money(g.amount) : '—') + row('Logged', fmtDate(g.date, true) + (g.time ? ', ' + g.time : '')) +
    (g.trigger ? row('Prompted by', esc(C.GAMING_TRIGGERS[g.trigger])) : '') + (g.outcome ? row('Outcome', { resisted: 'Skipped', purchased: 'Bought', pending: 'Undecided' }[g.outcome] || g.outcome) : '') + '</div>';
  if (g.kind === 'urge' && g.outcome !== 'resisted' && g.outcome !== 'purchased') {
    h += cooling ? '<div class="note small">Cooling-off is still running. You can decide now if you are sure.</div>' : '';
    h += '<div class="btn-row"><button class="btn primary" data-act="urgeOutcome" data-id="' + g.id + '" data-v="resisted">Skip it</button><button class="btn" data-act="urgeOutcome" data-id="' + g.id + '" data-v="purchased">I bought it</button></div>';
  }
  if (g.outcome === 'resisted' && g.amount) h += '<div class="btn-row"><button class="btn" data-act="redirect" data-id="' + g.id + '" data-to="goal">Earmark ' + money(g.amount) + (firstGoal() ? ' for ' + esc(firstGoal().name) : '') + '</button><button class="btn" data-act="redirect" data-id="' + g.id + '" data-to="loan">Deposit in flexi loan</button></div>';
  h += '<button class="btn ghost" data-act="deleteUrge" data-id="' + g.id + '">Delete this log entry</button>';
  openSheet(g.kind === 'attempt' ? 'Attempt' : 'Urge', h);
};
ACTIONS.urgeOutcome = (d) => {
  const g = S.gamingLog.find((x) => x.id === d.id);
  g.outcome = d.v; g.decidedAt = new Date().toISOString();
  closeSheet(); commit(d.v === 'resisted' ? 'Skipped. Noted.' : 'Noted');
  if (d.v === 'resisted') ACTIONS.urgeDecide({ id: g.id });
  else openEntry({ mode: 'expense', prefill: { categoryId: GAMING_CAT, amount: g.amount || '', description: g.item } });
};
ACTIONS.redirect = (d) => {
  const g = S.gamingLog.find((x) => x.id === d.id);
  closeSheet();
  if (d.to === 'goal') { if (!firstGoal()) return toast('Add a goal on the Goals tab first.'); ACTIONS.goalEntry({ goal: firstGoal().id, kind: 'earmark', amount: g.amount }); }
  else openMove('deposit', { prefill: { amount: g.amount, notes: 'Skipped: ' + (g.item || 'gaming purchase') } });
};
ACTIONS.deleteUrge = async (d) => {
  const ok = await confirmBox({ title: 'Delete log entry?', body: 'This removes it from your urge and attempt history.', confirm: 'Delete', danger: true });
  if (!ok) return;
  S.gamingLog = S.gamingLog.filter((x) => x.id !== d.id);
  closeAllSheets(); commit('Deleted');
};
ACTIONS.logAttempt = () => {
  openSheet('Log an attempt', '<form data-form="attempt"><div class="note small">For a purchase you started but did not finish. No money is recorded.</div>' +
    field('What was it?', '<input name="what" autocomplete="off">') + field('Amount (optional)', moneyInput('amount', '')) +
    '<div class="field"><span>What prompted it?</span>' + chipRadio('trigger', Object.entries(C.GAMING_TRIGGERS), '') + '</div>' +
    field('Note', '<textarea name="note"></textarea>') + errorsBox() + '<div class="sticky-actions"><button class="btn primary" type="submit">Log it</button></div></form>');
};
FORMS.attempt = (form) => {
  const amount = optAmount(form, 'amount');
  if (Number.isNaN(amount)) return showErrors(form, ['Amount must be a number, or leave it blank.']);
  S.gamingLog.push({ id: 'g' + C.uid(), kind: 'attempt', date: today(), time: new Date().toTimeString().slice(0, 5), item: fval(form, 'what'), amount: amount || null,
    trigger: (form.querySelector('input[name="trigger"]:checked') || {}).value || '', note: fval(form, 'note') });
  closeSheet(); commit('Attempt logged');
};
ACTIONS.logGamingPurchase = () => openEntry({ mode: 'expense', prefill: { categoryId: GAMING_CAT } });
ACTIONS.logGamingRefund = () => openEntry({ mode: 'refund', prefill: { categoryId: GAMING_CAT } });

// ---------- setup ----------

  const scope = S.settings.budget.scope;

    ? '<div class="field"><span>4. Is ' + money(fx.opening.balance) + ' the utilized balance your lender shows now?</span>' +
      chipRadio('flexiAns', [['yes', 'Yes'], ['new', 'No, it is now…'], ['unsure', 'Not sure']], 'unsure') + moneyInput('flexiNew', '', 'placeholder="Current utilized balance"') + '</div>'

  if (edu) h += edu.opening
    ? '<div class="field"><span>5. Is the education loan still about ' + money(edu.opening.balance) + '?</span>' +
      chipRadio('eduAns', [['yes', 'Yes, confirmed'], ['new', 'No, it is now…'], ['unsure', 'Not sure']], 'unsure') + moneyInput('eduNew', '', 'placeholder="Current balance"') + '</div>'
    : '<div class="field"><span>5. Education-loan balance (optional)</span><input type="hidden" name="eduAns" value="new">' + moneyInput('eduNew', '', 'placeholder="Leave blank if you have none"') + '</div>';
  h += '<div class="field"><span>6. Minimum emergency cash you want to keep (optional)</span>' + moneyInput('emergency', S.settings.emergencyCashTarget || '') + '</div>';
  h += errorsBox() + '<div class="sticky-actions"><button class="btn" type="button" data-act="skipSetup">Skip for now</button><button class="btn primary" type="submit">Save answers</button></div></form>';
  openSheet('Setup', h);
}
ACTIONS.skipSetup = () => { closeSheet(); toast('You can finish setup any time from Settings.'); };
FORMS.setup = (form) => {
  const t = today(), errors = [];
  const num = (n) => { const v = optAmount(form, n); if (Number.isNaN(v) || (v != null && v < 0)) { errors.push('Check the number in "' + n + '".'); return null; } return v; };
  const bank = num('bank'), cash = num('cash'), owed = num('cardOwed'), stmt = num('cardStmt'), flexiNew = num('flexiNew'), eduNew = num('eduNew'), emerg = num('emergency');
  const cardName = fval(form, 'cardName'), cardDue = fval(form, 'cardDue'), stmtDate = fval(form, 'cardStmtDate');
  if (cardName && stmt != null && (!C.isValidDate(cardDue) || !C.isValidDate(stmtDate))) errors.push('For the card statement, enter both the statement date and the due date.');
  const ans = (n) => { const r = form.querySelector('input[name="' + n + '"]:checked') || form.querySelector('input[type="hidden"][name="' + n + '"]'); return r ? r.value : ''; };
  const fx0 = flexiAcct(), edu0 = accountsOf('loan')[0];
  const fa = ans('flexiAns'), ea = ans('eduAns');
  if (fa === 'new' && flexiNew == null && fx0 && fx0.opening) errors.push('Enter the current flexi-loan balance.');
  if (ea === 'new' && eduNew == null && edu0 && edu0.opening) errors.push('Enter the current education-loan balance.');
  if (errors.length) return showErrors(form, [...new Set(errors)]);
  S.settings.budget.scope = (form.querySelector('input[name="scope"]:checked') || {}).value || 'total';
  if (bank != null) C.acct(S, 'bank').opening = { date: t, balance: bank, confirmed: true, source: 'Entered by you' };
  if (cash != null) C.acct(S, 'cash').opening = { date: t, balance: cash, confirmed: true, source: 'Entered by you' };
  if (cardName) {
    const id = 'card-' + C.uid();
    S.accounts.push({ id, kind: 'card', name: cardName, limit: null, opening: owed != null ? { date: t, balance: owed, confirmed: true, source: 'Entered by you' } : { date: t, balance: 0, confirmed: false, source: 'Assumed ₹0 (not entered)' } });
    if (stmt != null) S.statements.push({ id: 'st' + C.uid(), accountId: id, date: stmtDate, dueDate: cardDue, statementBalance: stmt, minimumDue: 0, interestCharged: 0, fees: 0 });
  }
  const fx = flexiAcct();
  if (fx && fa === 'yes') fx.opening = { ...fx.opening, confirmed: true, source: 'Confirmed by you on ' + fmtDate(t, true) };
  if (fx && fa === 'new' && flexiNew != null) fx.opening = { date: t, balance: flexiNew, confirmed: true, source: 'Confirmed by you on ' + fmtDate(t, true) };
  const edu = accountsOf('loan')[0];
  if (edu && ea === 'yes') edu.opening = { ...edu.opening, confirmed: true, source: 'Confirmed by you on ' + fmtDate(t, true) };
  if (edu && ea === 'new' && eduNew != null) edu.opening = { date: t, balance: eduNew, confirmed: true, source: 'Confirmed by you on ' + fmtDate(t, true) };
  if (emerg != null) S.settings.emergencyCashTarget = emerg || null;
  S.settings.setupDone = true;
  closeSheet(); commit('Setup saved');
};

// ---------- settings ----------
ACTIONS.openSettings = () => openSettings();
function openSettings() {
  const s = S.settings, b = s.budget;
  const inScope = C.categoriesInScope(S).filter((c) => !c.system).map((c) => c.name);
  const last = s.lastBackupAt;
  // Backup first: it is the one thing people must be able to find.
  let h = '<div class="eyebrow">Your data</div>' + group(
    row('<b>Back up &amp; restore</b>', '', { sub: last ? 'Last backup ' + fmtDate(last.slice(0, 10), true) : 'No backup yet. Do one now.', icon: ICON.shield, ic: last ? 'good' : 'warn', act: 'openBackup' }) +
    row('Where is my data stored?', '', { icon: ICON.info, ic: 'neutral', act: 'openStorageInfo' }) +
    row(demo ? 'Exit demo mode' : 'Try with demo data', '', { icon: ICON.chart, ic: 'neutral', act: demo ? 'exitDemo' : 'enterDemo', sub: demo ? '' : 'Your real data stays untouched' }), true);
  h += '<div class="eyebrow">Manage</div><div class="group">' +
    row('Categories & planned amounts', '', { act: 'openCategories' }) + row('Accounts', '', { act: 'openAccounts' }) + row('Setup questions', s.setupDone ? badge('Done', 'good') : badge('Not finished', 'warn'), { act: 'openSetup' }) + '</div>';
  h += '<div class="eyebrow">Preferences</div><form data-form="settings">';
  h += '<div class="field"><span>Appearance</span>' + chipRadio('theme', [['dark', 'Dark'], ['light', 'Light'], ['system', 'Match device']], s.theme || 'dark') + '</div>';
  h += '<div class="eyebrow">Monthly budget</div>' + field('Budget amount', moneyInput('budget', b.amount), b.status === 'proposed' ? 'Proposed figure. Saving makes it your own.' : '') +
    '<div class="field" data-change="scopeToggle"><span>What counts toward it</span>' + chipRadio('scope', Object.entries(C.BUDGET_SCOPES), b.scope) + '</div>' +
    '<div data-custom' + (b.scope === 'custom' ? '' : ' hidden') + '>' + chipCheck('custom', S.categories.filter((c) => !c.system).map((c) => [c.id, c.name]), b.custom || []) + '</div>' +
    '<div class="note small"><b>Included now</b>' + esc(inScope.join(', ') || 'None') + '<span>Never included: deposits, withdrawals, card bill payments, transfers, loan interest and fees. Card purchases are always included as expenses.</span></div>';
  h += '<div class="eyebrow">Income (reference only)</div><div class="field-row">' + field('Current salary', moneyInput('salary', s.salary.current)) + field('Year 2 (expected)', moneyInput('year2', s.salary.year2)) + '</div>' +
    field('Year 3 (expected)', moneyInput('year3', s.salary.year3), 'Expected and future salaries are never added to the budget.');
  h += '<div class="eyebrow">Targets</div><div class="field-row">' + field('Emergency cash', moneyInput('emergency', s.emergencyCashTarget || ''), 'Optional') + field(esc(S.settings.gamingName || 'Gaming') + ' target / month', moneyInput('fcTarget', s.fcMonthlyTarget || 0)) + '</div>' +
    field('Tracking started', '<input type="date" name="trackingStart" value="' + esc(s.trackingStart) + '">', 'Spending pace only counts days from here, so a partial first month is judged fairly.');
  h += errorsBox() + '<button class="btn primary" type="submit">Save settings</button></form>';
  h += '<button class="btn danger block" data-act="eraseAll">Erase all data in this browser</button>';
  h += '<p class="small faint" style="text-align:center">SpendWise · data format v' + C.SCHEMA_VERSION + ' · works offline, no account, no bank connection</p>';
  openSheet('Settings', h);
}
CHANGES.scopeToggle = (el) => { const f = el.closest('form'); f.querySelector('[data-custom]').hidden = (f.querySelector('input[name="scope"]:checked') || {}).value !== 'custom'; };
FORMS.settings = (form) => {
  const s = S.settings, errors = [];
  const nums = {};
  ['budget', 'salary', 'year2', 'year3', 'emergency', 'fcTarget'].forEach((n) => { const v = optAmount(form, n); if (Number.isNaN(v) || (v != null && v < 0)) errors.push('Check the number for ' + n + '.'); nums[n] = v; });
  if (!(nums.budget > 0)) errors.push('The budget must be more than ₹0.');
  const ts = fval(form, 'trackingStart');
  if (!C.isValidDate(ts)) errors.push('Enter a valid tracking start date.');
  const scope = (form.querySelector('input[name="scope"]:checked') || {}).value || 'total';
  const custom = fall(form, 'custom');
  if (scope === 'custom' && !custom.length) errors.push('Choose at least one category for a custom budget.');
  if (errors.length) return showErrors(form, errors);
  if (nums.budget !== s.budget.amount || scope !== s.budget.scope) s.budget.status = 'set';
  s.budget.amount = nums.budget; s.budget.scope = scope; s.budget.custom = custom;
  s.theme = (form.querySelector('input[name="theme"]:checked') || {}).value || 'dark';
  if (nums.salary != null) s.salary.current = nums.salary;
  if (nums.year2 != null) s.salary.year2 = nums.year2;
  if (nums.year3 != null) s.salary.year3 = nums.year3;
  s.emergencyCashTarget = nums.emergency || null;
  s.fcMonthlyTarget = nums.fcTarget || 0;
  s.trackingStart = ts;
  closeSheet(); commit('Settings saved');
};

ACTIONS.openCategories = () => {
  const rows = S.categories.filter((c) => !c.system).map((c) =>
    '<div class="group card" style="gap:10px"><div class="field-row">' + field('Name', '<input name="name-' + c.id + '" value="' + esc(c.name) + '">') +
    field('Type', selectInput('group-' + c.id, [['living', 'Living'], ['discretionary', 'Discretionary']], c.group)) + '</div>' +

    field('Subcategories', '<input name="subs-' + c.id + '" value="' + esc((c.subcategories || []).join(', ')) + '" placeholder="comma, separated">') + '</div>' +
    (c.builtin === false || c.custom ? '<button class="btn ghost" type="button" data-act="deleteCategory" data-id="' + c.id + '">Delete category</button>' : '') + '</div>').join('');
  openSheet('Categories', '<form data-form="categories"><div class="note small">"Planned" holds the monthly amounts you reported. They are used for "actual vs planned", never as spending.</div>' + rows +
    '<div class="group card"><div class="eyebrow">New category</div><div class="field-row">' + field('Name', '<input name="newName" placeholder="e.g. Rent">') + field('Type', selectInput('newGroup', [['living', 'Living'], ['discretionary', 'Discretionary']], 'living')) + '</div></div>' +
    errorsBox() + '<div class="sticky-actions"><button class="btn primary" type="submit">Save categories</button></div></form>');
};
FORMS.categories = (form) => {
  const errors = [];
  S.categories.filter((c) => !c.system).forEach((c) => {
    const name = fval(form, 'name-' + c.id);
    if (!name) errors.push('Category names cannot be empty.');
    const plan = optAmount(form, 'plan-' + c.id);
    if (Number.isNaN(plan) || (plan != null && plan < 0)) errors.push('Planned amount for ' + c.name + ' must be a number.');
    if (errors.length) return;
    c.name = name; c.group = fval(form, 'group-' + c.id); c.plan = plan || 0;
    c.subcategories = fval(form, 'subs-' + c.id).split(',').map((x) => x.trim()).filter(Boolean);
  });
  const nn = fval(form, 'newName');
  if (nn) {
    if (S.categories.some((c) => c.name.toLowerCase() === nn.toLowerCase())) errors.push('A category called ' + nn + ' already exists.');
    else S.categories.push({ id: 'c-' + C.uid(), name: nn, group: fval(form, 'newGroup'), subcategories: [], custom: true });
  }
  if (errors.length) return showErrors(form, [...new Set(errors)]);
  closeSheet(); commit('Categories saved');
};
ACTIONS.deleteCategory = async (d) => {
  const c = C.cat(S, d.id);
  const used = S.transactions.some((x) => x.categoryId === c.id);
  const ok = await confirmBox({ title: 'Delete ' + esc(c.name) + '?', body: used ? 'It has entries. It will be hidden from the entry form but kept on existing entries.' : 'It has no entries and will be deleted.', confirm: 'Delete', danger: true });
  if (!ok) return;
  if (used) c.hidden = true; else S.categories = S.categories.filter((x) => x.id !== c.id);
  closeAllSheets(); commit('Category removed');
};
ACTIONS.openAccounts = () => {

    const i = C.balanceInfo(S, a.id, t);
    return row(esc(a.name), money(i.balance) + ' ' + STATUS_BADGE[i.status], { sub: C.ACCOUNT_KINDS[a.kind].label, act: 'editAccount', data: { id: a.id } });
  }).join('') + '</div><button class="btn block" data-act="addAccount">Add account</button>');

// ---------- backup & restore ----------
let pendingRestore = null;
ACTIONS.openBackup = () => {
  closeAllSheets();
  openSheet('Backup & restore',
    '<div class="eyebrow">Save a copy</div><div class="btn-row"><button class="btn primary" data-act="dlBackup">Download backup (.json)</button><button class="btn" data-act="copyBackup">Copy backup text</button></div>' +
    '<textarea id="backup-text" hidden readonly aria-label="Backup text"></textarea>' +
    '<div class="btn-row"><button class="btn" data-act="dlCsv" data-only="1">Expenses CSV</button><button class="btn" data-act="dlCsv">All transactions CSV</button></div>' +
    '<p class="small faint">The backup includes settings, accounts, categories, statements, goals, gaming log and every transaction. CSV files open in Numbers, Excel or Google Sheets.</p>' +
    '<div class="eyebrow">Restore</div><form data-form="restoreRead">' + field('Backup file', '<input type="file" name="file" accept=".json,application/json,text/plain">') +
    field('…or paste backup text', '<textarea name="text"></textarea>') + errorsBox() + '<button class="btn" type="submit">Check backup</button></form><div id="restore-review"></div>');
};
ACTIONS.dlBackup = async () => {
  const name = 'spendwise-backup-' + today() + '.json';
  const res = await saveFile(name, C.exportBackup(S), 'application/json');
  if (res === 'saved') { S.settings.lastBackupAt = new Date().toISOString(); save(); render(); toast('Backup saved as ' + name); }
  else if (res === 'declined') toast('Backup not saved.');
  else toast('This browser blocked the download. Use Copy backup text instead.');
};
ACTIONS.copyBackup = async () => {
  const text = C.exportBackup(S);
  const ta = $('#backup-text'); ta.value = text;
  const ok = await copyText(text, ta);
  if (ok) { S.settings.lastBackupAt = new Date().toISOString(); save(); toast('Backup copied. Paste it into Notes or a file to keep it.'); }
  else toast('Select the text below and copy it.');
};
ACTIONS.dlCsv = async (d) => {
  const only = !!d.only;
  const res = await saveFile((only ? 'expenses-' : 'transactions-') + today() + '.csv', C.exportTransactionsCSV(S, { spendingOnly: only }), 'text/csv');
  toast(res === 'saved' ? 'CSV saved' : res === 'declined' ? 'Not saved' : 'This browser blocked the download.');
};
FORMS.restoreRead = async (form) => {
  let text = fval(form, 'text');
  const file = form.elements.file.files[0];
  if (file) { try { text = await file.text(); } catch (e) { return showErrors(form, ['Could not read that file.']); } }
  if (!text) return showErrors(form, ['Choose a backup file or paste its text.']);
  const v = C.validateBackup(text);
  if (!v.ok) { pendingRestore = null; $('#restore-review').innerHTML = ''; return showErrors(form, ['This backup cannot be restored:'].concat(v.errors)); }
  showErrors(form, []);
  pendingRestore = v.data;
  const exp = v.data.exportedAt ? fmtDate(v.data.exportedAt.slice(0, 10), true) : 'unknown date';
  $('#restore-review').innerHTML = '<div class="note good"><b>Backup looks valid</b>Exported ' + esc(exp) + ' · ' + plural(v.counts.transactions, 'transaction') + ', ' + plural(v.counts.accounts, 'account') + ', ' + plural(v.counts.statements, 'statement') + '.</div>' +
    '<div class="btn-row"><button class="btn" data-act="restoreMerge">Merge into current data</button><button class="btn danger" data-act="restoreReplace">Replace everything</button></div>' +
    '<p class="small faint">Merge adds entries that are not already here (matched by their id) and flags look-alikes for review. Replace swaps all current data for the backup.</p>';
};
ACTIONS.restoreReplace = async () => {
  if (!pendingRestore) return;
  const ok = await confirmBox({ title: 'Replace all data?', body: 'Everything currently in the app (' + plural(S.transactions.length, 'transaction') + ') is replaced by the backup (' + plural(pendingRestore.transactions.length, 'transaction') + '). Download a backup of the current data first if you might need it.', confirm: 'Replace', danger: true });
  if (!ok) return;
  S = C.migrate(pendingRestore); pendingRestore = null;
  if (!S.transactions.length) S.settings.trackingStart = today();
  closeAllSheets(); commit('Backup restored');
  if (!S.settings.setupDone) openSetup();
};
ACTIONS.restoreMerge = () => {
  if (!pendingRestore) return;
  const r = C.mergeBackup(S, pendingRestore); pendingRestore = null;
  closeAllSheets(); commit(plural(r.added, 'entry').replace('entrys', 'entries') + ' added, ' + r.skipped + ' already here' + (r.possibleDuplicates ? '. ' + r.possibleDuplicates + ' possible duplicates in Needs review.' : '.'));
};
ACTIONS.eraseAll = async () => {
  const ok = await confirmBox({ title: 'Erase all data?', body: 'This deletes every entry, account, statement and setting in this browser' + (demo ? ' (demo slot)' : '') + '. It cannot be undone. Download a backup first if you want to keep anything.', confirm: 'Erase everything', danger: true, typed: 'ERASE' });
  if (!ok) return;
  S = demo ? makeDemoState() : C.createDefaultState(today());
  closeAllSheets(); commit('All data erased');
};

// ---------- demo mode ----------
ACTIONS.enterDemo = () => {
  save();
  demo = true; writeMeta({ ...readMeta(), demo: true });
  S = makeDemoState(); save();
  closeAllSheets(); render(); toast('Demo data loaded. Your real data is untouched.');
};
ACTIONS.exitDemo = () => {
  try { localStorage.removeItem(DEMO_KEY); } catch (e) { /* ignore */ }
  writeMeta({ ...readMeta(), demo: false });
  load(); closeAllSheets(); render(); toast('Back to your data');
};
function makeDemoState() {
  const t = today();
  const s = C.createDefaultState(C.addDays(t, -40));
  s.settings.setupDone = true;
  s.settings.trackingStart = C.addDays(t, -40);
  const start = C.addDays(t, -40);
  C.acct(s, 'bank').opening = { date: start, balance: 8000, confirmed: true, source: 'Demo' };
  C.acct(s, 'cash').opening = { date: start, balance: 1200, confirmed: true, source: 'Demo' };
  C.acct(s, 'flexi').opening = { date: start, balance: 430000, confirmed: true, source: 'Demo' };
  C.acct(s, 'flexi').rate = 15;
  if (!s.goals.length) s.goals.push({ id: 'demo-goal', name: 'Console', target: 35000, targetStatus: 'set', monthlyContribution: 0, accountId: null, entries: [], createdAt: start });
  s.accounts.push({ id: 'democard', kind: 'card', name: 'Demo Card', limit: 90000, statementDay: 10, dueDay: 30, opening: { date: start, balance: 4200, confirmed: true, source: 'Demo' } });
  const d = (n) => C.addDays(t, -n);
  C.addSalaryDay(s, { amount: 45000, date: d(38), bankId: 'bank', flexiId: 'flexi' });
  C.addTx(s, { type: 'flexi_withdrawal', amount: 12000, date: d(36), from: 'flexi', to: 'bank', purpose: 'living' });
  C.addCardPaymentFromFlexi(s, { cardId: 'democard', flexiId: 'flexi', amount: 4200, date: d(30) });
  C.addSalaryDay(s, { amount: 45000, date: d(8), bankId: 'bank', flexiId: 'flexi' });
  C.addTx(s, { type: 'flexi_withdrawal', amount: 10000, date: d(6), from: 'flexi', to: 'bank', purpose: 'living' });
  C.addTx(s, { type: 'flexi_withdrawal', amount: 3000, date: d(2), from: 'flexi', to: 'cash' });
  C.addTx(s, { type: 'loan_interest', amount: 6100, date: d(25), from: 'flexi', description: 'Interest per statement' });
  const items = [[39, 'gym_supplements', 3300, 'upi', 'Whey 2kg'], [37, 'eggs', 750, 'upi', 'Eggs 60'], [35, 'milk', 1250, 'upi', 'Milk subscription'], [33, 'food_supplies', 2400, 'credit_card', 'Groceries'],
    [31, 'transport', 600, 'upi', 'Auto'], [28, 'eating_out', 450, 'upi', 'Dinner'], [26, 'food_supplies', 1900, 'credit_card', 'Groceries'], [24, 'eggs', 750, 'upi', 'Eggs 60'], [21, 'subscriptions', 199, 'credit_card', 'Music'],
    [19, 'utilities', 799, 'upi', 'Phone & internet'], [16, 'food_supplies', 2100, 'upi', 'Groceries'], [12, 'gaming', 800, 'upi', 'Season pass'], [9, 'gym_supplements', 3300, 'credit_card', 'Whey 2kg'],
    [7, 'eggs', 750, 'cash', 'Eggs 60'], [6, 'milk', 1250, 'upi', 'Milk subscription'], [5, 'food_supplies', 2600, 'credit_card', 'Groceries'], [3, 'eating_out', 380, 'cash', 'Snacks'], [1, 'transport', 300, 'cash', 'Auto']];
  items.forEach(([n, c, a, m, desc]) => C.addTx(s, { type: m === 'credit_card' ? 'cc_purchase' : 'expense', amount: a, date: d(n), from: m === 'credit_card' ? 'democard' : m === 'cash' ? 'cash' : 'bank', categoryId: c, method: m, description: desc, recurring: c === 'milk' }));
  s.statements.push({ id: 'demost', accountId: 'democard', date: d(18), dueDate: C.addDays(t, 3), statementBalance: 4499, minimumDue: 450, closingBalance: 4499, interestCharged: 0, fees: 0 });
  s.goals[0].entries.push({ id: 'de1', kind: 'earmark', amount: 3000, date: d(10), note: 'Skipped a pack' });
  s.gamingLog.push({ id: 'dg1', kind: 'urge', date: d(10), time: '22:40', item: 'Icon pack', amount: 3000, trigger: 'limited_offer', coolOffUntil: new Date(Date.now() - 9 * 864e5).toISOString(), outcome: 'resisted' });
  return s;
}

function openWelcome() {
  openSheet('Welcome',
    '<div class="welcome">' + logoImg() + '<h3>SpendWise</h3><span class="muted small">Everything you enter stays on this device. Nothing is sent anywhere.</span></div>' +
    '<div class="group">' +
    row('<b>Load my starter file</b>', '', { act: 'openBackup', sub: 'Your figures from a .json file (starter or backup)' }) +
    row('Start empty', '', { act: 'welcomeFresh', sub: 'Enter your own figures in setup' }) + '</div>' +
    '<p class="small faint">Opening it from the Home Screen? Load the file there, not in a Safari tab: the two keep separate data.</p>');
}
ACTIONS.welcomeFresh = () => { closeSheet(); openSetup(); };

// ---------- boot ----------
function boot() {
  load();
  const tab = ([k, l]) => '<button type="button" class="tab" data-act="tab" data-tab="' + k + '" aria-label="' + l + '">' + ICON[k] + '<span>' + l + '</span></button>';
  $('#tabs').innerHTML = TABS.slice(0, 2).map(tab).join('') +
    '<button type="button" class="add" data-act="quickAdd" aria-label="Add an entry">' + ICON.plus + '</button>' + TABS.slice(2).map(tab).join('');
  initEvents();
  initTooltips();
  initSwipeBack();
  render();
  const meta = readMeta();
  if (!S.settings.setupDone && !S.transactions.length && !meta.setupPrompted) {
    writeMeta({ ...meta, setupPrompted: true });
    if (window.RUPEE_PROFILE) openSetup(); else openWelcome();
  }
  setInterval(() => { if (ui.tab === 'goals' && !openWraps().length) render(); }, 60 * 1e3);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'system') applyTheme(); });
}
boot();

})();
</script>
