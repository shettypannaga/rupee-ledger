// ---------- file save / copy ----------
async function saveFile(filename, text, mime) {
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({ filename, data: text }); return 'saved'; }
    } catch (e) {
      if (e && e.code === 'declined') return 'declined';
      if (e && e.code === 'rejected_extension') return 'unsupported';
    }
  }
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare) {
    try {
      const file = new File([text], filename, { type: mime || 'text/plain' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'saved'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
  }
  try {
    const blob = new Blob([text], { type: mime || 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
    return 'saved';
  } catch (e) { return 'failed'; }
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.focus(); fallbackEl.select(); }
    return false;
  }
}
function icsFile(title, whenDate, description) {
  const stamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const clean = (s) => String(s).replace(/[,;\\]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Rupee Ledger//EN', 'BEGIN:VEVENT', 'UID:' + C.uid() + '@rupee-ledger',
    'DTSTAMP:' + stamp(new Date()), 'DTSTART:' + stamp(whenDate), 'DURATION:PT15M', 'SUMMARY:' + clean(title), 'DESCRIPTION:' + clean(description || ''),
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:' + clean(title), 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
async function offerReminder(title, when, description) {
  const res = await saveFile('reminder.ics', icsFile(title, when, description), 'text/calendar');
  if (res === 'saved') toast('Open the downloaded file to add it to your calendar.');
  else if (res === 'unsupported' || res === 'failed') toast('Calendar files cannot be saved here. Set a phone reminder for ' + when.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) + '.');
}

// ---------- charts (inline SVG, single hue, hover/tap tooltips via data-tip) ----------
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function topRoundedBar(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  if (h <= 0) return '';
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
// data: [{label, value (null = no data), tip, cls}]
function barChart(data, opts) {
  opts = opts || {};
  const W = 340, H = opts.h || 150, padL = 4, padR = 4, top = opts.ref ? 24 : 16, bottom = 20;
  const vals = data.map((d) => d.value || 0);
  const max = niceMax(Math.max(opts.ref || 0, ...vals));
  const n = data.length, slot = (W - padL - padR) / n, bw = Math.max(2, Math.min(26, slot * 0.62));
  const y = (v) => top + (H - top - bottom) * (1 - v / max);
  const every = opts.labelEvery || 1;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria || 'Bar chart') + '">';
  s += '<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(max) + '" y2="' + y(max) + '"/>';
  s += '<text x="' + padL + '" y="' + (y(max) - 4) + '">' + esc(compact(max)) + '</text>';
  s += '<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(max / 2) + '" y2="' + y(max / 2) + '"/>';
  data.forEach((d, i) => {
    const cx = padL + slot * i + slot / 2;
    s += '<g class="col" data-tip="' + esc(d.tip || (d.label + ': ' + (d.value == null ? 'No data recorded' : money(d.value)))) + '">';
    s += '<rect class="hit" x="' + (padL + slot * i) + '" y="' + top + '" width="' + slot + '" height="' + (H - top) + '"/>';
    if (d.value == null) {
      if (opts.showNoData) s += '<text class="nodata" x="' + cx + '" y="' + (H - bottom - 6) + '" text-anchor="middle">No data</text>';
    } else if (d.value > 0) {
      s += '<path class="bar ' + (d.cls || '') + '" d="' + topRoundedBar(cx - bw / 2, y(d.value), bw, H - bottom - y(d.value), 4) + '"/>';
    }
    if (i % every === 0 || i === n - 1) s += '<text x="' + cx + '" y="' + (H - 5) + '" text-anchor="middle">' + esc(d.label) + '</text>';
    s += '</g>';
  });
  s += '<line class="base" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (H - bottom) + '" y2="' + (H - bottom) + '"/>';
  if (opts.ref) {
    s += '<line class="ref" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(opts.ref) + '" y2="' + y(opts.ref) + '"/>';
    // Label sits in the top margin, keyed by a dash sample, so it never collides with bars.
    const keyX = W - padR - (opts.refLabel || '').length * 5.2 - 6;
    s += '<line class="ref" x1="' + (keyX - 14) + '" x2="' + keyX + '" y1="' + (top - 7.5) + '" y2="' + (top - 7.5) + '"/>';
    s += '<text class="ref-label" x="' + (W - padR) + '" y="' + (top - 4) + '" text-anchor="end">' + esc(opts.refLabel || '') + '</text>';
  }
  return s + '</svg>';
}
// points: [{x: 'YYYY-MM-DD', y}]
function lineChart(points, opts) {
  opts = opts || {};
  if (points.length < 2) return '<p class="chart-caption">The chart appears once there are at least two days of balance history.</p>';
  const W = 340, H = opts.h || 160, padL = 4, padR = 6, top = 18, bottom = 20;
  const ys = points.map((p) => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) { hi += 1000; lo -= 1000; }
  const span = hi - lo; lo -= span * 0.12; hi += span * 0.12;
  const x = (i) => padL + (W - padL - padR) * (i / (points.length - 1));
  const y = (v) => top + (H - top - bottom) * (1 - (v - lo) / (hi - lo));
  const path = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.y).toFixed(1)).join('');
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria || 'Line chart') + '">';
  [hi - span * 0.12, lo + span * 0.12].forEach((v) => {
    s += '<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    s += '<text x="' + padL + '" y="' + (y(v) - 4) + '">' + esc(compact(v)) + '</text>';
  });
  s += '<path class="area" d="' + path + 'L' + x(points.length - 1) + ',' + (H - bottom) + 'L' + x(0) + ',' + (H - bottom) + 'Z"/>';
  s += '<path class="line" d="' + path + '"/>';
  const last = points[points.length - 1];
  s += '<circle class="endpoint" cx="' + x(points.length - 1) + '" cy="' + y(last.y) + '" r="4.5"/>';
  const step = (W - padL - padR) / (points.length - 1);
  points.forEach((p, i) => {
    s += '<rect class="hit" x="' + (x(i) - step / 2) + '" y="' + top + '" width="' + step + '" height="' + (H - top - bottom) + '" data-tip="' + esc(fmtDate(p.x) + '\n' + (opts.fmt || money)(p.y) + (p.note ? '\n' + p.note : '')) + '"/>';
  });
  s += '<text x="' + padL + '" y="' + (H - 5) + '">' + esc(fmtDate(points[0].x)) + '</text>';
  s += '<text x="' + (W - padR) + '" y="' + (H - 5) + '" text-anchor="end">' + esc(fmtDate(last.x)) + '</text>';
  return s + '</svg>';
}
function hbars(items, opts) {
  opts = opts || {};
  if (!items.length) return '<div class="empty small">No data recorded for this period.</div>';
  const max = Math.max(...items.map((i) => Math.max(i.value, i.plan || 0)), 1);
  return '<div class="hbars">' + items.map((i) =>
    '<div class="hbar" data-tip="' + esc(i.name + ': ' + money(i.value) + (i.plan ? '\nPlanned: ' + money(i.plan) : '')) + '">' +
    '<div class="top"><span class="name">' + esc(i.name) + '</span><span class="tnum">' + money(i.value) + (i.plan ? ' <span class="faint">/ ' + money(i.plan) + '</span>' : '') + '</span></div>' +
    '<div class="track"><div class="fill" style="width:' + Math.max(0, (i.value / max) * 100).toFixed(1) + '%"></div>' +
    (i.plan ? '<div class="plan" style="left:calc(' + ((i.plan / max) * 100).toFixed(1) + '% - 1px)"></div>' : '') + '</div></div>').join('') +
    (opts.legend ? '<div class="legend"><span><i style="background:var(--series)"></i>Actual</span><span><i style="background:var(--fg-2);width:2px"></i>Planned (reported monthly amount)</span></div>' : '') + '</div>';
}

// Tooltip layer: works with mouse hover and with a tap on phones.
function initTooltips() {
  const tip = $('#tip');
  let pinned = null;
  const show = (el, x, y) => {
    tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + 'px';
    tip.style.top = Math.max(8, y - r.height - 12) + 'px';
  };
  document.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) show(el, e.clientX, e.clientY); else if (!pinned) tip.hidden = true;
  });
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && e.pointerType !== 'mouse') { pinned = el; show(el, e.clientX, e.clientY); }
    else { pinned = null; tip.hidden = true; }
  });
  window.addEventListener('scroll', () => { pinned = null; tip.hidden = true; }, { passive: true });
}

// ---------- global event delegation ----------
function initEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
    fn(el.dataset, el, e);
  });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const fn = FORMS[form.dataset.form];
    if (fn) fn(form, e.submitter);
  });
  const onChange = (e) => {
    const el = e.target.closest('[data-change]');
    if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
  };
  document.addEventListener('change', onChange);
  document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && CHANGES[el.dataset.input]) CHANGES[el.dataset.input](el, e); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheets').children.length) closeSheet(); });
}

}
ACTIONS.monthPrev = () => { ui.month = C.addMonths(ui.month, -1); render(); };
ACTIONS.monthNext = () => { if (ui.month < C.monthKey(today())) { ui.month = C.addMonths(ui.month, 1); render(); } };
ACTIONS.tab = (d) => { ui.tab = d.tab; render(); window.scrollTo(0, 0); };
ACTIONS.gotoTab = (d) => { ui.tab = d.tab; if (d.view) ui.exp.view = d.view; render(); window.scrollTo(0, 0); };

function row(label, value, opts) {
  opts = opts || {};
  const tag = opts.act ? 'button' : 'div';
  const attrs = opts.act ? ' type="button" data-act="' + opts.act + '"' + Object.entries(opts.data || {}).map(([k, v]) => ' data-' + k + '="' + esc(v) + '"').join('') : '';
  return '<' + tag + ' class="row ' + (opts.cls || '') + '"' + attrs + '>' +
    (opts.dot ? '<span class="dot" style="background:' + opts.dot + '"></span>' : '') +
    '<span class="label">' + label + (opts.sub ? '<span class="sub">' + opts.sub + '</span>' : '') + '</span>' +
    '<span class="value">' + value + (opts.vsub ? '<span class="sub">' + opts.vsub + '</span>' : '') + '</span>' +
    (opts.act ? '<span class="chev">' + ICON.chev + '</span>' : '') + '</' + tag + '>';
}
const section = (title, body, end) => '<div class="section"><div class="eyebrow">' + title + (end ? '<span class="end">' + end + '</span>' : '') + '</div>' + body + '</div>';

// ---------- Overview ----------
VIEWS.overview = function () {
  const t = today(), mk = ui.month, isCur = mk === C.monthKey(t);
  const b = C.budgetStatus(S, mk, t);
  const tot = C.monthTotals(S, mk, t);
  const ms = C.monthStart(mk), me = C.monthEnd(mk);
  const asOf = isCur ? t : me;
  let h = monthNav();

  h += alertsBlock(t);

  // Hero: spending against the chosen budget.
  const over = b.spent > b.budget;
  const fillPct = b.budget > 0 ? Math.min(100, (b.spent / b.budget) * 100) : 0;
  const timePct = b.daysTotal > 0 ? (b.daysElapsed / b.daysTotal) * 100 : 0;
  h += '<div class="group hero">';
  h += '<div class="kicker">Spent in ' + fmtMonth(mk) + ' · ' + esc(C.BUDGET_SCOPES[b.scope]) + '</div>';
  h += b.hasData ? '<div class="big num">' + money(b.spent, { dp: 0 }) + '</div>' : '<div class="big mid">No data recorded</div>';
  h += '<div class="line"><span>Budget <b class="num">' + money(b.budget) + '</b> ' + (S.settings.budget.status === 'proposed' ? badge('Proposed') : '') + '</span>' +
    (b.hasData ? '<span>' + (over ? '<b class="bad">' + money(-b.remaining) + ' over</b>' : '<b>' + money(b.remaining) + '</b> left') + '</span>' : '') + '</div>';
  h += '<div class="meter' + (over ? ' over' : '') + '" role="img" aria-label="' + pct(b.spent / b.budget) + ' of budget used, ' + Math.round(timePct) + '% of month passed"><div class="fill" style="width:' + fillPct.toFixed(1) + '%"></div>' +
    (isCur ? '<div class="tick" style="left:calc(' + timePct.toFixed(1) + '% - 1px)"></div>' : '') + '</div>';
  if (isCur) h += '<div class="meter-legend"><span>' + pct(b.spent / b.budget) + ' used</span><span>Marker: day ' + b.daysElapsed + ' of ' + b.daysTotal + '</span></div>';
  if (b.hasData && isCur) {
    const pace = b.paceDelta > 0
      ? '<span class="warn">' + money(b.paceDelta) + ' ahead of an even pace</span>'
      : '<span class="good">' + money(-b.paceDelta) + ' under an even pace</span>';
    h += '<div class="line">' + pace + (b.perDayLeft != null ? '<span>' + (b.perDayLeft >= 0 ? money(b.perDayLeft) + '/day for ' + plural(b.daysLeft, 'day') : 'No room left this month') + '</span>' : '') + '</div>';
  }
  h += '</div>';
  h += verdictNote(b, isCur);

  // This month
  const food = C.totalSpending(S, ms, me, (x) => { const c = C.cat(S, x.categoryId); return c && c.food; });
  const disc = C.totalSpending(S, ms, me, (x) => C.isDiscretionary(S, x));
  const gs = C.gamingStats(S, mk);
  const fcTarget = S.settings.fcMonthlyTarget || 0;
  h += section('This month',
    '<div class="group">' +
    row('Daily average', b.dailyAvg != null && b.hasData ? money(b.dailyAvg) : '—', { sub: b.hasData ? 'Across ' + plural(b.daysElapsed, 'tracked day') : 'No data recorded' }) +
    row('Food & supplements', b.hasData ? money(food) : '—', { sub: b.plannedFood ? 'Reported plan ' + money(b.plannedFood) + '/month' : 'Food, eggs, milk and supplements', act: 'gotoTab', data: { tab: 'reports' } }) +
    row('Discretionary', b.hasData ? money(disc) : '—', { sub: 'By category or tag', act: 'gotoTab', data: { tab: 'reports' } }) +
    row(esc(gameLabel()), money(gs.monthNet) + ' ' + (gs.monthNet <= fcTarget ? badge('On target', 'good') : badge('Above ' + money(fcTarget) + ' target', 'warn')),
      { sub: 'Target ' + money(fcTarget) + '/month', act: 'gotoTab', data: { tab: 'goals' } }) +
    row('Income received', tot.income ? money(tot.income) : '—', { sub: tot.income ? 'Salary and other income' : 'No income recorded' }) +
    '</div>');

  // Debt & cards
  const fx = flexiAcct();
  let debt = '';
  if (fx) {
    const info = C.balanceInfo(S, fx.id, asOf);
    const fm = C.flexiMonth(S, fx.id, mk, t);
    debt += row('Flexi loan utilized', money(info.balance) + ' ' + STATUS_BADGE[info.status], { sub: 'Est. interest ' + (isCur ? 'this month ' : '') + money(fm.estInterestMonth) + ' at ' + fx.rate + '%', act: 'gotoTab', data: { tab: 'loans' } });
    debt += row('Interest saved by parking deposits', money(fm.estSavedToDate) + ' ' + badge('Estimate'), { sub: 'Only for days deposits stayed in the loan', act: 'gotoTab', data: { tab: 'loans' } });
  }
  const cards = accountsOf('card');
  if (cards.length) {
    const sums = cards.map((c) => C.cardSummary(S, c.id, t));
    const owed = C.sum(sums.map((s) => s.balance || 0));
    const dues = sums.filter((s) => s.latest && s.remaining > 0 && s.daysToDue != null).sort((a, b2) => a.daysToDue - b2.daysToDue);
    debt += row('Credit cards owed', money(owed), {
      sub: dues.length ? 'Next due ' + fmtDate(dues[0].latest.dueDate) + ' · ' + money(dues[0].remaining) + ' on ' + esc(dues[0].card.name) : sums.some((s) => s.latest) ? 'Latest statements paid' : 'No statement entered yet',
      act: 'gotoTab', data: { tab: 'cards' } });
  } else {
    debt += row('Credit cards', '<span class="faint">None added</span>', { sub: 'Add your cards to track bills separately from spending', act: 'gotoTab', data: { tab: 'cards' } });
  }
  h += section('Debt', '<div class="group">' + debt + '</div>');

  // Recent flexi movements
  if (fx) {
    const recent = S.transactions.filter((x) => C.effectOn(S, x, fx.id) !== 0).sort(C.txSort).reverse().slice(0, 4);
    h += section('Recent loan deposits & withdrawals',
      recent.length ? '<div class="group">' + recent.map((x) => txRow(x)).join('') + '</div>'
        : '<div class="group"><div class="empty small">No flexi-loan movements recorded yet. Use <b>Add → Move money → Salary day</b> when your salary arrives.</div></div>',
      '<button class="link" data-act="gotoTab" data-tab="loans">Loan ledger</button>');
  }

  // First savings goal
  const g = firstGoal();
  if (g) {
    const p = C.goalProgress(S, g, t);
    h += section(esc(g.name) + ' fund',
      '<button class="group card" style="text-align:left;border:0;color:inherit;width:100%" data-act="gotoTab" data-tab="goals">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="num" style="font-size:22px;font-weight:650">' + money(p.total) + '</span><span class="muted small">of ' + money(g.target) + (g.targetStatus === 'illustrative' ? ' (illustrative)' : '') + '</span></div>' +
      '<div class="stack-bar" aria-hidden="true">' + (p.saved > 0 ? '<div class="saved" style="width:' + (p.saved / g.target * 100).toFixed(1) + '%"></div>' : '') + (p.earmarked > 0 ? '<div class="earm" style="width:' + (p.earmarked / g.target * 100).toFixed(1) + '%"></div>' : '') + '</div>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>Saved ' + money(p.saved) + '</span><span><i style="background:color-mix(in srgb,var(--accent) 40%,transparent)"></i>Earmarked ' + money(p.earmarked) + '</span><span>' + pct(p.pct) + '</span></div></button>');
  }

  // Separated totals
  h += section('How money moved in ' + fmtMonthShort(mk),
    '<div class="group">' +
    row('1. Actual spending', tot.hasSpendingData ? money(tot.spending) : 'No data', { sub: 'Purchases and services, net of refunds' }) +
    row('2. Income received', money(tot.income)) +
    row('3. Flexi-loan deposits', money(tot.flexiDeposits), { sub: 'Lower the utilized balance while they stay' }) +
    row('&nbsp;&nbsp;&nbsp;Flexi-loan withdrawals', money(tot.flexiWithdrawals), { sub: 'Borrowing again; not spending by itself' }) +
    row('4. Credit-card purchases', money(tot.cardPurchases), { sub: 'Already included in spending' }) +
    row('5. Credit-card payments', money(tot.cardPayments), { sub: 'Settle the card; not new spending' }) +
    row('6. Loan interest & fees', money(tot.interest + tot.fees), { sub: 'From statements you entered' }) +
    row('7. Confirmed debt reduction', tot.confirmedDebtReduction != null ? money(tot.confirmedDebtReduction) : '<span class="faint">Needs statements</span>', { sub: 'Between two confirmed lender balances' }) +
    row('8. Est. interest saved', money(tot.estInterestSaved) + ' ' + badge('Estimate'), { sub: 'From temporarily parked deposits' }) +
    '</div>');
  return h;
};

function verdictNote(b, isCur) {
  const lines = [];
  let cls = 'info';
  if (b.verdict === 'no_data') lines.push('<b>No expenses recorded for this month.</b>' + (isCur ? 'Log purchases as they happen. After a week of entries the app will tell you whether ' + money(b.budget) + ' looks realistic.' : ''));
  else if (b.verdict === 'too_early') lines.push('<b>Too early to judge.</b>' + plural(b.daysElapsed, 'day') + ' and ' + plural(b.txCount, 'entry').replace('entrys', 'entries') + ' so far. A verdict appears after 7 days and 3 entries.');
  else if (b.verdict === 'on_track') { cls = 'good'; lines.push('<b>On track.</b>At your recorded pace you would spend about ' + money(b.projected) + ' ' + (isCur ? 'this month' : 'in the month') + '.'); }
  else if (b.verdict === 'tight') { cls = 'warn'; lines.push('<b>Tight.</b>At your recorded pace you would spend about ' + money(b.projected) + ', just over ' + money(b.budget) + '.'); }
  else { cls = 'warn'; lines.push('<b>Not on track.</b>At your recorded pace you would spend about ' + money(b.projected) + ', which is ' + money(b.projected - b.budget) + ' over ' + money(b.budget) + '.'); }
  if (b.plannedInScope > 0) {
    lines.push(b.plannedLeftover > 0
      ? 'Your reported food & supplement costs (' + money(b.plannedInScope) + '/month) count toward this budget, leaving ' + money(b.plannedLeftover) + ' for everything else in it.'
      : 'Your reported food & supplement costs (' + money(b.plannedInScope) + '/month) already exceed this budget on their own.');
  }
  if (b.partialMonth) lines.push('Tracking started on ' + fmtDate(S.settings.trackingStart) + ', so pace uses ' + plural(b.daysTotal, 'day') + ' of this month.');
  return '<div class="note ' + cls + '" style="margin-top:8px">' + lines.join('<span></span>') + '</div>';
}

function alertsBlock(t) {
  const items = [];
  if (!S.settings.setupDone) items.push('<div class="row alert-row"><span class="sev info"></span><span class="label">Finish setup<span class="sub">A few questions about balances, cards and what the budget covers. You can skip any of them.</span></span><button class="btn primary" data-act="openSetup" style="min-height:34px;padding:6px 12px">Start</button></div>');
  const q = C.reviewQueue(S, t);
  const sevRank = { critical: 0, warn: 1, info: 2 };
  q.sort((a, b) => sevRank[a.severity] - sevRank[b.severity]).slice(0, 3).forEach((it) => {
    items.push('<button class="row alert-row" data-act="gotoTab" data-tab="expenses" data-view="review"><span class="sev ' + it.severity + '"></span><span class="label">' + esc(it.title) +
      '<span class="sub">' + esc(reviewShort(it)) + '</span></span><span class="chev">' + ICON.chev + '</span></button>');
  });
  if (q.length > 3) items.push(row('<span class="muted">' + (q.length - 3) + ' more to review</span>', '', { act: 'gotoTab', data: { tab: 'expenses', view: 'review' } }));
  const last = S.settings.lastBackupAt;
  if (S.transactions.length >= 5 && (!last || C.diffDays(last.slice(0, 10), t) >= 14))
    items.push('<button class="row alert-row" data-act="openBackup"><span class="sev info"></span><span class="label">Back up your data<span class="sub">' + (last ? 'Last backup ' + fmtDate(last.slice(0, 10)) : 'No backup yet') + '. Data lives only in this browser.</span></span><span class="chev">' + ICON.chev + '</span></button>');
  return items.length ? '<div class="group" style="margin-bottom:12px">' + items.join('') + '</div>' : '';
}
function reviewShort(it) {
  if (it.kind === 'card_due') return 'Pay ' + money(it.remaining) + ' by ' + fmtDate(it.dueDate) + ' to avoid interest.';
  if (it.kind === 'reconcile') return 'Difference of ' + money(it.difference) + ' to check.';
  if (it.kind === 'duplicate') { const a = C.txById(S, it.txIds[0]); return a ? money(a.amount) + ' · ' + fmtDate(a.date) + ' recorded twice?' : ''; }
  if (it.kind === 'categorize_withdrawal') { const a = C.txById(S, it.txIds[0]); return a ? money(a.amount) + ' on ' + fmtDate(a.date) : ''; }
  return it.detail || '';
}

// ---------- transaction rows ----------
const TYPE_DOT = { expense: 'var(--series)', cc_purchase: 'var(--series)', refund: 'var(--good)' };
function txRow(x, opts) {
  opts = opts || {};
  const L = C.ledgerOf(x);
  let title, sub, val, vcls = '';
  if (L === 'expense') {
    title = x.description || catName(x.categoryId);
    const parts = [x.description ? catName(x.categoryId) : null, x.subcategory || null,
      x.type === 'cc_purchase' ? accountName(x.from) : x.method === 'flexi' ? 'From flexi loan' : x.method ? C.PAYMENT_METHODS[x.method] : (x.from ? accountName(x.from) : null)].filter(Boolean);
    sub = parts.map(esc).join(' · ');
    val = x.type === 'refund' ? '+' + money(x.amount) : money(x.amount);
    if (x.type === 'refund') vcls = 'credit';
  } else {
    title = x.description || C.TX_TYPES[x.type].label;
    sub = esc(movementLine(x));
    val = money(x.amount); vcls = 'neutral';
  }
  const meta = [];
  if (x.recurring) meta.push(badge('Recurring'));
  (x.tags || []).forEach((tg) => meta.push(badge(tg, tg === 'impulse' || tg === 'avoidable' ? 'warn' : '')));
  if (x.linkId) meta.push(badge('Linked', 'info'));
  if (x.type === 'flexi_withdrawal' && (x.purpose || 'unclassified') === 'unclassified') meta.push(badge('Needs categorization', 'warn'));
  if (opts.balance != null) meta.push('<span class="badge">Balance after: ' + money(opts.balance) + '</span>');
  return '<button class="row tx" type="button" data-act="txDetail" data-id="' + x.id + '"><span class="dot" style="background:' + (TYPE_DOT[x.type] || 'var(--series-muted)') + '"></span>' +
    '<span class="label"><span class="title">' + esc(title) + '</span><span class="sub">' + sub + (opts.showDate ? ' · ' + fmtDate(x.date) : '') + '</span>' + (meta.length ? '<span class="meta">' + meta.join('') + '</span>' : '') + '</span>' +
    '<span class="value ' + vcls + '">' + val + '</span></button>';
}
function movementLine(x) {
  const f = x.from ? accountName(x.from) : null, to = x.to ? accountName(x.to) : null;
  switch (x.type) {
    case 'income': return 'Income → ' + to;
    case 'transfer': return f + ' → ' + to;
    case 'flexi_deposit': return 'Deposit ' + (f ? 'from ' + f + ' ' : '') + '→ ' + to;
    case 'flexi_withdrawal': return 'Withdrawal · ' + C.WITHDRAWAL_PURPOSES[x.purpose || 'unclassified'] + (to ? ' → ' + to : '');
    case 'cc_payment': return 'Card bill → ' + to + (f ? ' from ' + f : ' (from flexi loan)');
    case 'loan_interest': return 'Interest charged by ' + f;
    case 'loan_fee': return 'Fee charged by ' + f;
    case 'principal_adjustment': return 'Principal repayment → ' + to;
    default: return C.TX_TYPES[x.type].label;
  }
}
function exclusionReason(x) {
  switch (x.type) {
    case 'income': return 'Income. Counted in income totals, never as spending.';
    case 'transfer': return 'Money moved between your own accounts. Not income or spending.';
    case 'flexi_deposit': return 'Deposit into the flexi loan. It lowers the utilized balance, and the interest charged, for as long as it stays there. It is not spending, and it is not a permanent principal repayment.';
    case 'flexi_withdrawal': {
      const p = x.purpose || 'unclassified';
      if (p === 'cc_bill') return 'Withdrawal that paid a card bill. The card purchases were already counted as spending on the days you made them.';
      if (p === 'living') return 'Withdrawal into your account for living costs. What you buy with it is logged as expenses, so the withdrawal itself is not spending.';
      if (p === 'purchase') return 'Financing for a purchase that is logged separately as an expense. Counted once, as that expense.';
      if (p === 'unclassified') return 'Needs categorization. Say what this paid for; it is not counted as spending meanwhile.';
      return 'Borrowing from the flexi loan. Not spending by itself; log anything you buy as an expense.';
    }
    case 'cc_payment': return 'Card bill payment. It reduces what you owe the card. It does not reverse or repeat the original purchases.';
    case 'loan_interest': return 'Interest charged on a loan or card. Shown under interest & fees and kept out of your spending budget.';
    case 'loan_fee': return 'A lender fee. Shown under interest & fees and kept out of your spending budget.';
    case 'principal_adjustment': return 'A permanent principal repayment recorded by the lender. Reduces the loan; not spending.';
    default: return '';
  }
}

// ---------- Expenses ----------
function expRange() {
  const e = ui.exp, a = e.anchor;
  if (e.period === 'day') return [a, a, fmtDay(a)];
  if (e.period === 'week') { const s = C.weekStart(a), en = C.addDays(s, 6); return [s, en, fmtDate(s) + ' – ' + fmtDate(en)]; }
  if (e.period === 'custom') {
    const f = e.from || C.monthStart(C.monthKey(today())), t2 = e.to || today();
    return [f <= t2 ? f : t2, f <= t2 ? t2 : f, fmtDate(f, true) + ' – ' + fmtDate(t2, true)];
  }
  const mk = C.monthKey(a);
  return [C.monthStart(mk), C.monthEnd(mk), fmtMonth(mk)];
}
function matchesFilters(x) {
  const e = ui.exp;
  if (e.cat && x.categoryId !== e.cat) return false;
  if (e.method && (x.type === 'cc_purchase' ? 'credit_card' : x.method) !== e.method) return false;
  if (e.tag && !(x.tags || []).includes(e.tag)) return false;
  if (e.q) {
    const q = e.q.toLowerCase();
    const hay = [x.description, x.notes, x.subcategory, x.categoryId ? catName(x.categoryId) : '', C.TX_TYPES[x.type].label, String(x.amount)].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function groupedList(txs, opts) {
  if (!txs.length) return '';
  const byDate = {};
  txs.forEach((x) => { (byDate[x.date] = byDate[x.date] || []).push(x); });
  return Object.keys(byDate).sort().reverse().map((d) => {
    const list = byDate[d].sort(C.txSort).reverse();
    const daySpend = C.sum(list.map(C.spendValue));
    return '<div class="day-head"><span>' + fmtDay(d) + '</span><span class="tnum">' + (opts && opts.movements ? '' : money(daySpend)) + '</span></div><div class="group">' + list.map((x) => txRow(x)).join('') + '</div>';
  }).join('');
}

VIEWS.expenses = function () {
  const e = ui.exp, t = today();
  const queue = C.reviewQueue(S, t);
  let h = '<div class="seg" role="group" aria-label="Ledger view" style="margin-bottom:12px">' +
    [['spending', 'Spending'], ['movements', 'Movements'], ['review', 'Needs review']].map(([v, l]) =>
      '<button data-act="expView" data-v="' + v + '" aria-pressed="' + (e.view === v) + '">' + l + (v === 'review' && queue.length ? '<span class="count">' + queue.length + '</span>' : '') + '</button>').join('') + '</div>';
  if (e.view === 'review') return h + reviewView(queue);

  const [from, to, label] = expRange();
  h += '<div class="seg" role="group" aria-label="Period">' + [['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['custom', 'Custom']].map(([v, l]) =>
    '<button data-act="expPeriod" data-v="' + v + '" aria-pressed="' + (e.period === v) + '">' + l + '</button>').join('') + '</div>';
  if (e.period === 'custom') {
    h += '<div class="field-row" style="margin-top:10px"><label class="field"><span>From</span><input type="date" id="exp-from" data-change="expFrom" value="' + from + '"></label>' +
      '<label class="field"><span>To</span><input type="date" id="exp-to" data-change="expTo" value="' + to + '"></label></div>';
  } else {
    h += '<div class="month-nav" style="margin-top:8px"><button data-act="expPrev" aria-label="Previous period">‹</button><span class="label">' + label + '</span><button data-act="expNext" aria-label="Next period"' + (to >= t ? ' disabled' : '') + '>›</button></div>';
  }
  h += '<div class="searchbar" style="margin-top:4px"><input type="search" id="exp-q" placeholder="Search description, notes, amount" value="' + esc(e.q) + '" data-input="expSearch" aria-label="Search">' +
    '<button class="btn" data-act="toggleFilters" aria-expanded="' + e.showFilters + '">Filter' + ((e.cat || e.method || e.tag) ? ' •' : '') + '</button></div>';
  if (e.showFilters) {
    h += '<div class="group card" style="margin-top:8px"><div class="field-row">' +
      field('Category', selectInput('fcat', [['', 'All']].concat(S.categories.map((c) => [c.id, c.name])), e.cat, 'data-change="expFilter" data-k="cat"')) +
      field('Payment', selectInput('fmethod', [['', 'All']].concat(Object.entries(C.PAYMENT_METHODS)), e.method, 'data-change="expFilter" data-k="method"')) + '</div>' +
      field('Tag', selectInput('ftag', [['', 'All']].concat(C.TAGS.map((x) => [x, x[0].toUpperCase() + x.slice(1)])), e.tag, 'data-change="expFilter" data-k="tag"')) +
      '<button class="btn ghost" data-act="clearFilters">Clear filters</button></div>';
  }

  if (e.view === 'spending') {
    const txs = C.spendingTxs(S, from, to).filter(matchesFilters);
    const total = C.sum(txs.map(C.spendValue));
    h += '<div class="group hero" style="margin-top:12px"><div class="kicker">Spending · ' + esc(label) + '</div>' +
      (txs.length ? '<div class="big mid num">' + money(total) + '</div><div class="line"><span>' + plural(txs.length, 'entry').replace('entrys', 'entries') + '</span>' +
        (e.period !== 'day' ? '<span>' + money(total / Math.max(1, C.diffDays(from, to < today() ? to : today()) + 1)) + '/day avg</span>' : '') + '</div>' : '<div class="big mid">No data recorded</div>') + '</div>';
    h += txs.length ? groupedList(txs) : '<div class="group" style="margin-top:12px"><div class="empty"><h3>Nothing here yet</h3><span>Tap <b>Add</b> to log an expense. It takes three taps: amount, category, save.</span><button class="btn primary" data-act="quickAdd">Add expense</button></div></div>';
  } else {
    const txs = C.movementTxs(S, from, to).filter((x) => !e.q || matchesFilters(x));
    h += '<div class="note info" style="margin-top:12px"><b>Account movements excluded from spending</b>Salary credits, flexi-loan deposits and withdrawals, card bill payments, transfers, interest and fees. They change balances and debts, never your spending total.</div>';
    h += txs.length ? groupedList(txs, { movements: true }) : '<div class="group" style="margin-top:12px"><div class="empty small">No account movements in this period.</div></div>';
  }
  return h;
};
ACTIONS.expView = (d) => { ui.exp.view = d.v; render(); };
ACTIONS.expPeriod = (d) => { ui.exp.period = d.v; render(); };
function shiftExp(dir) {
  const e = ui.exp;
  if (e.period === 'day') e.anchor = C.addDays(e.anchor, dir);
  else if (e.period === 'week') e.anchor = C.addDays(e.anchor, 7 * dir);
  else e.anchor = C.monthStart(C.addMonths(C.monthKey(e.anchor), dir));
  if (e.anchor > today()) e.anchor = today();
  render();
}
ACTIONS.expPrev = () => shiftExp(-1);
ACTIONS.expNext = () => shiftExp(1);
ACTIONS.toggleFilters = () => { ui.exp.showFilters = !ui.exp.showFilters; render(); };
ACTIONS.clearFilters = () => { Object.assign(ui.exp, { cat: '', method: '', tag: '', q: '' }); render(); };
CHANGES.expFrom = (el) => { ui.exp.from = el.value; render(); };
CHANGES.expTo = (el) => { ui.exp.to = el.value; render(); };
CHANGES.expFilter = (el) => { ui.exp[el.dataset.k] = el.value; render(); };
let searchTimer = null;
CHANGES.expSearch = (el) => {
  ui.exp.q = el.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('#exp-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } } }, 250);
};

function reviewView(queue) {
  if (!queue.length) return '<div class="group"><div class="empty"><h3>Nothing needs review</h3><span>Unclear withdrawals, possible duplicates, statement differences and due dates show up here.</span></div></div>';
  return queue.map((it) => {
    let body = '<div class="row alert-row"><span class="sev ' + it.severity + '"></span><span class="label">' + esc(it.title) + '<span class="sub">' + esc(it.kind === 'reconcile' || it.kind === 'card_due' ? reviewShort(it) : it.detail) + '</span></span></div>';
    if (it.kind === 'reconcile') {
      body += '<div class="row"><span class="label small"><span class="kv"><dt>Statement balance (' + fmtDate(it.statementDate) + ')</dt><dd>' + money(it.statementBalance) + '</dd><dt>Calculated by the app</dt><dd>' + money(it.calculated) + '</dd><dt>Difference</dt><dd>' + money(it.difference, { sign: true }) + '</dd></span></span></div>';
      body += '<div class="row"><span class="label small muted">The statement balance is used from that date on. Your entries stay unchanged. A positive difference is often interest or fees not yet entered.</span></div>';
      body += '<div class="row btn-row">' + (it.difference > 0 ? '<button class="btn" data-act="recordDiff" data-st="' + it.statementId + '">Record ' + money(it.difference) + ' as interest</button>' : '') + '<button class="btn" data-act="ackStatement" data-st="' + it.statementId + '">Mark as checked</button></div>';
    } else if (it.kind === 'duplicate') {
      body += it.txIds.map((id) => { const x = C.txById(S, id); return x ? txRow(x, { showDate: true }) : ''; }).join('');
      body += '<div class="row btn-row"><button class="btn" data-act="dupKeep" data-a="' + it.txIds[0] + '" data-b="' + it.txIds[1] + '">Keep both</button><button class="btn danger" data-act="deleteTx" data-id="' + it.txIds[1] + '">Delete the second</button></div>';
    } else if (it.kind === 'categorize_withdrawal') {
      const x = C.txById(S, it.txIds[0]);
      body += txRow(x, { showDate: true });
      body += '<div class="row"><span class="label">' + selectInput('purpose-' + x.id, [['', 'Choose purpose…'], ['living', 'Living expenses'], ['emergency', 'Emergency'], ['other', 'Other']], '', 'data-change="setPurpose" data-id="' + x.id + '"') +
        '<span class="sub">Paid a card bill or a purchase? Open the entry and delete it, then use Pay card bill, or Add expense with "From flexi loan", so the link is recorded.</span></span></div>';
    } else if (it.kind === 'salary_missing') {
      body += '<div class="row btn-row"><button class="btn" data-act="addSalaryIncome" data-month="' + it.month + '">Add salary income</button><button class="btn" data-act="dismissReview" data-key="' + esc(it.key) + '">Dismiss</button></div>';
    } else if (it.kind === 'card_due') {
      body += '<div class="row btn-row"><button class="btn primary" data-act="payCard" data-id="' + it.accountId + '">Pay bill</button><button class="btn" data-act="dueReminder" data-id="' + it.accountId + '">Calendar reminder</button></div>';
    } else if (it.kind === 'cooloff_done') {
      body += '<div class="row btn-row"><button class="btn primary" data-act="urgeDecide" data-id="' + it.gamingId + '">Decide</button></div>';
    } else if (it.txIds.length) {
      body += it.txIds.map((id) => { const x = C.txById(S, id); return x ? txRow(x, { showDate: true }) : ''; }).join('');
      if (it.kind === 'flagged') body += '<div class="row btn-row"><button class="btn" data-act="clearFlag" data-id="' + it.txIds[0] + '">Clear review flag</button></div>';
    }
    return '<div class="group" style="margin-bottom:10px">' + body + '</div>';
  }).join('');
}

// ---------- Accounts & Loans ----------
VIEWS.loans = function () {
  const t = today(), mk = ui.month;
  let h = '';
  const fx = flexiAcct();
  if (fx) h += flexiSection(fx, t, mk);
  accountsOf('loan').forEach((ln) => { h += loanSection(ln, t); });
  h += cashSection(t, mk);

};

function flexiSection(fx, t, mk) {
  const info = C.balanceInfo(S, fx.id, t);
  const series = C.flexiSeries(S, fx.id, C.addDays(t, -1), t);
  const daily = series.length ? series[series.length - 1].estInterest : null;
  const fm = C.flexiMonth(S, fx.id, mk, t);
  const hist = S.settings.history;
  let h = '<div class="group hero"><div class="kicker">' + esc(fx.name) + ' · utilized balance</div>' +
    '<div class="big num">' + money(info.balance) + '</div>' +
    '<div class="line"><span>' + STATUS_BADGE[info.status] + '</span><span>' + esc(balanceSource(info)) + '</span></div></div>';
  h += '<div class="action-grid" style="margin-top:10px">' +
    '<button class="btn primary" data-act="openMove" data-kind="salary">Salary day</button>' +
    '<button class="btn" data-act="openMove" data-kind="deposit">Deposit</button>' +
    '<button class="btn" data-act="openMove" data-kind="withdraw">Withdraw</button>' +
    '<button class="btn" data-act="openMove" data-kind="paycard">Pay card bill</button>' +
    '<button class="btn" data-act="openMove" data-kind="charge" data-acct="' + fx.id + '">Interest / fee</button>' +
    '<button class="btn" data-act="openMove" data-kind="principal" data-acct="' + fx.id + '">Principal repaid</button>' +
    '<button class="btn" data-act="openStatement" data-acct="' + fx.id + '">Statement</button>' +
    '<button class="btn" data-act="editAccount" data-id="' + fx.id + '">Edit loan</button></div>';

  h += section('Loan details', '<div class="group">' +
    row('Original loan', money(fx.original) + ' ' + badge('Reported')) +
    (hist.flexiPrincipalReductionReported != null ? row('Principal reduced so far', money(hist.flexiPrincipalReductionReported) + ' ' + badge('Approx.'), { sub: esc(hist.flexiReductionNote || 'As last reported') }) : '') +
    row('Interest rate', fx.rate + '% p.a. ' + badge('Approx.'), { sub: 'Estimates use ' + (fx.dayCount || 365) + ' days a year on the daily utilized balance' }) +
    row('Daily interest', daily != null ? money(daily, { dp: 2 }) + ' ' + badge('Estimate') : '—', { sub: 'Utilized balance × ' + fx.rate + '% ÷ ' + (fx.dayCount || 365) }) +
    row('Remaining tenure', '<span class="small">' + esc(fx.reportedTenure || 'Not set') + '</span>') +
    '</div>');

  h += monthNav();
  h += '<div class="group">' +
    row('Deposits', money(fm.deposits), { sub: fm.depositCount ? plural(fm.depositCount, 'deposit') + (fm.salaryDeposits ? ' · salary ' + money(fm.salaryDeposits) : '') : 'None recorded' }) +
    row('Withdrawals', money(fm.withdrawals), { sub: Object.entries(fm.byPurpose).map(([p, v]) => C.WITHDRAWAL_PURPOSES[p] + ' ' + money(v)).join(' · ') || 'None recorded' }) +
    row('Net principal change', money(-fm.netPrincipalChange, { sign: true }), { sub: 'Withdrawals − deposits − principal repaid (before interest)' }) +
    row('Interest charged', fm.interestCharged ? money(fm.interestCharged) : '<span class="faint">Not entered</span>', { sub: 'From your lender statement' }) +
    row('Estimated interest', money(fm.estInterestMonth) + ' ' + badge('Estimate'), { sub: (mk === C.monthKey(t) ? money(fm.estInterestToDate) + ' so far, rest at today\'s balance' : 'Daily-balance estimate') }) +
    (fm.fees ? row('Fees charged', money(fm.fees)) : '') +
    row('Principal repaid (permanent)', money(fm.principal), { sub: 'Only entries the lender records as principal repayment' }) +
    row('Net balance change', fm.netBalanceChange != null ? money(fm.netBalanceChange, { sign: true }) : '—', { sub: fm.startBalance != null ? money(fm.startBalance) + ' → ' + money(fm.endBalance) : '' }) +
    row('Confirmed debt reduction', fm.confirmedReduction ? money(fm.confirmedReduction.amount) : '<span class="faint">Needs two confirmed balances</span>') +
    row('Interest saved by parking', money(fm.estSavedToDate) + ' ' + badge('Estimate'), { sub: 'Compared with the same month if deposits had stayed in your bank' }) +
    '</div>';
  h += '<details class="note"><summary class="small" style="cursor:pointer"><b>How the interest-saved estimate works</b></summary><span class="small">Each deposit is treated as "parked" until later withdrawals use it up. Every day, the app estimates the interest on (utilized balance + parked amount) and subtracts the interest on the actual balance. A deposit you withdraw after 3 days only saves 3 days of interest. This is an estimate. Your lender\'s actual method decides the real figure.</span></details>';

  // Balance history chart
  const anchors = C.anchorsFor(S, fx.id);
  if (anchors.length) {
    const start = anchors[0].date;
    const full = C.flexiSeries(S, fx.id, C.addDays(t, -179) > start ? C.addDays(t, -179) : start, t);
    h += section('Utilized balance over time', '<div class="group card chart-wrap">' + lineChart(full.map((p) => ({ x: p.date, y: p.balance, note: p.confirmed ? 'Confirmed' : (p.parked ? 'Parked deposits ' + money(p.parked) : '') })), { aria: 'Utilized balance by day' }) +
      '<span class="chart-caption">Daily utilized balance' + (full.length > 1 ? ' since ' + fmtDate(full[0].date) : '') + '. Deposits pull it down; withdrawals push it up.</span></div>');
  }
  // Monthly interest
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(C.addMonths(C.monthKey(t), -i));
  const rows = months.map((m) => ({ m, fm: C.flexiMonth(S, fx.id, m, t) })).filter((r) => r.fm.series.length || r.fm.hasData);
  if (rows.length) {
    h += section('Monthly interest', '<div class="group card chart-wrap">' +
      barChart(rows.map((r) => ({ label: fmtMonthShort(r.m), value: r.fm.interestCharged || r.fm.estInterestMonth, cls: r.fm.interestCharged ? '' : 'muted',
        tip: fmtMonth(r.m) + '\nEstimated ' + money(r.fm.estInterestMonth) + '\nCharged ' + (r.fm.interestCharged ? money(r.fm.interestCharged) : 'not entered') })), { aria: 'Monthly interest', h: 130 }) +
      '<div class="legend"><span><i style="background:var(--series)"></i>Charged (statement)</span><span><i style="background:var(--series-muted)"></i>Estimated</span></div></div>');
  }

  // Payoff
  h += payoffSection(fx, info, t);

  // Statements & reconciliation
  const recs = C.reconcile(S, fx.id);
  h += section('Statements & reconciliation',
    '<div class="group">' + (recs.length ? recs.slice().reverse().map((r) => statementRow(r)).join('') :
      '<div class="empty small">No lender statements entered. Add one each month: the closing balance becomes the confirmed figure and any difference from the app is flagged.</div>') + '</div>',
    '<button class="link" data-act="openStatement" data-acct="' + fx.id + '">Add</button>');

  // Ledger
  const txs = S.transactions.filter((x) => C.effectOn(S, x, fx.id) !== 0).sort(C.txSort).reverse();
  h += section('Deposit & withdrawal history', txs.length ? '<div class="group">' + txs.slice(0, 60).map((x) => txRow(x, { showDate: true, balance: C.balanceAt(S, fx.id, x.date) })).join('') + '</div>' +
    (txs.length > 60 ? '<p class="small faint">Showing the latest 60. Export CSV for the full history.</p>' : '') : '<div class="group"><div class="empty small">No movements yet.</div></div>',
    '<span class="faint">End-of-day balance</span>');
  return h;
}
function balanceSource(info) {
  if (info.status === 'unknown') return 'No starting balance set';
  const an = info.anchor;
  if (info.status === 'calculated') return (an.kind === 'statement' ? 'Statement of ' + fmtDate(an.date) : an.source) + ' plus your recorded movements';
  return an.kind === 'statement' ? 'Lender statement of ' + fmtDate(an.date) : an.source;
}
function statementRow(r) {
  const st = r.statement;
  const diff = r.difference;
  const v = diff == null ? '' : Math.abs(diff) < 1 ? badge('Matches', 'good') : (st.acknowledged ? badge('Checked', '') : badge('Differs ' + money(diff, { sign: true }), 'warn'));
  return '<div class="row"><span class="label">' + fmtDate(st.date, true) + '<span class="sub">Closing ' + money(st.closingBalance) + (st.interestCharged ? ' · interest ' + money(st.interestCharged) : '') +
    (r.calculated != null ? ' · app ' + money(r.calculated) : ' · first statement') + '</span></span><span class="value">' + v + '</span>' +
    '<button class="btn ghost" data-act="deleteStatement" data-id="' + st.id + '" aria-label="Delete statement">Delete</button></div>';
}

function payoffSection(fx, info, t) {
  const bal = info.balance;
  if (bal == null) return section('Payoff projection', '<div class="group"><div class="empty small">Set the utilized balance with <b>Edit loan</b> to see a payoff projection.</div></div>');
  const plan = C.payoffPlan(bal, fx.rate, fx.plannedMonthlyPrincipal, C.monthKey(t));
  const pattern = C.recordedPattern(S, fx.id, t);
  const req = fx.targetPayoffDate ? C.requiredPrincipal(bal, fx.targetPayoffDate, t) : null;
  let body = '<form data-form="payoff" class="group card">' +
    '<div class="field-row">' + field('Planned principal cut per month', moneyInput('planned', fx.plannedMonthlyPrincipal || ''), esc(fx.plannedNote || 'Not guaranteed.')) +
    field('Your target payoff date', '<input type="date" name="target" value="' + esc(fx.targetPayoffDate || '') + '">', 'Optional') + '</div>' +
    '<button class="btn" type="submit">Update projection</button>';
  if (plan) {
    body += '<dl class="kv"><dt>At ' + money(fx.plannedMonthlyPrincipal) + '/month + interest</dt><dd>' + plural(plan.months, 'month') + '</dd>' +
      '<dt>Estimated payoff</dt><dd>' + fmtMonth(plan.payoffMonth) + '</dd>' +
      '<dt>First month\'s interest</dt><dd>' + money(plan.firstInterest) + '</dd>' +
      '<dt>Total interest from today</dt><dd>' + money(plan.totalInterest) + '</dd>' +
      '<dt>First month\'s total payment</dt><dd>' + money(plan.firstInterest + fx.plannedMonthlyPrincipal) + '</dd></dl>';
  }
  if (req) body += '<div class="note info">To finish by ' + fmtDate(fx.targetPayoffDate, true) + ' you would need to cut about <b>' + money(req.perMonth) + '/month</b> of principal for ' + plural(req.months, 'month') + ', plus that month\'s interest.</div>';
  if (pattern && pattern.average != null) {
    const m = pattern.average > 0 ? Math.ceil(bal / pattern.average) : null;
    body += '<div class="note">' + (pattern.average > 0
      ? '<b>Recorded pattern:</b> your balance fell by ' + money(pattern.average) + '/month on average over ' + plural(pattern.months.length, 'completed month') + '. At that pace, payoff is roughly ' + fmtMonth(C.addMonths(C.monthKey(t), m)) + '.'
      : '<b>Recorded pattern:</b> over ' + plural(pattern.months.length, 'completed month') + ' the balance did not fall on average (' + money(-pattern.average, { sign: true }) + '/month).') +
      ' Enter interest charges from statements so this reflects the real balance.</div>';
  } else {
    body += '<p class="small faint">A projection from your actual repayment pattern appears after one full month of records.</p>';
  }
  return section('Payoff projection', body + '</form>');
}
FORMS.payoff = (form) => {
  const fx = flexiAcct();
  const p = optAmount(form, 'planned');
  if (Number.isNaN(p) || (p != null && p < 0)) return toast('Enter the monthly principal as a number.');
  fx.plannedMonthlyPrincipal = p || 0;
  fx.targetPayoffDate = fval(form, 'target');
  commit('Projection updated');
};

function loanSection(ln, t) {
  const pj = C.educationProjection(S, ln.id, t);
  const info = C.balanceInfo(S, ln.id, t);
  let body = '<div class="group hero"><div class="kicker">' + esc(ln.name) + ' · balance</div><div class="big mid num">' + money(info.balance) + '</div>' +
    '<div class="line"><span>' + STATUS_BADGE[info.status] + '</span><span>' + esc(balanceSource(info)) + '</span></div></div>';
  body += '<div class="group" style="margin-top:8px">' +
    row('Interest rate', ln.rate + '% p.a. ' + badge('Approx.')) +
    row('Interest per month now', pj ? money(pj.monthlyInterestNow) + ' ' + badge('Estimate') : '—', { sub: 'Simple monthly estimate on the current balance' }) +
    row('Repayment start', ln.repaymentStart ? fmtDate(ln.repaymentStart, true) : '<span class="faint">Not confirmed</span>', { sub: esc(ln.note || '') }) +
    row('Interest before repayment', { unknown: 'Not confirmed', capitalized: 'Added to principal (capitalized)', simple: 'Accrues, not compounded', paid: 'Paid monthly' }[ln.moratoriumInterest || 'unknown']) +
    (pj && pj.balanceAtStart != null ? row('Projected balance at start', money(pj.balanceAtStart) + ' ' + badge('Projection')) : '') +
    (pj && pj.emi ? row('Projected EMI', money(pj.emi) + ' ' + badge('Projection'), { sub: plural(ln.tenureMonths, 'month') + ' · total interest ' + money(pj.totalInterest) }) : row('Projected EMI', '<span class="faint">Add tenure</span>')) +
    '</div>';
  body += '<div class="action-grid" style="margin-top:10px"><button class="btn" data-act="editAccount" data-id="' + ln.id + '">Update details</button>' +
    '<button class="btn" data-act="openMove" data-kind="charge" data-acct="' + ln.id + '">Interest charge</button>' +
    '<button class="btn" data-act="openMove" data-kind="principal" data-acct="' + ln.id + '">Repayment</button>' +
    '<button class="btn" data-act="openStatement" data-acct="' + ln.id + '">Statement</button></div>';
  if (info.status === 'reported') body += '<div class="note warn" style="margin-top:8px">The balance, start date and interest terms have not been reconfirmed. Check your loan documents and tap <b>Update details</b>.</div>';

}

function cashSection(t, mk) {
  const assets = accountsOf('bank', 'cash', 'savings');
  let known = 0, unknown = 0, sumAssets = 0;
  const rows = assets.map((a) => {
    const info = C.balanceInfo(S, a.id, t);
    if (info.balance == null) unknown++; else { known++; sumAssets += info.balance; }
    return row(esc(a.name), info.balance == null ? '<button class="btn ghost" data-act="editAccount" data-id="' + a.id + '">Set balance</button>' : money(info.balance) + ' ' + STATUS_BADGE[info.status],
      { sub: C.ACCOUNT_KINDS[a.kind].label + (info.balance != null ? ' · ' + esc(balanceSource(info)) : ''), act: info.balance == null ? null : 'editAccount', data: { id: a.id } });
  }).join('');
  const ms = C.monthStart(mk), me = C.monthEnd(mk);
  const flow = C.sum(S.transactions.filter((x) => x.date >= ms && x.date <= me).map((x) => assets.reduce((s, a) => s + C.effectOn(S, x, a.id), 0)));
  let h = section('Bank & cash', '<div class="group">' + rows + '</div>', '<button class="link" data-act="addAccount">Add account</button>');
  h += '<div class="group" style="margin-top:8px">' + row('Net cash flow in ' + fmtMonthShort(mk), money(flow, { sign: true }), { sub: 'Change in bank, cash and savings from your entries' });
  const target = S.settings.emergencyCashTarget;
  if (target) h += row('Emergency cash target', unknown ? '<span class="faint">Set balances</span>' : (sumAssets >= target ? badge('Met', 'good') : badge(money(target - sumAssets) + ' short', 'warn')), { sub: 'Target ' + money(target) });
  // Net financial position only when every figure is known.
  const liab = S.accounts.filter((a) => C.ACCOUNT_KINDS[a.kind].side === 'liability' && !a.archived).map((a) => C.balanceAt(S, a.id, t));
  if (unknown || liab.some((v) => v == null)) h += row('Net financial position', '<span class="faint">Needs all balances</span>', { sub: 'Set every bank and cash balance to see assets minus debts' });
  else h += row('Net financial position', money(sumAssets - C.sum(liab)), { sub: 'Assets ' + money(sumAssets) + ' − debts ' + money(C.sum(liab)) });
  h += '</div>';
  if (S.settings.history.liquidSavingsReported === 0 && unknown) h += '<p class="small faint" style="padding:6px 4px">Liquid savings were last reported as ₹0. That is an old figure; set today\'s balances above.</p>';
  return h;
}

// ---------- Credit cards ----------

  }
  const sums = cards.map((c) => C.cardSummary(S, c.id, t));
  h += '<div class="group hero" style="margin-top:12px"><div class="kicker">Owed across cards</div><div class="big mid num">' + money(C.sum(sums.map((s) => s.balance || 0))) + '</div>' +
    '<div class="line"><span>Purchases this month <b>' + money(C.sum(sums.map((s) => s.purchasesThisMonth))) + '</b></span></div></div>';

    const c = s.card;
    let body = '<div class="group">';
    body += row('<b>' + esc(c.name) + '</b>', money(s.balance) + ' ' + STATUS_BADGE[s.status], { sub: 'Currently owed' + (c.limit ? ' · limit ' + money(c.limit) : '') });
    if (s.limitUse != null) body += '<div class="row"><span class="label"><div class="meter' + (s.limitUse > 0.9 ? ' over' : '') + '"><div class="fill" style="width:' + Math.min(100, s.limitUse * 100).toFixed(1) + '%"></div></div><span class="sub">' + pct(s.limitUse) + ' of limit used</span></span></div>';
    if (s.latest) {
      const dueBadge = s.remaining <= 0 ? badge('Paid', 'good') : s.daysToDue < 0 ? badge('Overdue', 'bad') : s.daysToDue <= 7 ? badge('Due in ' + plural(s.daysToDue, 'day'), 'warn') : badge('Due ' + fmtDate(s.latest.dueDate));
      body += row('Statement ' + fmtDate(s.latest.date), money(s.latest.statementBalance), { sub: 'Due ' + fmtDate(s.latest.dueDate) + (s.latest.minimumDue ? ' · minimum ' + money(s.latest.minimumDue) : '') });
      body += row('Paid since statement', money(s.paidSince));
      body += row('Remaining to pay', money(s.remaining) + ' ' + dueBadge, { sub: s.remaining > 0 ? 'Pay the full statement balance by the due date to avoid interest' : '' });
    } else body += row('Statement', '<span class="faint">Not entered</span>', { sub: (c.statementDay ? 'Statement day ' + c.statementDay + ' · ' : '') + (c.dueDay ? 'due day ' + c.dueDay : 'Add the latest statement to track the due date') });
    body += row('Purchases this month', money(s.purchasesThisMonth));
    body += '</div><div class="action-grid" style="margin-top:8px">' +
      '<button class="btn primary" data-act="payCard" data-id="' + c.id + '">Pay bill</button>' +
      '<button class="btn" data-act="quickAdd" data-card="' + c.id + '">Add purchase</button>' +
      '<button class="btn" data-act="openStatement" data-acct="' + c.id + '">Statement</button>' +
      '<button class="btn" data-act="importCard" data-id="' + c.id + '">Import CSV</button>' +
      '<button class="btn" data-act="openMove" data-kind="charge" data-acct="' + c.id + '">Interest / fee</button>' +
      '<button class="btn" data-act="editAccount" data-id="' + c.id + '">Edit card</button></div>';
    const txs = S.transactions.filter((x) => x.from === c.id || x.to === c.id).sort(C.txSort).reverse().slice(0, 8);
    if (txs.length) body += '<div class="group" style="margin-top:8px">' + txs.map((x) => txRow(x, { showDate: true })).join('') + '</div>';
    h += '<div class="section">' + body + '</div>';
  });
  h += '<div class="section"><button class="btn block" data-act="addAccount" data-kind="card">Add another card</button></div>';
  return h;
};

// ---------- Reports ----------
VIEWS.reports = function () {
  const t = today(), mk = ui.month;
  const ms = C.monthStart(mk), me = C.monthEnd(mk);
  const end = mk === C.monthKey(t) ? t : me;
  let h = monthNav();

  // Daily spending
  const days = C.dailySpending(S, ms, end);
  const b = C.budgetStatus(S, mk, t);
  const hasData = days.some((d) => d.count);
  h += section('Daily spending', '<div class="group card chart-wrap">' + (hasData
    ? barChart(days.map((d) => ({ label: String(Number(d.date.slice(8))), value: d.count ? d.amount : null, tip: fmtDate(d.date) + '\n' + (d.count ? money(d.amount) + ' · ' + plural(d.count, 'entry').replace('entrys', 'entries') : 'No entries') })),
      { ref: b.budget / C.daysInMonth(mk), refLabel: 'Even pace ' + money(b.budget / C.daysInMonth(mk)) + '/day', labelEvery: 5, aria: 'Daily spending' })
    : '<div class="empty small">No data recorded for ' + fmtMonth(mk) + '.</div>') + '</div>');

  // Monthly trend
  const trend = C.monthlyTrend(S, mk, 6);
  h += section('Monthly spending', '<div class="group card chart-wrap">' +
    barChart(trend.map((m) => ({ label: fmtMonthShort(m.month), value: m.spending, cls: m.spending > S.settings.budget.amount ? 'over' : '', tip: fmtMonth(m.month) + '\n' + (m.hasData ? money(m.spending) : 'No data recorded') })),
      { ref: S.settings.budget.amount, refLabel: 'Budget ' + money(S.settings.budget.amount), showNoData: true, aria: 'Spending by month' }) +
    '<span class="chart-caption">Months without entries show "No data", not ₹0. Bars above budget use the warning colour.</span></div>');

  // Category breakdown & plan
  const cats = C.byCategory(S, ms, me);
  const planned = S.categories.filter((c) => c.plan);
  const items = cats.map((c) => ({ name: c.name, value: c.amount, plan: (C.cat(S, c.id) || {}).plan || 0 }));
  planned.forEach((c) => { if (!items.some((i) => i.name === c.name)) items.push({ name: c.name, value: 0, plan: c.plan }); });
  h += section('By category', '<div class="group">' + (cats.length ? hbars(items, { legend: planned.length > 0 }) : '<div class="empty small">No data recorded for ' + fmtMonth(mk) + '.</div>') + '</div>');

  // Actual vs planned
  if (planned.length) {
    const rowsP = planned.map((c) => { const a = cats.find((x) => x.id === c.id); return [c.name, c.plan, a ? a.amount : 0]; });
    const tp = C.sum(rowsP.map((r) => r[1])), ta = C.sum(rowsP.map((r) => r[2]));
    h += section('Actual vs planned', '<div class="group table-wrap"><table class="data"><thead><tr><th>Category</th><th>Planned</th><th>Actual</th><th>Difference</th></tr></thead><tbody>' +
      rowsP.map((r) => '<tr><td>' + esc(r[0]) + '</td><td>' + money(r[1]) + '</td><td>' + (hasData ? money(r[2]) : '—') + '</td><td class="' + (r[2] > r[1] ? 'warn' : '') + '">' + (hasData ? money(r[2] - r[1], { sign: true }) : '—') + '</td></tr>').join('') +
      '<tr class="total"><td>Total</td><td>' + money(tp) + '</td><td>' + (hasData ? money(ta) : '—') + '</td><td>' + (hasData ? money(ta - tp, { sign: true }) : '—') + '</td></tr></tbody></table></div>' +
      '<p class="small faint" style="padding:4px">Planned amounts are the monthly figures you reported. Edit them in Settings → Categories.</p>');
  }

  // Comparison with previous month
  const pmk = C.addMonths(mk, -1);
  const prevCats = C.byCategory(S, C.monthStart(pmk), C.monthEnd(pmk));
  const prevHas = C.spendingTxs(S, C.monthStart(pmk), C.monthEnd(pmk)).length > 0;
  if (hasData || prevHas) {
    const ids = [...new Set(cats.map((c) => c.id).concat(prevCats.map((c) => c.id)))];
    h += section('Compared with ' + fmtMonth(pmk), '<div class="group table-wrap"><table class="data"><thead><tr><th>Category</th><th>' + fmtMonthShort(pmk) + '</th><th>' + fmtMonthShort(mk) + '</th><th>Change</th></tr></thead><tbody>' +
      ids.map((id) => { const a = (prevCats.find((c) => c.id === id) || {}).amount || 0, b2 = (cats.find((c) => c.id === id) || {}).amount || 0;
        return '<tr><td>' + esc(catName(id)) + '</td><td>' + (prevHas ? money(a) : 'No data') + '</td><td>' + (hasData ? money(b2) : 'No data') + '</td><td>' + (prevHas && hasData ? money(b2 - a, { sign: true }) : '—') + '</td></tr>'; }).join('') +
      '</tbody></table></div>');
  }

  // Recurring vs one-time, and by card
  const st = C.spendingTxs(S, ms, me);
  const rec = C.sum(st.filter((x) => x.recurring).map(C.spendValue)), one = C.sum(st.filter((x) => !x.recurring).map(C.spendValue));
  const cards = accountsOf('card');
  h += section('Recurring & cards', '<div class="group">' +
    row('Recurring', hasData ? money(rec) : '—', { sub: 'Entries marked recurring' }) +
    row('One-time', hasData ? money(one) : '—') +
    cards.map((c) => row(esc(c.name), money(C.sum(st.filter((x) => x.type === 'cc_purchase' && x.from === c.id).map((x) => x.amount))), { sub: 'Card purchases this month' })).join('') +
    '</div>');

  // Gaming over time
  const gs = C.gamingStats(S, mk);
  const gm = []; for (let i = 5; i >= 0; i--) gm.push(C.addMonths(mk, -i));
  h += section('Recorded gaming purchases', '<div class="group card chart-wrap">' + (gs.lifetimeCount
    ? barChart(gm.map((m) => ({ label: fmtMonthShort(m), value: gs.byMonth[m] != null ? gs.byMonth[m] : (C.spendingTxs(S, C.monthStart(m), C.monthEnd(m)).length ? 0 : null), tip: fmtMonth(m) + '\n' + (gs.byMonth[m] != null ? money(gs.byMonth[m]) : 'None recorded') })), { aria: 'Gaming purchases by month', h: 120, showNoData: true })
    : '<div class="empty small">No gaming purchases recorded. Target: ' + money(S.settings.fcMonthlyTarget || 0) + '/month.</div>') + '</div>');

  // Surplus / deficit
  const sm = []; for (let i = 5; i >= 0; i--) sm.push(C.addMonths(mk, -i));
  h += section('Monthly surplus or deficit', '<div class="group table-wrap"><table class="data"><thead><tr><th>Month</th><th>Income</th><th>Spending</th><th>Interest & fees</th><th>Surplus</th></tr></thead><tbody>' +
    sm.map((m) => { const tt = C.monthTotals(S, m, t); const any = tt.hasSpendingData || tt.income || tt.interest || tt.fees;
      if (!any) return '<tr><td>' + fmtMonthShort(m) + ' ' + m.slice(0, 4) + '</td><td colspan="4" class="faint" style="text-align:right">No data recorded</td></tr>';
      const sur = tt.income - tt.spending - tt.interest - tt.fees;
      return '<tr><td>' + fmtMonthShort(m) + ' ' + m.slice(0, 4) + '</td><td>' + money(tt.income) + '</td><td>' + (tt.hasSpendingData ? money(tt.spending) : 'No data') + '</td><td>' + money(tt.interest + tt.fees) + '</td><td class="' + (sur < 0 ? 'bad' : 'good') + '">' + money(sur, { sign: true }) + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="small faint" style="padding:4px">Income minus spending minus loan interest and fees you entered. Deposits, withdrawals, card payments and transfers are left out because they only move money.</p>');
  return h;
};

// ---------- Goals ----------
VIEWS.goals = function () {
  const t = today();
  let h = '';
  S.goals.forEach((g) => { h += goalSection(g, t); });
  h += gamingSection(t);
  h += '<div class="section"><button class="btn block" data-act="addGoal">Add another goal</button></div>';
  return h;
};

function goalSection(g, t) {
  const p = C.goalProgress(S, g, t);
  let body = '<div class="group hero"><div class="kicker">' + esc(g.name) + ' fund</div><div class="big mid num">' + money(p.total) + '</div>' +
    '<div class="line"><span>of <b>' + money(g.target) + '</b> ' + (g.targetStatus === 'illustrative' ? badge('Illustrative target') : '') + '</span><span>' + pct(p.pct) + '</span></div>' +
    '<div class="stack-bar">' + (p.saved > 0 ? '<div class="saved" style="width:' + (p.saved / g.target * 100).toFixed(1) + '%"></div>' : '') + (p.earmarked > 0 ? '<div class="earm" style="width:' + (p.earmarked / g.target * 100).toFixed(1) + '%"></div>' : '') + '</div>' +
    '<div class="legend"><span><i style="background:var(--accent)"></i>Saved in a separate account ' + money(p.saved) + '</span><span><i style="background:color-mix(in srgb,var(--accent) 40%,transparent)"></i>Earmarked only ' + money(p.earmarked) + '</span></div></div>';
  body += '<div class="group" style="margin-top:8px">' +
    row('Remaining', money(p.remaining)) +
    row('Monthly contribution', g.monthlyContribution ? money(g.monthlyContribution) : '<span class="faint">Not set</span>') +
    row('Estimated completion', p.eta ? fmtMonth(p.eta) + ' ' + badge('Estimate') : '<span class="faint">Set a monthly contribution</span>', { sub: p.months ? plural(p.months, 'month') + ' at the monthly contribution' : '' }) + '</div>';
  body += '<div class="action-grid" style="margin-top:8px">' +
    '<button class="btn primary" data-act="goalEntry" data-goal="' + g.id + '" data-kind="earmark">Earmark</button>' +
    '<button class="btn" data-act="goalEntry" data-goal="' + g.id + '" data-kind="release">Release</button>' +
    (g.accountId ? '<button class="btn" data-act="goalTransfer" data-goal="' + g.id + '" data-dir="in">Move to savings</button><button class="btn" data-act="goalTransfer" data-goal="' + g.id + '" data-dir="out">Take out</button>'
      : '<button class="btn" data-act="goalSetupAccount" data-goal="' + g.id + '">Use a savings account</button>') +
    '<button class="btn" data-act="editGoal" data-goal="' + g.id + '">Edit goal</button></div>';
  body += '<div class="note" style="margin-top:8px"><span><b>Earmarked</b> money is a label: it stays wherever it is. <b>Saved</b> money has moved to a separate account. Neither counts as spending. Only the purchase itself will.</span>' +
    '<span>Buy it from money you have saved, not with a new loan or card debt you cannot clear in full.</span></div>';
  const hist = (g.entries || []).map((e) => ({ date: e.date, html: row((e.kind === 'release' ? 'Released' : 'Earmarked') + (e.note ? ' · ' + esc(e.note) : ''), (e.kind === 'release' ? '−' : '+') + money(e.amount), { sub: fmtDate(e.date, true) + ' · label only' }) + '' }))
    .concat(p.transfers.map((x) => ({ date: x.date, html: txRow(x, { showDate: true }) })))
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  body += '<div class="eyebrow" style="margin-top:14px">History</div>' + (hist.length ? '<div class="group">' + hist.map((x) => x.html).join('') + '</div>' : '<div class="group"><div class="empty small">No contributions yet.</div></div>');
  return '<div class="section">' + body + '</div>';
}

function gamingSection(t) {
  const mk = C.monthKey(t);
  const gs = C.gamingStats(S, mk);
  const target = S.settings.fcMonthlyTarget || 0;
  const hist = S.settings.history;
  const fx = flexiAcct();
  const active = (S.gamingLog || []).filter((g) => g.kind === 'urge' && g.coolOffUntil && !g.outcome);
  let h = '<div class="eyebrow">' + esc(gameLabel()) + '</div>';
  h += '<div class="group hero"><div class="kicker">Recorded this month · target ' + money(target) + '</div><div class="big mid num">' + money(gs.monthNet) + '</div>' +
    '<div class="line">' + (gs.monthNet <= target ? badge('On target', 'good') : badge(money(gs.monthNet - target) + ' above target', 'warn')) + '<span>' + plural(gs.urgesMonth, 'urge') + ' logged this month</span></div></div>';
  h += '<div class="action-grid" style="margin-top:8px"><button class="btn primary" data-act="urgeStart">I feel like buying</button>' +
    '<button class="btn" data-act="logAttempt">Log an attempt</button><button class="btn" data-act="logGamingPurchase">Log a purchase</button>' +
    '<button class="btn" data-act="logGamingRefund">Log a refund</button></div>';
  if (active.length) {
    h += '<div class="group" style="margin-top:8px">' + active.map((g) => {
      const ms = new Date(g.coolOffUntil) - new Date();
      const left = ms > 0 ? Math.floor(ms / 36e5) + 'h ' + Math.floor((ms % 36e5) / 6e4) + 'm left' : 'Finished';
      return '<div class="row"><span class="label">Cooling off: ' + esc(g.item || 'purchase') + '<span class="sub">' + (g.amount ? money(g.amount) + ' · ' : '') + 'started ' + fmtDate(g.date) + '</span></span><span class="value timer">' + left + '</span>' +
        '<button class="btn" data-act="urgeDecide" data-id="' + g.id + '">' + (ms > 0 ? 'Update' : 'Decide') + '</button></div>';
    }).join('') + '</div>';
  }
  const interestEq = fx ? gs.lifetimeNet * (fx.rate / 100) : null;
  h += '<div class="group" style="margin-top:8px">' +
    row('Recorded in this app (all time)', money(gs.lifetimeNet), { sub: plural(gs.lifetimeCount, 'purchase') + ' · ' + gs.waitedPurchases + ' after a waiting period' }) +
    row('Urges logged and skipped', plural(gs.resisted, 'time'), { sub: gs.resistedAmount ? money(gs.resistedAmount) + ' not spent' : '' }) +
    row('Attempts logged', String(gs.attempts), { sub: 'Started but did not complete' }) +
    (gs.lifetimeNet > 0 ? row('If these purchases had not happened', money(gs.lifetimeNet) + ' ' + badge('Hypothetical'), { sub: interestEq ? 'Kept in the flexi loan, that would save roughly ' + money(interestEq) + ' a year at ' + fx.rate + '%' : '' }) : '') +
    '</div>';
  if (hist.fcEstimateLow != null) h += '<details class="group card" style="margin-top:8px"><summary class="small" style="cursor:pointer"><b>Reported history (approximate, not in the ledger)</b></summary><dl class="kv small">' +
    '<dt>Earlier total spent</dt><dd>' + money(hist.fcEstimateLow) + '–' + money(hist.fcEstimateHigh) + ' (est.)</dd>' +
    '<dt>Recent episode</dt><dd>' + money(hist.fcRecentEpisode.total) + '</dd>' +
    '<dt>Planned for that episode</dt><dd>' + esc(hist.fcRecentEpisode.intended) + '</dd></dl>' +
    '<span class="small muted">These figures are what you reported in conversation. They are kept out of every total. If the ' + money(hist.fcRecentEpisode.total) + ' episode falls in a month you are tracking, log the actual purchases with their dates.</span></details>';
  const log = (S.gamingLog || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 12);
  if (log.length) {
    h += '<div class="eyebrow" style="margin-top:14px">Urge & attempt log</div><div class="group">' + log.map((g) => row(
      (g.kind === 'attempt' ? 'Attempt' : 'Urge') + (g.item ? ': ' + esc(g.item) : ''),
      g.amount ? money(g.amount) : '',
      { sub: fmtDate(g.date) + (g.trigger ? ' · ' + C.GAMING_TRIGGERS[g.trigger] : '') + (g.outcome ? ' · ' + ({ resisted: 'Skipped', purchased: 'Bought', pending: 'Waiting' }[g.outcome] || g.outcome) : g.coolOffUntil ? ' · cooling off' : ''), act: 'urgeDecide', data: { id: g.id } })).join('') + '</div>';
  }
  return '<div class="section">' + h + '</div>';
}

// ---------- entry sheets, forms and actions ----------

const assetOptions = () => accountsOf('bank', 'cash', 'savings').map((a) => [a.id, a.name]);
const bankOptions = () => accountsOf('bank', 'savings').map((a) => [a.id, a.name]);
const cardOptions = () => accountsOf('card').map((a) => [a.id, a.name]);
const liabilityOptions = () => S.accounts.filter((a) => C.ACCOUNT_KINDS[a.kind].side === 'liability' && !a.archived).map((a) => [a.id, a.name]);
const firstOf = (kind) => (accountsOf(kind)[0] || {}).id || '';

function categoryOrder() {
  const counts = {};
  S.transactions.slice(-300).forEach((x) => { if (x.categoryId) counts[x.categoryId] = (counts[x.categoryId] || 0) + 1; });
  return S.categories.filter((c) => !c.system && !c.hidden).slice().sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
}
function dateQuick(name, value) {
  const t = today();
  return '<div class="field"><span>Date</span><div style="display:flex;gap:8px;align-items:center">' +
    '<div class="chips" style="flex:none"><button type="button" class="chip-btn" data-act="setDate" data-name="' + name + '" data-v="' + t + '">Today</button>' +
    '<button type="button" class="chip-btn" data-act="setDate" data-name="' + name + '" data-v="' + C.addDays(t, -1) + '">Yesterday</button></div>' +
    '<div style="flex:1;min-width:0">' + dateInput(name, value) + '</div></div></div>';
}
ACTIONS.setDate = (d, el) => { const f = el.closest('form'); f.elements[d.name].value = d.v; };

// ---------- quick entry (expense / income / refund / move money) ----------
ACTIONS.quickAdd = (d) => openEntry({ mode: 'expense', prefill: d.card ? { method: 'credit_card', card: d.card } : {} });
ACTIONS.entryMode = (d) => { closeSheet(); if (d.mode === 'move') openMoveMenu(); else openEntry({ mode: d.mode }); };

function modeTabs(mode) {
  return '<div class="seg" role="group" aria-label="Entry type">' + [['expense', 'Expense'], ['income', 'Income'], ['refund', 'Refund'], ['move', 'Move money']].map(([v, l]) =>
    '<button type="button" data-act="entryMode" data-mode="' + v + '" aria-pressed="' + (mode === v) + '">' + l + '</button>').join('') + '</div>';
}

function openEntry({ mode, tx, prefill }) {
  prefill = prefill || {};
  if (mode === 'income') return openSheet(tx ? 'Edit income' : 'Add', (tx ? '' : modeTabs('income')) + incomeForm(tx, prefill));
  if (mode === 'refund') return openSheet(tx ? 'Edit refund' : 'Add', (tx ? '' : modeTabs('refund')) + refundForm(tx, prefill));
  return openSheet(tx ? 'Edit expense' : 'Add', (tx ? '' : modeTabs('expense')) + expenseForm(tx, prefill));
}

function expenseForm(tx, p) {
  const v = tx || {};
  const method = tx ? (tx.type === 'cc_purchase' ? 'credit_card' : tx.method || (C.kindOf(S, tx.from) === 'cash' ? 'cash' : 'upi')) : (p.method || S.settings.lastMethod || 'upi');
  const funded = tx && tx.linkRole === 'funded';
  const catId = v.categoryId || p.categoryId || '';
  const cats = categoryOrder();
  const cards = cardOptions();
  const subs = (C.cat(S, catId) || {}).subcategories || [];
  const show = (m) => (m.split(' ').includes(method) ? '' : ' hidden');
  return '<form data-form="expense" data-id="' + (v.id || '') + '">' +
    amountField('amount', v.amount != null ? v.amount : p.amount) +
    '<div class="field"><span>Category</span>' + chipRadio('categoryId', cats.map((c) => [c.id, c.name]).concat(catId === 'uncategorized' ? [['uncategorized', 'Needs categorization']] : []), catId) + '</div>' +
    '<div class="field" data-change="methodToggle"><span>Paid with</span>' + (funded
      ? '<div class="note small">Paid directly from the flexi loan, with a linked withdrawal. To change how it was paid, delete it and add it again.</div><input type="hidden" name="method" value="flexi">'
      : chipRadio('method', Object.entries(C.PAYMENT_METHODS).filter(([k]) => k !== 'bank_transfer'), method)) + '</div>' +
    '<div data-show="credit_card"' + show('credit_card') + '>' + (cards.length ? field('Card', selectInput('card', cards, v.from || p.card || cards[0][0])) : '<div class="note warn">Add your card under <b>Cards</b> first.</div>') + '</div>' +
    '<div data-show="upi debit"' + show('upi debit') + '>' + field('From account', selectInput('bankAcct', bankOptions(), (C.kindOf(S, v.from) !== 'cash' && v.from) || firstOf('bank'))) + '</div>' +
    '<div data-show="flexi"' + show('flexi') + '><div class="note small">Records a flexi-loan withdrawal linked to this purchase. The purchase counts as spending once; the withdrawal is shown as borrowing.</div></div>' +
    dateQuick('date', v.date || p.date) +
    field('Description', '<input name="description" id="f-description" value="' + esc(v.description || p.description || '') + '" placeholder="Optional, e.g. Eggs, 30 pcs" autocomplete="off">') +
    '<details class="more"' + (v.notes || v.subcategory || (v.tags && v.tags.length) || v.time ? ' open' : '') + '><summary>More details</summary><div>' +
    '<div class="field-row">' + field('Time', '<input type="time" name="time" value="' + esc(v.time || '') + '">') +
    field('Subcategory', '<input name="subcategory" list="subcats" value="' + esc(v.subcategory || '') + '" autocomplete="off"><datalist id="subcats">' + subs.map((s) => '<option value="' + esc(s) + '">').join('') + '</datalist>') + '</div>' +
    '<div class="field"><span>Tags</span>' + chipCheck('tags', C.TAGS.map((tg) => [tg, tg[0].toUpperCase() + tg.slice(1)]), v.tags || []) + '</div>' +

}

function dupWarning(form, similar) {
  form.querySelector('.dup-warn').innerHTML = '<div class="note warn"><b>This looks like an entry you already have.</b>' +
    similar.slice(0, 2).map((x) => esc(fmtDate(x.date) + ' · ' + money(x.amount) + ' · ' + (x.description || (x.categoryId ? catName(x.categoryId) : C.TX_TYPES[x.type].label)))).join('<br>') +

}
