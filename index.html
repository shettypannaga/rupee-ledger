</div>
<button class="fab" id="fab" type="button" data-act="quickAdd" aria-label="Add an entry"></button>
<nav class="tabbar" aria-label="Sections"><div class="inner" id="tabs"></div></nav>
<div id="sheets"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="tip" class="tip" hidden></div>
<noscript><p style="padding:24px">Rupee Ledger needs JavaScript turned on.</p></noscript>

<script>
/*
 * Ledger core — pure accounting logic for the finance tracker.
 *
 * Three ledgers, chosen by each transaction's explicit `type` (never its description):
 *   A. expense  — consumption: expense, cc_purchase, refund. Only these touch spending.
 *   B. account  — money moving between things you own or owe: income, transfer,
 *                 flexi_deposit, flexi_withdrawal, cc_payment.
 *   C. debt     — what lenders charge or confirm: loan_interest, loan_fee,
 *                 principal_adjustment, plus statement balances.
 *
 * Every transaction moves `amount` out of `from` and/or into `to`.
 * Asset accounts (bank, cash, savings) hold money: from = -amount, to = +amount.
 * Liability accounts (flexi, card, loan) are amounts owed: from = +owed, to = -owed.
 * Each record has exactly one balance effect per account, so a linked pair
 * (flexi withdrawal that funds a card payment) never moves money twice.
 *
 * Runs in the browser (window.Core) and in Node (module.exports) for tests.
 */
(function (root) {
  'use strict';

  const SCHEMA_VERSION = 1;
  const APP_ID = 'ledger-finance-tracker';

  const TX_TYPES = {
    expense:              { label: 'Expense',                    ledger: 'expense' },
    cc_purchase:          { label: 'Credit-card purchase',       ledger: 'expense' },
    refund:               { label: 'Refund / reimbursement',     ledger: 'expense' },
    income:               { label: 'Income',                     ledger: 'account' },
    transfer:             { label: 'Internal transfer',          ledger: 'account' },
    flexi_deposit:        { label: 'Flexi-loan deposit',         ledger: 'account' },
    flexi_withdrawal:     { label: 'Flexi-loan withdrawal',      ledger: 'account' },
    cc_payment:           { label: 'Credit-card bill payment',   ledger: 'account' },
    loan_interest:        { label: 'Loan interest charge',       ledger: 'debt' },
    loan_fee:             { label: 'Loan fee',                   ledger: 'debt' },
    principal_adjustment: { label: 'Actual principal repayment', ledger: 'debt' },
  };

  const ACCOUNT_KINDS = {
    bank:    { label: 'Bank account',      side: 'asset' },
    cash:    { label: 'Cash',              side: 'asset' },
    savings: { label: 'Savings account',   side: 'asset' },
    flexi:   { label: 'Flexi loan',        side: 'liability' },
    card:    { label: 'Credit card',       side: 'liability' },
    loan:    { label: 'Term loan',         side: 'liability' },
  };

  const WITHDRAWAL_PURPOSES = {
    living:       'Living expenses',
    cc_bill:      'Credit-card bill',
    emergency:    'Emergency',
    purchase:     'Direct purchase',
    other:        'Other (described)',
    unclassified: 'Needs categorization',
  };

  const PAYMENT_METHODS = {
    cash: 'Cash', upi: 'UPI', debit: 'Debit card', credit_card: 'Credit card',
    flexi: 'From flexi loan', bank_transfer: 'Bank transfer',
  };

  const TAGS = ['essential', 'discretionary', 'avoidable', 'impulse'];

  const GAMING_TRIGGERS = {
    limited_offer: 'Limited-time offer', pack_opening: 'Pack opening', new_player: 'New player',
    frustration: 'Frustration', fomo: 'Fear of missing out', other: 'Other',
  };

  const BUDGET_SCOPES = {
    total:         'All expenses',
    living:        'Living expenses only',
    discretionary: 'Discretionary only',
    custom:        'Custom categories',
  };

  // ---------- small utilities ----------

  const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const sum = (arr, f) => r2(arr.reduce((s, x) => s + (f ? f(x) : x), 0));

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function isValidDate(s) {
    if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  function toUTC(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
  function fromUTC(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function addDays(s, n) { return fromUTC(toUTC(s) + n * 864e5); }
  function diffDays(a, b) { return Math.round((toUTC(b) - toUTC(a)) / 864e5); } // b - a
  function monthKey(s) { return s.slice(0, 7); }
  function monthStart(mk) { return mk + '-01'; }
  function daysInMonth(mk) { const [y, m] = mk.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function monthEnd(mk) { return mk + '-' + String(daysInMonth(mk)).padStart(2, '0'); }
  function addMonths(mk, n) {
    const [y, m] = mk.split('-').map(Number);
    const t = y * 12 + (m - 1) + n;
    return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
  }
  function weekStart(s) { const dow = new Date(toUTC(s)).getUTCDay(); return addDays(s, -((dow + 6) % 7)); }
  function todayLocal() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  const minDate = (a, b) => (a < b ? a : b);
  const maxDate = (a, b) => (a > b ? a : b);

  // ---------- default state ----------

  // Structure only. Personal figures (plans, balances, salary, goals, history) come from a profile,
  // so the published app carries none of them. See src/profile.personal.json.
  const DEFAULT_CATEGORIES = [
    // group: living | discretionary. food: counted in "food & supplements".
    { id: 'food_supplies', name: 'Food supplies', group: 'living', food: true },
    { id: 'eggs', name: 'Eggs', group: 'living', food: true },
    { id: 'milk', name: 'Milk', group: 'living', food: true },
    { id: 'gym_supplements', name: 'Gym supplements', group: 'living', food: true },
    { id: 'eating_out', name: 'Eating out & snacks', group: 'discretionary' },
    { id: 'transport', name: 'Transport', group: 'living' },
    { id: 'utilities', name: 'Phone, internet & utilities', group: 'living' },
    { id: 'personal_care', name: 'Personal care', group: 'living' },
    { id: 'shopping', name: 'Shopping & clothing', group: 'discretionary' },
    { id: 'entertainment', name: 'Entertainment', group: 'discretionary' },
    { id: 'subscriptions', name: 'Subscriptions', group: 'discretionary' },
    { id: 'gaming', name: 'Gaming purchases', group: 'discretionary', gaming: true },
    { id: 'digital', name: 'Other digital purchases', group: 'discretionary' },
    { id: 'medical', name: 'Medical & pharmacy', group: 'living' },
    { id: 'education', name: 'Education', group: 'living' },
    { id: 'gifts', name: 'Gifts & social', group: 'discretionary' },
    { id: 'other', name: 'Other', group: 'living' },
    { id: 'uncategorized', name: 'Needs categorization', group: 'living', system: true },
  ];

  const BLANK_PROFILE = {
    budget: { amount: 10000, status: 'proposed' },
    salary: { current: null, year2: null, year3: null },
    gamingName: '',
    categories: {},
    flexi: { rate: 0, original: null, reportedTenure: '', plannedMonthlyPrincipal: 0, plannedNote: '', opening: null },
    loan: { rate: 0, note: '', opening: null },
    goals: [],
    history: {},
  };

  function createDefaultState(today, profile) {
    today = today || todayLocal();
    const p = profile || root.RUPEE_PROFILE || BLANK_PROFILE;
    const fx = p.flexi || BLANK_PROFILE.flexi, ln = p.loan || BLANK_PROFILE.loan;
    const opening = (o) => (o && typeof o.balance === 'number' ? { date: o.date || today, balance: o.balance, confirmed: !!o.confirmed, source: o.source || 'Entered by you' } : null);
    return {
      app: APP_ID,
      version: SCHEMA_VERSION,
      createdAt: new Date().toISOString(),
      settings: {
        theme: 'dark',
        setupDone: false,
        trackingStart: today,
        budget: { amount: (p.budget && p.budget.amount) || 10000, scope: 'total', custom: [], status: (p.budget && p.budget.status) || 'proposed' },
        salary: { current: null, year2: null, year3: null, ...(p.salary || {}) },
        emergencyCashTarget: null,
        fcMonthlyTarget: 0,
        gamingName: p.gamingName || '',
        lastBackupAt: null,
        history: { ...(p.history || {}) },
      },
      categories: DEFAULT_CATEGORIES.map((c) => ({ subcategories: [], ...c, ...((p.categories || {})[c.id] || {}) })),
      accounts: [
        { id: 'bank', kind: 'bank', name: 'Bank account', opening: null },
        { id: 'cash', kind: 'cash', name: 'Cash', opening: null },
        { id: 'flexi', kind: 'flexi', name: 'Personal flexi loan', rate: fx.rate || 0, dayCount: 365,
          original: fx.original == null ? null : fx.original, reportedTenure: fx.reportedTenure || '',
          plannedMonthlyPrincipal: fx.plannedMonthlyPrincipal || 0, plannedNote: fx.plannedNote || '', targetPayoffDate: '',
          opening: opening(fx.opening) },
        { id: 'eduloan', kind: 'loan', name: 'Education loan', rate: ln.rate || 0,
          repaymentStart: '', moratoriumInterest: 'unknown', tenureMonths: null, note: ln.note || '',
          opening: opening(ln.opening) },
      ],
      transactions: [],
      statements: [],
      goals: (p.goals || []).map((g) => ({ monthlyContribution: 0, accountId: null, entries: [], createdAt: today, ...g })),
      gamingLog: [],
      dupDismissed: [],
      reviewDismissed: [],
    };
  }

  // ---------- lookups ----------

  const acct = (state, id) => state.accounts.find((a) => a.id === id) || null;
  const sideOf = (state, id) => { const a = acct(state, id); return a ? ACCOUNT_KINDS[a.kind].side : null; };
  const kindOf = (state, id) => { const a = acct(state, id); return a ? a.kind : null; };
  const cat = (state, id) => state.categories.find((c) => c.id === id) || null;
  const txById = (state, id) => state.transactions.find((t) => t.id === id) || null;
  const ledgerOf = (tx) => (TX_TYPES[tx.type] ? TX_TYPES[tx.type].ledger : null);
  function linkedPartners(state, tx) {
    if (!tx.linkId) return [];
    return state.transactions.filter((t) => t.linkId === tx.linkId && t.id !== tx.id);
  }

  function txSort(a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    const ta = a.time || '', tb = b.time || '';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return (a.createdAt || '') < (b.createdAt || '') ? -1 : (a.createdAt || '') > (b.createdAt || '') ? 1 : 0;
  }

  // ---------- validation ----------

  function validateTx(state, tx) {
    const errors = [];
    const t = TX_TYPES[tx.type];
    if (!t) { errors.push('Choose a transaction type.'); return errors; }
    if (typeof tx.amount !== 'number' || !isFinite(tx.amount)) errors.push('Enter an amount in rupees.');
    else if (tx.amount <= 0) errors.push('Amount must be more than ₹0. Use a refund for money coming back.');
    else if (tx.amount > 1e9) errors.push('That amount looks too large. Check for extra zeros.');
    if (!isValidDate(tx.date)) errors.push('Enter a valid date.');
    if (tx.time && !/^\d{2}:\d{2}$/.test(tx.time)) errors.push('Time must look like 14:30.');

    const fromSide = tx.from ? sideOf(state, tx.from) : null;
    const toSide = tx.to ? sideOf(state, tx.to) : null;
    if (tx.from && !fromSide) errors.push('The "from" account no longer exists.');
    if (tx.to && !toSide) errors.push('The "to" account no longer exists.');
    const fk = tx.from ? kindOf(state, tx.from) : null;
    const tk = tx.to ? kindOf(state, tx.to) : null;
    const partner = tx.linkId ? state.transactions.find((p) => p.linkId === tx.linkId && p.id !== tx.id) : null;
    const fundedByFlexi = !tx.from && tx.linkId && (tx._pendingFunding || (partner && partner.type === 'flexi_withdrawal'));
    const needsCategory = t.ledger === 'expense';
    if (needsCategory && !cat(state, tx.categoryId)) errors.push('Choose a category.');

    switch (tx.type) {
      case 'expense':
        if (fk === 'card') errors.push('Card purchases are recorded as credit-card purchases.');
        else if (fk === 'flexi' || fk === 'loan') errors.push('To pay from the flexi loan, choose "From flexi loan" as the payment method.');
        else if (!fromSide && !fundedByFlexi) errors.push('Choose which account paid.');
        if (tx.to) errors.push('An expense cannot pay into one of your accounts.');
        break;
      case 'cc_purchase':
        if (fk !== 'card') errors.push('Choose the credit card used.');
        if (tx.to) errors.push('A purchase cannot pay into one of your accounts.');
        break;
      case 'refund':
        if (!(toSide === 'asset' || tk === 'card')) errors.push('Choose where the refund arrived (bank, cash or card).');
        if (tx.from) errors.push('A refund only has a destination account.');
        break;
      case 'income':
        if (toSide !== 'asset') errors.push('Income must arrive in a bank, cash or savings account.');
        if (tx.from) errors.push('Income only has a destination account.');
        break;
      case 'transfer':
        if (fromSide !== 'asset' || toSide !== 'asset') errors.push('Transfers move money between your bank, cash and savings accounts.');
        else if (tx.from === tx.to) errors.push('Choose two different accounts.');
        break;
      case 'flexi_deposit':
        if (tk !== 'flexi') errors.push('Choose the flexi-loan account.');
        if (tx.from && fromSide !== 'asset') errors.push('Deposits come from a bank, cash or savings account.');
        break;
      case 'flexi_withdrawal':
        if (fk !== 'flexi') errors.push('Choose the flexi-loan account.');
        if (tx.to && toSide !== 'asset') errors.push('Withdrawals go to a bank, cash or savings account.');
        if (!WITHDRAWAL_PURPOSES[tx.purpose || 'unclassified']) errors.push('Choose what the withdrawal was for.');
        break;
      case 'cc_payment':
        if (tk !== 'card') errors.push('Choose the credit card being paid.');
        if (fk === 'flexi') errors.push('Paying from the flexi loan creates a linked withdrawal. Use "Pay card bill" with the flexi loan as the source.');
        else if (tx.from && fromSide !== 'asset') errors.push('Card bills are paid from a bank, cash or savings account, or from the flexi loan.');
        else if (!tx.from && !fundedByFlexi) errors.push('Choose which account paid the bill.');
        break;
      case 'loan_interest':
      case 'loan_fee':
        if (fromSide !== 'liability') errors.push('Choose the loan or card that charged it.');
        if (tx.to) errors.push('Charges only have one account.');
        break;
      case 'principal_adjustment':
        if (!(tk === 'flexi' || tk === 'loan')) errors.push('Choose the loan that recorded the repayment.');
        if (tx.from && fromSide !== 'asset') errors.push('Repayments come from a bank, cash or savings account.');
        break;
    }
    if (tx.tags && !Array.isArray(tx.tags)) errors.push('Tags must be a list.');
    return errors;
  }

  function normalizeTx(input) {
    const tx = { ...input };
    if (typeof tx.amount === 'string') tx.amount = parseAmount(tx.amount);
    if (typeof tx.amount === 'number' && isFinite(tx.amount)) tx.amount = r2(tx.amount);
    tx.from = tx.from || null;
    tx.to = tx.to || null;
    tx.time = tx.time || '';
    tx.tags = Array.isArray(tx.tags) ? tx.tags.filter((x) => TAGS.includes(x)) : [];
    tx.description = (tx.description || '').trim();
    tx.notes = (tx.notes || '').trim();
    tx.recurring = !!tx.recurring;
    if (tx.type === 'flexi_withdrawal' && !tx.purpose) tx.purpose = 'unclassified';
    if (TX_TYPES[tx.type] && TX_TYPES[tx.type].ledger !== 'expense') { delete tx.categoryId; delete tx.subcategory; }
    return tx;
  }

  function parseAmount(s) {
    if (typeof s === 'number') return s;
    if (s == null) return NaN;
    let str = String(s).trim().replace(/₹|rs\.?|inr/gi, '').replace(/,/g, '').replace(/\s+/g, '');
    let neg = false;
    if (/cr$/i.test(str)) { neg = true; str = str.replace(/cr$/i, ''); }
    else if (/dr$/i.test(str)) str = str.replace(/dr$/i, '');
    if (/^\(.*\)$/.test(str)) { neg = true; str = str.slice(1, -1); }
    if (str === '' || !/^-?\d*\.?\d+$/.test(str)) return NaN;
    const n = parseFloat(str);
    return neg ? -n : n;
  }

  // ---------- operations (mutate state, return result) ----------

  function addTx(state, input) {
    const tx = normalizeTx(input);
    tx.id = tx.id || uid();
    const now = new Date().toISOString();
    tx.createdAt = tx.createdAt || now;
    tx.updatedAt = now;
    const errors = validateTx(state, tx);
    if (errors.length) return { ok: false, errors };
    delete tx._pendingFunding;
    state.transactions.push(tx);
    return { ok: true, tx };
  }

  // Adds several linked records atomically: all validate or none are added.
  function addLinked(state, inputs) {
    const linkId = 'L' + uid();
    const now = new Date().toISOString();
    const txs = inputs.map((inp, i) => {
      const tx = normalizeTx({ ...inp, linkId });
      tx.id = uid() + i;
      tx.createdAt = now; tx.updatedAt = now;
      return tx;
    });
    const errors = [];
    txs.forEach((tx) => {
      const probe = { ...tx, _pendingFunding: !tx.from && txs.some((o) => o !== tx && o.type === 'flexi_withdrawal') };
      validateTx(state, probe).forEach((e) => errors.push(e));
    });
    if (errors.length) return { ok: false, errors: [...new Set(errors)] };
    txs.forEach((tx) => state.transactions.push(tx));
    return { ok: true, txs, linkId };
  }

  // Salary credited to bank, then (some or all of it) parked in the flexi loan.
  function addSalaryDay(state, { amount, depositAmount, date, bankId, flexiId, description }) {
    const dep = depositAmount == null ? amount : depositAmount;
    const items = [{ type: 'income', amount, date, to: bankId, source: 'salary', description: description || 'Salary', linkRole: 'salary' }];
    if (dep > 0) items.push({ type: 'flexi_deposit', amount: dep, date, from: bankId, to: flexiId, source: 'salary', description: 'Salary parked in flexi loan', linkRole: 'salary' });
    return addLinked(state, items);
  }

  // Card bill paid out of the flexi loan: one withdrawal (owed +) and one card payment (card owed −).
  function addCardPaymentFromFlexi(state, { cardId, flexiId, amount, date, time, notes }) {
    const card = acct(state, cardId);
    return addLinked(state, [
      { type: 'flexi_withdrawal', amount, date, time, from: flexiId, to: null, purpose: 'cc_bill', linkRole: 'funding',
        description: 'Withdrawal to pay ' + (card ? card.name : 'card'), notes },
      { type: 'cc_payment', amount, date, time, from: null, to: cardId, linkRole: 'funded',
        description: 'Bill payment from flexi loan', notes },
    ]);
  }

  // A purchase paid straight out of the flexi loan: the withdrawal is financing, the purchase is the expense.
  function addExpenseFromFlexi(state, flexiId, expense) {
    return addLinked(state, [
      { type: 'flexi_withdrawal', amount: expense.amount, date: expense.date, time: expense.time, from: flexiId, to: null,
        purpose: 'purchase', linkRole: 'funding', description: 'Paid directly: ' + (expense.description || 'purchase') },
      { ...expense, type: 'expense', from: null, method: 'flexi', linkRole: 'funded' },
    ]);
  }

  function updateTx(state, id, patch) {
    const i = state.transactions.findIndex((t) => t.id === id);
    if (i < 0) return { ok: false, errors: ['That entry no longer exists.'] };
    const old = state.transactions[i];
    const next = normalizeTx({ ...old, ...patch, id: old.id, createdAt: old.createdAt, linkId: old.linkId, linkRole: old.linkRole });
    next.updatedAt = new Date().toISOString();
    const errors = validateTx(state, next);
    if (errors.length) return { ok: false, errors };
    // A funding withdrawal and the payment/purchase it funds always carry the same amount and date.
    const mirrors = [];
    if (old.linkRole === 'funding' || old.linkRole === 'funded') {
      linkedPartners(state, old).forEach((p) => {
        if (p.linkRole === 'funding' || p.linkRole === 'funded') mirrors.push(p);
      });
    }
    state.transactions[i] = next;
    mirrors.forEach((p) => {
      p.amount = next.amount; p.date = next.date; p.time = next.time; p.updatedAt = next.updatedAt;
    });
    return { ok: true, tx: next, mirrored: mirrors.map((m) => m.id) };
  }

  function deleteTx(state, id, { withLinked = true } = {}) {
    const tx = txById(state, id);
    if (!tx) return { ok: false, errors: ['That entry no longer exists.'] };
    const partners = linkedPartners(state, tx);
    // Funded records cannot outlive their funding withdrawal (and vice versa): they would fail validation.
    const mustGo = partners.filter((p) => (p.linkRole === 'funding' || p.linkRole === 'funded'));
    const ids = new Set([id, ...(withLinked ? partners.map((p) => p.id) : mustGo.map((p) => p.id))]);
    state.transactions = state.transactions.filter((t) => !ids.has(t.id));
    if (!withLinked) partners.filter((p) => !ids.has(p.id)).forEach((p) => { delete p.linkId; delete p.linkRole; });
    return { ok: true, deleted: [...ids] };
  }

  function duplicateTx(state, id, date) {
    const src = txById(state, id);
    if (!src) return { ok: false, errors: ['That entry no longer exists.'] };
    if (src.linkRole === 'funded' || src.linkRole === 'funding') {
      const partner = linkedPartners(state, src).find((p) => p.linkRole === 'funding' || p.linkRole === 'funded');
      const pair = [src, partner].map((t) => { const c = { ...t, date: date || t.date }; ['id', 'linkId', 'createdAt', 'updatedAt', 'importBatch'].forEach((k) => delete c[k]); return c; });
      return addLinked(state, pair);
    }
    const copy = { ...src, date: date || src.date };
    ['id', 'linkId', 'linkRole', 'createdAt', 'updatedAt', 'importBatch', 'gaming'].forEach((k) => delete copy[k]);
    return addTx(state, copy);
  }

  // ---------- spending ----------

  function spendValue(tx) {
    if (tx.type === 'expense' || tx.type === 'cc_purchase') return tx.amount;
    if (tx.type === 'refund') return -tx.amount;
    return 0;
  }

  function isDiscretionary(state, tx) {
    const tags = tx.tags || [];
    if (tags.includes('discretionary') || tags.includes('avoidable') || tags.includes('impulse')) return true;
    if (tags.includes('essential')) return false;
    const c = cat(state, tx.categoryId);
    return !!c && c.group === 'discretionary';
  }

  function inBudgetScope(state, tx, budget) {
    budget = budget || state.settings.budget;
    if (ledgerOf(tx) !== 'expense') return false;
    switch (budget.scope) {
      case 'living': return !isDiscretionary(state, tx);
      case 'discretionary': return isDiscretionary(state, tx);
      case 'custom': return (budget.custom || []).includes(tx.categoryId);
      default: return true;
    }
  }

  function categoriesInScope(state, budget) {
    budget = budget || state.settings.budget;
    return state.categories.filter((c) => {
      if (budget.scope === 'custom') return (budget.custom || []).includes(c.id);
      if (budget.scope === 'living') return c.group !== 'discretionary';
      if (budget.scope === 'discretionary') return c.group === 'discretionary';
      return true;
    });
  }

  const inRange = (tx, from, to) => tx.date >= from && tx.date <= to;
  const spendingTxs = (state, from, to) => state.transactions.filter((t) => ledgerOf(t) === 'expense' && inRange(t, from, to));
  const movementTxs = (state, from, to) => state.transactions.filter((t) => ledgerOf(t) !== 'expense' && inRange(t, from, to));

  function totalSpending(state, from, to, pred) {
    return sum(spendingTxs(state, from, to).filter((t) => !pred || pred(t)), spendValue);
  }

  function byCategory(state, from, to) {
    const map = {};
    spendingTxs(state, from, to).forEach((t) => { map[t.categoryId] = r2((map[t.categoryId] || 0) + spendValue(t)); });
    return Object.entries(map).map(([id, amount]) => ({ id, name: (cat(state, id) || { name: id }).name, amount }))
      .sort((a, b) => b.amount - a.amount);
  }

  const isGamingTx = (state, t) => { const c = cat(state, t.categoryId); return !!c && !!c.gaming; };

  // ---------- account balances ----------

  function txEffects(state, tx) {
    const out = [];
    if (tx.from) out.push([tx.from, sideOf(state, tx.from) === 'liability' ? tx.amount : -tx.amount]);
    if (tx.to) out.push([tx.to, sideOf(state, tx.to) === 'liability' ? -tx.amount : tx.amount]);
    return out;
  }
  function effectOn(state, tx, accountId) {
    return txEffects(state, tx).reduce((s, [id, d]) => (id === accountId ? s + d : s), 0);
  }

  // Anchors: known balances. opening = balance at the START of its date; statements = balance at the END of theirs.
  function anchorsFor(state, accountId) {
    const a = acct(state, accountId);
    const list = [];
    if (a && a.opening && isValidDate(a.opening.date) && typeof a.opening.balance === 'number') {
      list.push({ date: a.opening.date, position: 'start', balance: a.opening.balance, confirmed: !!a.opening.confirmed, source: a.opening.source || 'Opening balance', kind: 'opening' });
    }
    state.statements.filter((s) => s.accountId === accountId && typeof s.closingBalance === 'number' && isValidDate(s.date))
      .forEach((s) => list.push({ date: s.date, position: 'end', balance: s.closingBalance, confirmed: true, source: 'Lender statement', kind: 'statement', statementId: s.id }));
    return list.sort((x, y) => (x.date !== y.date ? (x.date < y.date ? -1 : 1) : (x.position === y.position ? 0 : x.position === 'start' ? -1 : 1)));
  }
  const anchorCovers = (anchor, tx) => (anchor.position === 'start' ? tx.date >= anchor.date : tx.date > anchor.date);

  // Balance at the end of `date`. Returns null when no starting balance is known.
  function balanceAt(state, accountId, date) {
    const anchors = anchorsFor(state, accountId).filter((an) => an.date <= date);
    if (!anchors.length) return null;
    const an = anchors[anchors.length - 1];
    const delta = state.transactions.filter((t) => t.date <= date && anchorCovers(an, t))
      .reduce((s, t) => s + effectOn(state, t, accountId), 0);
    return r2(an.balance + delta);
  }

  function balanceInfo(state, accountId, date) {
    const anchors = anchorsFor(state, accountId).filter((an) => an.date <= date);
    const balance = balanceAt(state, accountId, date);
    if (balance == null) return { balance: null, status: 'unknown' };
    const an = anchors[anchors.length - 1];
    const moved = state.transactions.some((t) => t.date <= date && anchorCovers(an, t) && effectOn(state, t, accountId) !== 0);
    let status;
    if (!moved) status = an.confirmed ? 'confirmed' : 'reported';
    else status = 'calculated';
    return { balance, status, anchor: an, movedSinceAnchor: moved };
  }

  function reconcile(state, accountId) {
    const anchors = anchorsFor(state, accountId);
    return anchors.filter((a) => a.kind === 'statement').map((an) => {
      const idx = anchors.indexOf(an);
      const prev = idx > 0 ? anchors[idx - 1] : null;
      const st = state.statements.find((s) => s.id === an.statementId);
      if (!prev) return { statement: st, calculated: null, difference: null, flagged: false };
      const delta = state.transactions.filter((t) => t.date <= an.date && anchorCovers(prev, t))
        .reduce((s, t) => s + effectOn(state, t, accountId), 0);
      const calculated = r2(prev.balance + delta);
      const difference = r2(an.balance - calculated);
      return { statement: st, previous: prev, calculated, difference, flagged: Math.abs(difference) >= 1 && !(st && st.acknowledged) };
    });
  }

  // ---------- flexi-loan daily model ----------

  // Day-by-day utilized balance with estimated interest and estimated interest saved by parked deposits.
  // Parked amount P: rises with each flexi deposit, falls (never below zero) with each draw on the loan.
  // Counterfactual balance without the temporary deposits = actual + P. Saving = interest(cf) - interest(actual).
  function flexiSeries(state, accountId, from, to) {
    const a = acct(state, accountId);
    const anchors = anchorsFor(state, accountId);
    if (!a || !anchors.length) return [];
    const rate = (a.rate || 0) / 100;
    const dc = a.dayCount || 365;
    const first = anchors[0];
    const txs = state.transactions.filter((t) => effectOn(state, t, accountId) !== 0 && anchorCovers(first, t) && t.date <= to).sort(txSort);
    const byDay = {};
    txs.forEach((t) => { (byDay[t.date] = byDay[t.date] || []).push(t); });
    const anchorByDay = {};
    anchors.forEach((an) => { (anchorByDay[an.date] = anchorByDay[an.date] || []).push(an); });

    const out = [];
    let bal = null, parked = 0;
    for (let d = first.date; d <= to; d = addDays(d, 1)) {
      const dayAnchors = anchorByDay[d] || [];
      const startAn = dayAnchors.find((x) => x.position === 'start');
      const endAn = dayAnchors.find((x) => x.position === 'end');
      if (startAn) bal = startAn.balance;
      if (bal == null && endAn) bal = endAn.balance;
      let deposits = 0, draws = 0, charges = 0;
      (byDay[d] || []).forEach((t) => {
        const e = effectOn(state, t, accountId);
        bal += e;
        if (t.type === 'flexi_deposit') { deposits += t.amount; parked += t.amount; }
        else if (t.type === 'loan_interest' || t.type === 'loan_fee') { charges += t.amount; }
        else if (e > 0) { draws += e; parked = Math.max(0, parked - e); }
      });
      let confirmed = false;
      if (endAn) { bal = endAn.balance; confirmed = true; }
      else if (startAn && startAn.confirmed && !(byDay[d] || []).length) confirmed = true;
      bal = r2(bal);
      const est = Math.max(0, bal) * rate / dc;
      const cf = bal + parked;
      const saved = (Math.max(0, cf) - Math.max(0, bal)) * rate / dc;
      if (d >= from) out.push({ date: d, balance: bal, estInterest: est, parked: r2(parked), estSaved: saved, deposits: r2(deposits), draws: r2(draws), charges: r2(charges), confirmed });
    }
    return out;
  }

  function flexiMonth(state, accountId, mk, today) {
    const ms = monthStart(mk), me = monthEnd(mk);
    const end = minDate(me, today);
    const a = acct(state, accountId);
    const series = end >= ms ? flexiSeries(state, accountId, ms, end) : [];
    const txs = state.transactions.filter((t) => inRange(t, ms, me) && effectOn(state, t, accountId) !== 0);
    const dep = txs.filter((t) => t.type === 'flexi_deposit');
    const wd = txs.filter((t) => t.type === 'flexi_withdrawal');
    const byPurpose = {};
    wd.forEach((t) => { const p = t.purpose || 'unclassified'; byPurpose[p] = r2((byPurpose[p] || 0) + t.amount); });
    const interestCharged = sum(txs.filter((t) => t.type === 'loan_interest'), (t) => t.amount);
    const fees = sum(txs.filter((t) => t.type === 'loan_fee'), (t) => t.amount);
    const principal = sum(txs.filter((t) => t.type === 'principal_adjustment'), (t) => t.amount);
    const estToDate = sum(series, (s) => s.estInterest);
    const savedToDate = sum(series, (s) => s.estSaved);
    const current = series.length ? series[series.length - 1].balance : balanceAt(state, accountId, end);
    const daysLeft = end < me && end >= ms ? diffDays(end, me) : 0;
    const projectedRest = current != null ? r2(Math.max(0, current) * (a.rate / 100) / (a.dayCount || 365) * daysLeft) : 0;
    let openingForMonth = balanceAt(state, accountId, addDays(ms, -1));
    if (openingForMonth == null) {
      const an = anchorsFor(state, accountId)[0];
      if (an && an.date >= ms && an.date <= me) openingForMonth = an.balance;
    }
    const statements = state.statements.filter((s) => s.accountId === accountId && inRange(s, ms, me));
    const stmtInterest = statements.reduce((s, st) => s + (st.interestCharged || 0), 0);
    return {
      month: mk, hasData: txs.length > 0 || statements.length > 0,
      deposits: sum(dep, (t) => t.amount), depositCount: dep.length,
      salaryDeposits: sum(dep.filter((t) => t.source === 'salary'), (t) => t.amount),
      withdrawals: sum(wd, (t) => t.amount), withdrawalCount: wd.length, byPurpose,
      interestCharged, fees, principal,
      statementInterest: r2(stmtInterest),
      netPrincipalChange: r2(sum(dep, (t) => t.amount) + principal - sum(wd, (t) => t.amount)),
      startBalance: openingForMonth, endBalance: current,
      netBalanceChange: openingForMonth != null && current != null ? r2(current - openingForMonth) : null,
      estInterestToDate: r2(estToDate), estInterestMonth: r2(estToDate + projectedRest),
      estSavedToDate: r2(savedToDate),
      confirmedReduction: confirmedReduction(state, accountId, ms, me),
      series,
    };
  }

  // Debt reduction proven by two confirmed balances (lender statements or a balance you confirmed).
  function confirmedReduction(state, accountId, from, to) {
    const confirmed = anchorsFor(state, accountId).filter((an) => an.confirmed);
    const before = confirmed.filter((an) => an.date < from || (an.date === from && an.position === 'start'));
    const within = confirmed.filter((an) => an.date <= to && !before.includes(an));
    if (!before.length || !within.length) return null;
    const s = before[before.length - 1], e = within[within.length - 1];
    return { from: s, to: e, amount: r2(s.balance - e.balance) };
  }

  // ---------- payoff projections ----------

  function payoffPlan(balance, annualRatePct, monthlyPrincipal, startMonth) {
    if (!(balance > 0)) return { months: 0, totalInterest: 0, payoffMonth: startMonth, firstInterest: 0 };
    if (!(monthlyPrincipal > 0)) return null;
    const r = annualRatePct / 100 / 12;
    let bal = balance, months = 0, totalInterest = 0;
    const firstInterest = r2(bal * r);
    while (bal > 0.5 && months < 600) {
      totalInterest += bal * r;
      bal -= monthlyPrincipal;
      months++;
    }
    return { months, totalInterest: r2(totalInterest), firstInterest, payoffMonth: addMonths(startMonth, months) };
  }

  function requiredPrincipal(balance, targetDate, today) {
    if (!isValidDate(targetDate) || targetDate <= today || !(balance > 0)) return null;
    const months = Math.max(1, (Number(targetDate.slice(0, 4)) - Number(today.slice(0, 4))) * 12 + (Number(targetDate.slice(5, 7)) - Number(today.slice(5, 7))));
    return { months, perMonth: r2(balance / months) };
  }

  // Average monthly fall in the utilized balance across completed months that have records.
  function recordedPattern(state, accountId, today) {
    const curMk = monthKey(today);
    const anchors = anchorsFor(state, accountId);
    if (!anchors.length) return null;
    const firstMk = monthKey(anchors[0].date);
    const months = [];
    for (let mk = firstMk; mk < curMk; mk = addMonths(mk, 1)) {
      const s = balanceAt(state, accountId, addDays(monthStart(mk), -1));
      const e = balanceAt(state, accountId, monthEnd(mk));
      const hasTx = state.transactions.some((t) => monthKey(t.date) === mk && effectOn(state, t, accountId) !== 0);
      if (s != null && e != null && hasTx) months.push({ month: mk, reduction: r2(s - e) });
    }
    if (!months.length) return { months: [], average: null };
    return { months, average: r2(sum(months, (m) => m.reduction) / months.length) };
  }

  function emi(principal, annualRatePct, months) {
    if (!(principal > 0) || !(months > 0)) return null;
    const r = annualRatePct / 100 / 12;
    if (r === 0) return r2(principal / months);
    const f = Math.pow(1 + r, months);
    return r2(principal * r * f / (f - 1));
  }

  function educationProjection(state, accountId, today) {
    const a = acct(state, accountId);
    const bal = balanceAt(state, accountId, today);
    if (!a || bal == null) return null;
    const monthlyInterestNow = r2(bal * a.rate / 100 / 12);
    let balanceAtStart = null, monthsToStart = null;
    if (isValidDate(a.repaymentStart) && a.repaymentStart > today) {
      monthsToStart = (Number(a.repaymentStart.slice(0, 4)) - Number(today.slice(0, 4))) * 12 + (Number(a.repaymentStart.slice(5, 7)) - Number(today.slice(5, 7)));
      if (a.moratoriumInterest === 'capitalized') balanceAtStart = r2(bal * Math.pow(1 + a.rate / 100 / 12, monthsToStart));
      else if (a.moratoriumInterest === 'paid') balanceAtStart = bal;
      else if (a.moratoriumInterest === 'simple') balanceAtStart = r2(bal + monthlyInterestNow * monthsToStart);
    }
    const basis = balanceAtStart != null ? balanceAtStart : bal;
    const monthly = a.tenureMonths ? emi(basis, a.rate, a.tenureMonths) : null;
    return {
      balance: bal, monthlyInterestNow, dailyInterestNow: r2(bal * a.rate / 100 / 365),
      monthsToStart, balanceAtStart, emi: monthly,
      totalRepaid: monthly ? r2(monthly * a.tenureMonths) : null,
      totalInterest: monthly ? r2(monthly * a.tenureMonths - basis) : null,
    };
  }

  // ---------- credit cards ----------

  function cardSummary(state, cardId, today) {
    const card = acct(state, cardId);
    const info = balanceInfo(state, cardId, today);
    const stmts = state.statements.filter((s) => s.accountId === cardId).sort((a, b) => (a.date < b.date ? -1 : 1));
    const latest = stmts.length ? stmts[stmts.length - 1] : null;
    let paidSince = 0, remaining = null, daysToDue = null;
    if (latest) {
      paidSince = sum(state.transactions.filter((t) => t.to === cardId && (t.type === 'cc_payment') && t.date > latest.date), (t) => t.amount);
      const credits = sum(state.transactions.filter((t) => t.to === cardId && t.type === 'refund' && t.date > latest.date), (t) => t.amount);
      remaining = r2(Math.max(0, (latest.statementBalance || 0) - paidSince - credits));
      if (isValidDate(latest.dueDate)) daysToDue = diffDays(today, latest.dueDate);
    }
    const mk = monthKey(today);
    const purchasesThisMonth = sum(state.transactions.filter((t) => t.type === 'cc_purchase' && t.from === cardId && monthKey(t.date) === mk), (t) => t.amount);
    const limitUse = card && card.limit && info.balance != null ? info.balance / card.limit : null;
    return { card, balance: info.balance, status: info.status, latest, paidSince, remaining, daysToDue, purchasesThisMonth, limitUse };
  }

  // ---------- duplicates & review ----------

  function pairKey(a, b) { return [a, b].sort().join('|'); }

  function looksDuplicate(a, b, windowDays) {
    if (a.id === b.id) return false;
    if (a.linkId && a.linkId === b.linkId) return false;
    if (a.type !== b.type || a.amount !== b.amount) return false;
    if ((a.from || null) !== (b.from || null) || (a.to || null) !== (b.to || null)) return false;
    if (Math.abs(diffDays(a.date, b.date)) > windowDays) return false;
    if (ledgerOf(a) === 'expense' && a.categoryId !== b.categoryId && a.categoryId !== 'uncategorized' && b.categoryId !== 'uncategorized') return false;
    return true;
  }

  function findDuplicates(state, windowDays = 2) {
    const groups = {};
    state.transactions.forEach((t) => { const k = t.type + ':' + t.amount; (groups[k] = groups[k] || []).push(t); });
    const pairs = [];
    Object.values(groups).forEach((g) => {
      for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
        if (looksDuplicate(g[i], g[j], windowDays) && !state.dupDismissed.includes(pairKey(g[i].id, g[j].id))) pairs.push([g[i], g[j]]);
      }
    });
    return pairs;
  }

  function findSimilar(state, candidate, windowDays = 2) {
    const c = normalizeTx(candidate);
    return state.transactions.filter((t) => t.id !== c.id && looksDuplicate({ ...c, id: c.id || '__new' }, t, windowDays));
  }

  function reviewQueue(state, today) {
    const items = [];
    const dismissed = new Set(state.reviewDismissed || []);
    const push = (it) => { if (!dismissed.has(it.key)) items.push(it); };
    state.transactions.forEach((t) => {
      if (t.type === 'flexi_withdrawal' && (t.purpose || 'unclassified') === 'unclassified')
        push({ key: 'wd:' + t.id, kind: 'categorize_withdrawal', severity: 'warn', title: 'Withdrawal needs a purpose', txIds: [t.id],
          detail: 'Say what this flexi withdrawal paid for. If it paid for purchases, log those purchases as expenses.' });
      if (ledgerOf(t) === 'expense' && t.categoryId === 'uncategorized')
        push({ key: 'cat:' + t.id, kind: 'categorize_expense', severity: 'warn', title: 'Expense needs a category', txIds: [t.id], detail: t.description || '' });
      if (t.needsReview)
        push({ key: 'flag:' + t.id, kind: 'flagged', severity: 'info', title: 'Marked for review', txIds: [t.id], detail: t.notes || t.description || '' });
    });
    findDuplicates(state).forEach(([a, b]) => push({ key: 'dup:' + pairKey(a.id, b.id), kind: 'duplicate', severity: 'warn',
      title: 'Possible duplicate', txIds: [a.id, b.id], detail: 'Same type, amount and account within 2 days. Keep both if they are real, or delete one.' }));
    state.accounts.filter((a) => ACCOUNT_KINDS[a.kind].side === 'liability').forEach((a) => {
      reconcile(state, a.id).filter((r) => r.flagged).forEach((r) => push({ key: 'rec:' + r.statement.id, kind: 'reconcile', severity: 'warn',
        title: a.name + ': statement differs from the app', txIds: [], statementId: r.statement.id, accountId: a.id,
        detail: 'Statement ' + r.statement.date + ' shows ' + r.statement.closingBalance + '; the app calculated ' + r.calculated + ' (difference ' + r.difference + ').',
        difference: r.difference, calculated: r.calculated, statementBalance: r.statement.closingBalance, statementDate: r.statement.date }));
    });
    const salaryDepMonths = new Set(state.transactions.filter((t) => t.type === 'flexi_deposit' && t.source === 'salary').map((t) => monthKey(t.date)));
    salaryDepMonths.forEach((mk) => {
      const hasIncome = state.transactions.some((t) => t.type === 'income' && t.source === 'salary' && monthKey(t.date) === mk);
      if (!hasIncome) push({ key: 'sal:' + mk, kind: 'salary_missing', severity: 'info', title: 'Salary deposit without salary income', txIds: [], month: mk,
        detail: 'A salary deposit is recorded for ' + mk + ' but no salary income. The deposit is never counted as income, so add the salary credit if you want income totals to be right.' });
    });
    state.accounts.filter((a) => a.kind === 'card').forEach((a) => {
      const s = cardSummary(state, a.id, today);
      if (s.latest && s.remaining > 0 && s.daysToDue != null && s.daysToDue <= 7)
        push({ key: 'due:' + s.latest.id + ':' + s.remaining, kind: 'card_due', severity: s.daysToDue < 0 ? 'critical' : 'warn', accountId: a.id, txIds: [],
          title: a.name + (s.daysToDue < 0 ? ' payment overdue' : ' due in ' + s.daysToDue + (s.daysToDue === 1 ? ' day' : ' days')),
          detail: 'Pay the full statement balance to avoid interest and late fees.', remaining: s.remaining, dueDate: s.latest.dueDate });
    });
    (state.gamingLog || []).forEach((g) => {
      if (g.kind === 'urge' && g.coolOffUntil && !g.outcome && new Date(g.coolOffUntil) <= new Date())
        push({ key: 'cool:' + g.id, kind: 'cooloff_done', severity: 'info', title: 'Cooling-off period finished', txIds: [], gamingId: g.id,
          detail: 'Decide whether you still want: ' + (g.item || 'this purchase') + '.' });
    });
    return items;
  }

  // ---------- budget ----------

  function budgetStatus(state, mk, today) {
    const b = state.settings.budget;
    const ms = monthStart(mk), me = monthEnd(mk);
    const tracked = state.settings.trackingStart || ms;
    const periodStart = maxDate(ms, tracked);
    const periodEnd = minDate(me, today);
    const daysElapsed = periodEnd >= periodStart ? diffDays(periodStart, periodEnd) + 1 : 0;
    const daysTotal = me >= periodStart ? diffDays(periodStart, me) + 1 : 0;
    const txs = spendingTxs(state, ms, me);
    const scoped = txs.filter((t) => inBudgetScope(state, t, b));
    const spent = sum(scoped, spendValue);
    const hasData = txs.length > 0;
    const remaining = r2(b.amount - spent);
    const daysLeft = Math.max(0, daysTotal - daysElapsed);
    const dailyAvg = daysElapsed > 0 ? r2(spent / daysElapsed) : null;
    const projected = daysElapsed > 0 && hasData ? r2(spent / daysElapsed * daysTotal) : null;
    const expectedByNow = daysTotal > 0 ? r2(b.amount * daysElapsed / daysTotal) : 0;
    const plannedInScope = sum(categoriesInScope(state, b).filter((c) => c.plan), (c) => c.plan);
    const plannedFood = sum(state.categories.filter((c) => c.food && c.plan), (c) => c.plan);
    const recordedDays = new Set(scoped.map((t) => t.date)).size;
    let verdict;
    if (!hasData) verdict = 'no_data';
    else if (daysElapsed < 7 || scoped.length < 3) verdict = 'too_early';
    else if (projected <= b.amount) verdict = 'on_track';
    else if (projected <= b.amount * 1.1) verdict = 'tight';
    else verdict = 'over';
    return {
      month: mk, budget: b.amount, scope: b.scope, spent, remaining, hasData, daysElapsed, daysTotal, daysLeft,
      dailyAvg, projected, expectedByNow, paceDelta: r2(spent - expectedByNow),
      perDayLeft: daysLeft > 0 ? r2(remaining / daysLeft) : null,
      plannedInScope, plannedFood, plannedLeftover: r2(b.amount - plannedInScope),
      recordedDays, txCount: scoped.length, verdict, partialMonth: periodStart > ms,
    };
  }

  // The separated totals the dashboard shows. None of these feed into each other.
  function monthTotals(state, mk, today) {
    const ms = monthStart(mk), me = monthEnd(mk);
    const all = state.transactions.filter((t) => inRange(t, ms, me));
    const of = (type) => all.filter((t) => t.type === type);
    const flexis = state.accounts.filter((a) => a.kind === 'flexi');
    let saved = 0, confirmed = null;
    flexis.forEach((f) => {
      const fm = flexiMonth(state, f.id, mk, today);
      saved += fm.estSavedToDate;
      if (fm.confirmedReduction) confirmed = (confirmed || 0) + fm.confirmedReduction.amount;
    });
    return {
      month: mk,
      hasSpendingData: all.some((t) => ledgerOf(t) === 'expense'),
      spending: sum(all.filter((t) => ledgerOf(t) === 'expense'), spendValue),
      income: sum(of('income'), (t) => t.amount),
      flexiDeposits: sum(of('flexi_deposit'), (t) => t.amount),
      flexiWithdrawals: sum(of('flexi_withdrawal'), (t) => t.amount),
      cardPurchases: sum(of('cc_purchase'), (t) => t.amount),
      cardPayments: sum(of('cc_payment'), (t) => t.amount),
      refunds: sum(of('refund'), (t) => t.amount),
      transfers: sum(of('transfer'), (t) => t.amount),
      interest: sum(of('loan_interest'), (t) => t.amount),
      fees: sum(of('loan_fee'), (t) => t.amount),
      principalRepaid: sum(of('principal_adjustment'), (t) => t.amount),
      confirmedDebtReduction: confirmed,
      estInterestSaved: r2(saved),
    };
  }

  function monthlyTrend(state, endMk, count) {
    const out = [];
    for (let i = count - 1; i >= 0; i--) {
      const mk = addMonths(endMk, -i);
      const txs = spendingTxs(state, monthStart(mk), monthEnd(mk));
      out.push({ month: mk, hasData: txs.length > 0, spending: txs.length ? sum(txs, spendValue) : null });
    }
    return out;
  }

  function dailySpending(state, from, to) {
    const out = [];
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const txs = spendingTxs(state, d, d);
      out.push({ date: d, amount: sum(txs, spendValue), count: txs.length });
    }
    return out;
  }

  // ---------- goals ----------

  function goalProgress(state, goal, today) {
    const earmarked = sum(goal.entries || [], (e) => (e.kind === 'release' ? -e.amount : e.amount));
    const saved = goal.accountId ? (balanceAt(state, goal.accountId, today) || 0) : 0;
    const total = r2(saved + earmarked);
    const remaining = r2(Math.max(0, goal.target - total));
    const months = goal.monthlyContribution > 0 ? Math.ceil(remaining / goal.monthlyContribution) : null;
    const transfers = goal.accountId ? state.transactions.filter((t) => t.from === goal.accountId || t.to === goal.accountId) : [];
    return {
      earmarked, saved, total, remaining, pct: goal.target > 0 ? Math.min(1, total / goal.target) : 0,
      months, eta: months != null ? addMonths(monthKey(today), months) : null, transfers,
    };
  }

  function addGoalEntry(goal, { kind, amount, date, note }) {
    const errors = [];
    if (!(typeof amount === 'number' && isFinite(amount) && amount > 0)) errors.push('Enter an amount more than ₹0.');
    if (!isValidDate(date)) errors.push('Enter a valid date.');
    if (!['earmark', 'release'].includes(kind)) errors.push('Choose earmark or release.');
    if (errors.length) return { ok: false, errors };
    const e = { id: uid(), kind, amount: r2(amount), date, note: (note || '').trim() };
    goal.entries.push(e);
    return { ok: true, entry: e };
  }

  // ---------- gaming ----------

  function gamingStats(state, mk) {
    const g = state.transactions.filter((t) => ledgerOf(t) === 'expense' && isGamingTx(state, t));
    const month = g.filter((t) => monthKey(t.date) === mk);
    const log = state.gamingLog || [];
    const urges = log.filter((x) => x.kind === 'urge');
    return {
      monthPurchases: sum(month.filter((t) => t.type !== 'refund'), (t) => t.amount),
      monthRefunds: sum(month.filter((t) => t.type === 'refund'), (t) => t.amount),
      monthNet: sum(month, spendValue),
      monthCount: month.filter((t) => t.type !== 'refund').length,
      lifetimeNet: sum(g, spendValue),
      lifetimeCount: g.filter((t) => t.type !== 'refund').length,
      urgesMonth: urges.filter((x) => monthKey(x.date) === mk).length,
      resisted: urges.filter((x) => x.outcome === 'resisted').length,
      resistedAmount: sum(urges.filter((x) => x.outcome === 'resisted' && x.amount), (x) => x.amount),
      attempts: log.filter((x) => x.kind === 'attempt').length,
      waitedPurchases: g.filter((t) => t.gaming && t.gaming.waited === 'yes').length,
      byMonth: (() => { const m = {}; g.forEach((t) => { const k = monthKey(t.date); m[k] = r2((m[k] || 0) + spendValue(t)); }); return m; })(),
      txs: g,
    };
  }

  // ---------- CSV ----------

  function csvEscape(v) {
    if (v == null) return '';
    const s = String(v);
    return /[",\n\r]/.test(s) || /^[=+\-@]/.test(s) ? '"' + (/^[=+\-@]/.test(s) ? "'" : '') + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) { return rows.map((r) => r.map(csvEscape).join(',')).join('\r\n'); }

  function parseCSV(text) {
    const rows = []; let row = [], field = '', q = false;
    text = String(text).replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some((x) => x.trim() !== '')) rows.push(row);
        row = [];
      } else field += c;
    }
    row.push(field);
    if (row.some((x) => x.trim() !== '')) rows.push(row);
    return rows;
  }

  function exportTransactionsCSV(state, { spendingOnly = false } = {}) {
    const name = (id) => (id ? (acct(state, id) || { name: id }).name : '');
    const head = ['date', 'time', 'type', 'type_label', 'ledger', 'counts_as_spending', 'spending_effect_inr', 'amount_inr',
      'from_account', 'to_account', 'category', 'subcategory', 'description', 'payment_method', 'withdrawal_purpose', 'source',
      'tags', 'recurring', 'notes', 'link_id', 'id'];
    const rows = [...state.transactions].sort(txSort)
      .filter((t) => !spendingOnly || ledgerOf(t) === 'expense')
      .map((t) => [t.date, t.time, t.type, TX_TYPES[t.type].label, ledgerOf(t), ledgerOf(t) === 'expense' ? 'yes' : 'no', spendValue(t), t.amount,
        name(t.from), name(t.to), t.categoryId ? (cat(state, t.categoryId) || { name: t.categoryId }).name : '', t.subcategory || '',
        t.description, t.method ? PAYMENT_METHODS[t.method] || t.method : '', t.purpose ? WITHDRAWAL_PURPOSES[t.purpose] : '',
        t.source || '', (t.tags || []).join(' '), t.recurring ? 'yes' : 'no', t.notes, t.linkId || '', t.id]);
    return toCSV([head, ...rows]);
  }

  const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  // Indian statements use day-first dates. Accepts 05/11/2026, 05-11-26, 2026-11-05, 05 Nov 2026, 05-Nov-26.
  function parseStatementDate(s) {
    s = String(s || '').trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return fmtYMD(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) return fmtYMD(fullYear(+m[3]), +m[2], +m[1]);
    if ((m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-,]*(\d{2,4})/))) {
      const mi = MONTHS.indexOf(m[2].toLowerCase());
      if (mi >= 0) return fmtYMD(fullYear(+m[3]), mi + 1, +m[1]);
    }
    return null;
  }
  const fullYear = (y) => (y < 100 ? 2000 + y : y);
  function fmtYMD(y, m, d) { const s = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); return isValidDate(s) ? s : null; }

  function detectColumns(header) {
    const h = header.map((x) => String(x).toLowerCase().trim());
    const find = (re) => h.findIndex((x) => re.test(x));
    return {
      date: find(/\bdate\b/),
      description: find(/description|narration|details|particular|merchant|remarks/),
      amount: find(/^amount|amount \(|\bamt\b|^inr\b/),
      debit: find(/\bdebit\b|withdrawal|^dr\b|\(dr\)/),
      credit: find(/\bcredit\b(?! card)|\bdeposit\b|^cr\b|\(cr\)/),
      drcr: find(/^type$|dr\s*\/\s*cr|cr\s*\/\s*dr/),
    };
  }

  // Turn statement rows into reviewable card transactions. Nothing is added here.
  function prepareCardImport(state, cardId, text) {
    const rows = parseCSV(text);
    if (rows.length < 2) return { ok: false, errors: ['The file needs a header row and at least one transaction.'] };
    const cols = detectColumns(rows[0]);
    if (cols.date < 0) return { ok: false, errors: ['Could not find a Date column.'] };
    if (cols.amount < 0 && cols.debit < 0) return { ok: false, errors: ['Could not find an Amount or Debit column.'] };
    const items = [], skipped = [];
    rows.slice(1).forEach((r, i) => {
      const date = parseStatementDate(r[cols.date]);
      let amt = NaN, isCredit = false;
      if (cols.debit >= 0 && String(r[cols.debit] || '').trim()) { amt = parseAmount(r[cols.debit]); }
      else if (cols.credit >= 0 && String(r[cols.credit] || '').trim()) { amt = parseAmount(r[cols.credit]); isCredit = true; }
      else if (cols.amount >= 0) {
        amt = parseAmount(r[cols.amount]);
        if (amt < 0) { isCredit = true; amt = -amt; }
        if (cols.drcr >= 0 && /cr/i.test(r[cols.drcr] || '')) isCredit = true;
        if (/cr\s*$/i.test(String(r[cols.amount] || ''))) isCredit = true;
      }
      amt = Math.abs(amt);
      if (!date || !isFinite(amt) || amt === 0) { skipped.push({ line: i + 2, raw: r.join(', ') }); return; }
      const description = cols.description >= 0 ? String(r[cols.description] || '').trim() : '';
      const tx = isCredit
        ? { type: 'refund', amount: r2(amt), date, to: cardId, categoryId: 'uncategorized', description: description || 'Card credit', needsReview: true }
        : { type: 'cc_purchase', amount: r2(amt), date, from: cardId, categoryId: 'uncategorized', description, method: 'credit_card' };
      const dups = findSimilar(state, tx, 3);
      const looksLikePayment = isCredit && /payment|thank you|autopay|neft|imps|upi/i.test(description);
      items.push({ line: i + 2, tx, isCredit, duplicates: dups.map((d) => d.id), looksLikePayment,
        include: dups.length === 0 && !looksLikePayment });
    });
    return { ok: true, items, skipped, columns: cols };
  }

  function commitImport(state, items) {
    const batch = 'imp' + uid();
    const added = [], errors = [];
    items.filter((it) => it.include).forEach((it) => {
      const res = addTx(state, { ...it.tx, importBatch: batch });
      if (res.ok) added.push(res.tx); else errors.push('Line ' + it.line + ': ' + res.errors.join(' '));
    });
    return { added, errors, batch };
  }

  // ---------- backup ----------

  function exportBackup(state) {
    return JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
  }

  function validateBackup(text) {
    let obj;
    try { obj = typeof text === 'string' ? JSON.parse(text) : text; }
    catch (e) { return { ok: false, errors: ['This file is not valid JSON. Choose a backup file exported from this app.'] }; }
    const errors = [], warnings = [];
    if (!obj || typeof obj !== 'object') return { ok: false, errors: ['The backup is empty.'] };
    if (obj.app !== APP_ID) errors.push('This file was not exported from this app.');
    if (typeof obj.version !== 'number' || obj.version > SCHEMA_VERSION) errors.push('This backup comes from a newer version of the app.');
    ['accounts', 'transactions', 'categories', 'statements', 'goals'].forEach((k) => { if (!Array.isArray(obj[k])) errors.push('Missing list: ' + k + '.'); });
    if (!obj.settings || typeof obj.settings !== 'object') errors.push('Missing settings.');
    if (errors.length) return { ok: false, errors };
    const probe = { ...createDefaultState(null, BLANK_PROFILE), ...obj, transactions: [] };
    const ids = new Set();
    obj.transactions.forEach((t, i) => {
      if (!t || typeof t !== 'object' || !t.id) { errors.push('Transaction ' + (i + 1) + ' has no id.'); return; }
      if (ids.has(t.id)) errors.push('Transaction id ' + t.id + ' appears twice.');
      ids.add(t.id);
      const e = validateTx({ ...probe, transactions: obj.transactions }, t);
      if (e.length) errors.push('Transaction ' + (i + 1) + ' (' + (t.date || '?') + ', ' + (t.type || '?') + '): ' + e.join(' '));
    });
    if (errors.length > 20) { const n = errors.length; errors.length = 20; errors.push('…and ' + (n - 20) + ' more problems.'); }
    return {
      ok: errors.length === 0, errors, warnings, data: obj,
      counts: { transactions: obj.transactions.length, accounts: obj.accounts.length, statements: obj.statements.length, goals: obj.goals.length },
    };
  }

  // Merge keeps existing records; adds new ids; reports (never merges) content duplicates.
  function mergeBackup(state, data) {
    const have = new Set(state.transactions.map((t) => t.id));
    let added = 0, skipped = 0;
    data.accounts.forEach((a) => { if (!acct(state, a.id)) state.accounts.push(a); });
    data.categories.forEach((c) => { if (!cat(state, c.id)) state.categories.push(c); });
    data.transactions.forEach((t) => { if (have.has(t.id)) skipped++; else { state.transactions.push(t); added++; } });
    const sids = new Set(state.statements.map((s) => s.id));
    data.statements.forEach((s) => { if (!sids.has(s.id)) state.statements.push(s); });
    data.goals.forEach((g) => {
      const mine = state.goals.find((x) => x.id === g.id);
      if (!mine) state.goals.push(g);
      else { const eids = new Set(mine.entries.map((e) => e.id)); g.entries.forEach((e) => { if (!eids.has(e.id)) mine.entries.push(e); }); }
    });
    const gids = new Set((state.gamingLog || []).map((x) => x.id));
    (data.gamingLog || []).forEach((x) => { if (!gids.has(x.id)) state.gamingLog.push(x); });
    return { added, skipped, possibleDuplicates: findDuplicates(state).length };
  }

  function migrate(obj) {
    const base = createDefaultState(obj && obj.settings && obj.settings.trackingStart, BLANK_PROFILE);
    const out = { ...base, ...obj };
    out.settings = { ...base.settings, ...(obj.settings || {}) };
    out.settings.budget = { ...base.settings.budget, ...((obj.settings || {}).budget || {}) };
    out.settings.history = { ...base.settings.history, ...((obj.settings || {}).history || {}) };
    ['transactions', 'statements', 'gamingLog', 'dupDismissed', 'reviewDismissed'].forEach((k) => { if (!Array.isArray(out[k])) out[k] = []; });
    out.goals = (out.goals || []).map((g) => ({ entries: [], ...g }));
    return out;
  }

  const api = {
    SCHEMA_VERSION, APP_ID, TX_TYPES, ACCOUNT_KINDS, WITHDRAWAL_PURPOSES, PAYMENT_METHODS, TAGS, GAMING_TRIGGERS, BUDGET_SCOPES,
    r2, sum, uid, isValidDate, addDays, diffDays, monthKey, monthStart, monthEnd, daysInMonth, addMonths, weekStart, todayLocal,
    createDefaultState, BLANK_PROFILE, acct, cat, txById, ledgerOf, linkedPartners, txSort, sideOf, kindOf,
    validateTx, normalizeTx, parseAmount,
    addTx, addLinked, addSalaryDay, addCardPaymentFromFlexi, addExpenseFromFlexi, updateTx, deleteTx, duplicateTx,
    spendValue, isDiscretionary, inBudgetScope, categoriesInScope, spendingTxs, movementTxs, totalSpending, byCategory, isGamingTx,
    txEffects, effectOn, anchorsFor, balanceAt, balanceInfo, reconcile,
    flexiSeries, flexiMonth, confirmedReduction, payoffPlan, requiredPrincipal, recordedPattern, emi, educationProjection,
    cardSummary, findDuplicates, findSimilar, pairKey, reviewQueue,
    budgetStatus, monthTotals, monthlyTrend, dailySpending,
    goalProgress, addGoalEntry, gamingStats,
    toCSV, parseCSV, exportTransactionsCSV, parseStatementDate, prepareCardImport, commitImport,
    exportBackup, validateBackup, mergeBackup, migrate,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Core = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function () {
'use strict';
// ---------- app foundation: storage, formatting, sheets, charts ----------
const C = window.Core;
const STORE_KEY = 'rupee-ledger.v1';
const DEMO_KEY = 'rupee-ledger.demo.v1';
const META_KEY = 'rupee-ledger.meta';

let S = null;            // the whole saved state
let demo = false;        // demo mode uses a separate storage slot
let storageOK = true;
const ACTIONS = {};      // data-act="name" click handlers
const FORMS = {};        // data-form="name" submit handlers
const CHANGES = {};      // data-change="name" change/input handlers

const today = () => C.todayLocal();
const ui = {
  tab: 'overview',
  month: C.monthKey(C.todayLocal()),
  exp: { view: 'spending', period: 'month', anchor: C.todayLocal(), from: '', to: '', q: '', cat: '', method: '', tag: '', showFilters: false },
};

// ---------- storage ----------
function readMeta() { try { return JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch (e) { return {}; } }
function writeMeta(m) { try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) { /* storage blocked */ } }
function load() {
  try {
    demo = !!readMeta().demo;
    const raw = localStorage.getItem(demo ? DEMO_KEY : STORE_KEY);
    S = raw ? C.migrate(JSON.parse(raw)) : (demo ? makeDemoState() : C.createDefaultState(today()));
    storageOK = true;
  } catch (e) {
    storageOK = false; demo = false;
    S = C.createDefaultState(today());
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
}
function save() {
  try { localStorage.setItem(demo ? DEMO_KEY : STORE_KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
}
function commit(msg) { save(); render(); if (msg) toast(msg); }

// ---------- formatting ----------
const INR0 = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
const INR2 = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NUM0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
function money(n, opts) {
  opts = opts || {};
  if (n == null || !isFinite(n)) return '—';
  const abs = Math.abs(n);
  const f = opts.dp === 2 || (opts.dp !== 0 && abs < 100 && Math.round(abs) !== abs) ? INR2 : INR0;
  let s = f.format(opts.dp === 0 ? Math.round(abs) : abs);
  if (n < 0 && Math.round(abs * 100) !== 0) s = '−' + s;
  else if (opts.sign && n > 0) s = '+' + s;
  return s;
}
const compact = (n) => (Math.abs(n) >= 1e5 ? '₹' + (n / 1e5).toFixed(n % 1e5 === 0 ? 0 : 1) + 'L' : Math.abs(n) >= 1000 ? '₹' + (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k' : '₹' + Math.round(n));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function fmtDate(s, withYear) {
  if (!s) return '—';
  const [y, m, d] = s.split('-').map(Number);
  const showYear = withYear === true || (withYear !== false && String(y) !== today().slice(0, 4));
  return d + ' ' + MON[m - 1] + (showYear ? ' ' + y : '');
}
function fmtDay(s) {
  const t = today();
  if (s === t) return 'Today';
  if (s === C.addDays(t, -1)) return 'Yesterday';
  const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(s + 'T00:00:00').getDay()];
  return dow + ', ' + fmtDate(s);
}
const fmtMonth = (mk) => MONTH_FULL[Number(mk.slice(5, 7)) - 1] + ' ' + mk.slice(0, 4);
const fmtMonthShort = (mk) => MON[Number(mk.slice(5, 7)) - 1];
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const pct = (x) => (x == null || !isFinite(x) ? '—' : Math.round(x * 100) + '%');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

const accountName = (id) => { const a = C.acct(S, id); return a ? a.name : '—'; };
const catName = (id) => { const c = C.cat(S, id); return c ? c.name : 'Unknown category'; };
const accountsOf = (...kinds) => S.accounts.filter((a) => kinds.includes(a.kind) && !a.archived);
const flexiAcct = () => accountsOf('flexi')[0] || null;
const gameLabel = () => (S.settings.gamingName ? S.settings.gamingName + ' & gaming' : 'Gaming');
const firstGoal = () => S.goals[0] || null;
const GAMING_CAT = 'gaming';

const STATUS_BADGE = {
  confirmed: '<span class="badge good">Confirmed</span>',
  reported: '<span class="badge warn">Last reported</span>',
  calculated: '<span class="badge info">Calculated</span>',
  unknown: '<span class="badge">Not set</span>',
};
const badge = (text, kind) => '<span class="badge ' + (kind || '') + '">' + esc(text) + '</span>';

// ---------- icons ----------
const ICON = {

// ---------- sheets & dialogs ----------
function openSheet(title, bodyHtml, opts) {
  opts = opts || {};
  const root = $('#sheets');
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = '<div class="backdrop" data-act="closeSheet"></div>' +
    '<section class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="sheet-head"><h2>' + esc(title) + '</h2><button class="icon-btn" type="button" data-act="closeSheet" aria-label="Close">' + ICON.close + '</button></div>' +
    '<div class="sheet-body">' + bodyHtml + '</div></section>';
  root.appendChild(wrap);
  document.body.classList.add('locked');
  const sheet = wrap.querySelector('.sheet');
  if (opts.onMount) opts.onMount(sheet);
  const first = sheet.querySelector('[autofocus]');
  if (first && window.matchMedia('(hover: hover)').matches) first.focus();
  return sheet;
}
function closeSheet() {
  const root = $('#sheets');
  if (root.lastElementChild) root.lastElementChild.remove();
  if (!root.children.length) document.body.classList.remove('locked');
}
function closeAllSheets() { $('#sheets').innerHTML = ''; document.body.classList.remove('locked'); }
ACTIONS.closeSheet = () => closeSheet();

// In-page confirmation (browser confirm() is unreliable on iOS web views and blocked in some frames).
function confirmBox({ title, body, confirm, cancel, danger, typed, alt }) {
  return new Promise((resolve) => {
    const id = 'c' + C.uid();
    const html = '<div class="note' + (danger ? ' bad' : '') + '">' + body + '</div>' +
      (typed ? '<label class="field"><span>Type ' + esc(typed) + ' to confirm</span><input id="' + id + '-typed" autocomplete="off" autocapitalize="characters"></label>' : '') +
      '<div class="btn-row">' +
      '<button class="btn" type="button" id="' + id + '-no">' + esc(cancel || 'Cancel') + '</button>' +
      (alt ? '<button class="btn" type="button" id="' + id + '-alt">' + esc(alt) + '</button>' : '') +
      '<button class="btn ' + (danger ? 'danger' : 'primary') + '" type="button" id="' + id + '-yes"' + (typed ? ' disabled' : '') + '>' + esc(confirm || 'Confirm') + '</button></div>';
    const sheet = openSheet(title, html);
    const done = (v) => { closeSheet(); resolve(v); };
    sheet.querySelector('#' + id + '-no').onclick = () => done(false);
    sheet.querySelector('#' + id + '-yes').onclick = () => done(true);
    if (alt) sheet.querySelector('#' + id + '-alt').onclick = () => done('alt');
    sheet.parentElement.querySelector('.backdrop').onclick = (e) => { e.stopPropagation(); done(false); };
    sheet.querySelector('.sheet-head [data-act="closeSheet"]').onclick = (e) => { e.stopPropagation(); done(false); };
    if (typed) {
      const inp = sheet.querySelector('#' + id + '-typed');
      inp.oninput = () => { sheet.querySelector('#' + id + '-yes').disabled = inp.value.trim().toUpperCase() !== typed; };
    }
  });
}
