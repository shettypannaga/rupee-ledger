function pageHtml(i) {
  const entry = ui.stack[i];
  const P = PAGES[entry.page];
  const title = P.title(entry.params);
  const back = i ? PAGES[ui.stack[i - 1].page].title(ui.stack[i - 1].params) : TAB_TITLES[ui.tab];
  return navBar({ title, back, right: P.right ? P.right(entry.params) : '' }) +
    '<div class="screen-body">' + largeHead(title, P.kick ? P.kick(entry.params) : '') + P.render(entry.params) + '</div>';
}

function push(page, params) {
  if (!PAGES[page]) return;
  ui.stack.push({ page, params: params || {} });
  MORE = {};
  const el = document.createElement('section');
  el.className = 'page entering';
  el.setAttribute('aria-label', PAGES[page].title(params || {}));
  el.innerHTML = pageHtml(ui.stack.length - 1);
  el.addEventListener('scroll', () => compactNav(el.querySelector('.nav'), el.scrollTop), { passive: true });
  $('#pages').appendChild(el);
  void el.offsetWidth;
  el.classList.remove('entering');
  document.body.classList.add('paged');
}
function pop(all) {
  const els = $$('#pages > .page:not(.leaving)');
  const n = all ? els.length : Math.min(1, els.length);
  for (let k = 0; k < n; k++) {
    const el = els[els.length - 1 - k];
    ui.stack.pop();
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 460);
  }
  if (!ui.stack.length) document.body.classList.remove('paged');
}
function switchTab(tab) {
  if (tab !== ui.tab) scrollMem[ui.tab] = window.scrollY;
  $$('#pages > .page').forEach((el) => el.remove());
  ui.stack = [];
  document.body.classList.remove('paged');
  const changed = tab !== ui.tab;
  ui.tab = tab;
  render();
  if (changed) window.scrollTo(0, scrollMem[tab] || 0);
}
ACTIONS.tab = (d) => {
  if (d.tab === ui.tab) { if (ui.stack.length) pop(true); else window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  switchTab(d.tab);
};

// Swipe from the left edge to go back, as in iOS apps.
function initSwipeBack() {
  let start = null, el = null, dx = 0, t0 = 0;
  document.addEventListener('touchstart', (e) => {
    if (!ui.stack.length || openWraps().length) return;
    const t = e.touches[0];
    if (t.clientX > 24) return;
    el = $$('#pages > .page:not(.leaving)').pop();
    if (el) { start = { x: t.clientX, y: t.clientY }; dx = 0; t0 = Date.now(); }
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!start) return;
    const t = e.touches[0];
    dx = Math.max(0, t.clientX - start.x);
    if (dx < 10 && Math.abs(t.clientY - start.y) > 12) { start = null; return; }
    el.classList.add('dragging'); document.body.classList.add('dragging');
    el.style.transform = 'translateX(' + dx + 'px)';
  }, { passive: true });
  const end = () => {
    if (!start) return;
    el.classList.remove('dragging'); document.body.classList.remove('dragging');
    el.style.transform = '';
    if (dx > window.innerWidth * 0.33 || (dx > 40 && dx / Math.max(1, Date.now() - t0) > 0.5)) pop();
    start = null;
  };
  document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
  window.addEventListener('scroll', () => compactNav($('#root .nav'), window.scrollY), { passive: true });
}

    (S.settings.budget.status === 'proposed' ? ' <span class="badge">Proposed</span>' : '') + '</span>' +
    (isCur && b.hasData && b.perDayLeft != null ? '<span>' + (b.perDayLeft >= 0 ? money(b.perDayLeft) + ' a day' : 'No room left') + '</span>' : '') + '</div>' +
    verdictLines(b, isCur) + '</section>';

  // Needs attention
  const att = [];
  if (!S.settings.setupDone) att.push(row('Finish setup', '', { sub: 'Balances, cards and what the budget covers', icon: ICON.check, ic: 'brand', act: 'openSetup' }));
  const q = C.reviewQueue(S, t);
  if (q.length) {
    const sev = q.some((i) => i.severity === 'critical') ? 'bad' : q.some((i) => i.severity === 'warn') ? 'warn' : '';
    att.push(row(plural(q.length, 'item') + ' to review', '', { sub: esc(q[0].title), icon: ICON.flag, ic: sev || 'neutral', act: 'openReview' }));
  }
  const last = S.settings.lastBackupAt;
  if (S.transactions.length >= 5 && (!last || C.diffDays(last.slice(0, 10), t) >= 14))
    att.push(row('Back up your data', '', { sub: last ? 'Last backup ' + fmtDate(last.slice(0, 10)) : 'No backup yet', icon: ICON.shield, ic: 'neutral', act: 'openBackup' }));
  if (att.length) h += section('', group(att.join(''), true));

  // This month
  const food = C.totalSpending(S, ms, me, (x) => { const c = C.cat(S, x.categoryId); return c && c.food; });
  const disc = C.totalSpending(S, ms, me, (x) => C.isDiscretionary(S, x));
  h += section('This month', group(
    row('Daily average', b.dailyAvg != null && b.hasData ? money(b.dailyAvg) : '—', { sub: b.hasData ? 'Across ' + plural(b.daysElapsed, 'tracked day') : 'No data recorded', icon: ICON.chart, ic: 'neutral', act: 'go', data: { page: 'insights' } }) +
    row('Food & supplements', b.hasData ? money(food) : '—', { sub: b.plannedFood ? 'Plan ' + money(b.plannedFood) : 'Food, eggs, milk, supplements', icon: CAT_ICON.food_supplies, ic: 'neutral', act: 'go', data: { page: 'insights' } }) +
    row('Discretionary', b.hasData ? money(disc) : '—', { sub: 'By category or tag', icon: CAT_ICON.shopping, ic: 'neutral', act: 'go', data: { page: 'insights' } }) +
    row('Income', tot.income ? money(tot.income) : '—', { sub: tot.income ? 'Salary and other income' : 'None recorded', icon: ICON.down, ic: 'good', act: 'go', data: { page: 'moneyflow' } }), true));

  // Money
  const fx = flexiAcct();
  const money_ = [];
  if (fx) {
    const info = C.balanceInfo(S, fx.id, asOf);
    const fm = C.flexiMonth(S, fx.id, mk, t);
    money_.push(row('Flexi loan', money(info.balance), { sub: STATUS_BADGE[info.status] + ' · interest ≈ ' + money(fm.estInterestMonth), icon: ICON.loan, act: 'go', data: { page: 'flexi' } }));
    money_.push(row('Interest saved by parking', money(fm.estSavedToDate), { sub: 'Estimate for ' + fmtMonthShort(mk), icon: ICON.percent, ic: 'good', act: 'go', data: { page: 'flexi' } }));
  }
  const cards = accountsOf('card');
  if (cards.length) {
    const sums = cards.map((c) => C.cardSummary(S, c.id, t));
    const owed = C.sum(sums.map((s) => s.balance || 0));
    const dues = sums.filter((s) => s.latest && s.remaining > 0 && s.daysToDue != null).sort((a, b2) => a.daysToDue - b2.daysToDue);
    money_.push(row(cards.length === 1 ? esc(cards[0].name) : 'Credit cards', money(owed), {
      sub: dues.length ? 'Due ' + fmtDate(dues[0].latest.dueDate) + ' · ' + money(dues[0].remaining) + (cards.length > 1 ? ' on ' + esc(dues[0].card.name) : '') : sums.some((s) => s.latest) ? 'Latest statements paid' : 'No statement entered yet',
      icon: ICON.card, ic: dues.length && dues[0].daysToDue <= 7 ? 'warn' : '', act: cards.length === 1 ? 'go' : 'tab', data: cards.length === 1 ? { page: 'card', id: cards[0].id } : { tab: 'accounts' } }));
  } else money_.push(row('Credit cards', '', { sub: 'Add a card to track bills apart from spending', icon: ICON.card, ic: 'neutral', act: 'addAccount', data: { kind: 'card' } }));
  accountsOf('loan').forEach((ln) => {
    const i = C.balanceInfo(S, ln.id, asOf);
    money_.push(row(esc(ln.name), money(i.balance), { sub: STATUS_BADGE[i.status], icon: ICON.bank, ic: 'neutral', act: 'go', data: { page: 'loan', id: ln.id } }));
  });
  h += section('Money', group(money_.join(''), true));

  if (fx) {
    const recent = S.transactions.filter((x) => C.effectOn(S, x, fx.id) !== 0).sort(C.txSort).reverse().slice(0, 3);
    if (recent.length) h += section('Recent loan movements', group(recent.map((x) => txRow(x, { showDate: true })).join(''), true), '<button class="link" data-act="go" data-page="flexi">See all</button>');
  }

  // Goals
  const gl = [];
  S.goals.forEach((g) => {
    const p = C.goalProgress(S, g, t);
    gl.push(row(esc(g.name), money(p.total), { sub: pct(p.pct) + ' of ' + money(g.target), extra: mini(p.pct), icon: ICON.target, act: 'tab', data: { tab: 'goals' } }));
  });
  const gs = C.gamingStats(S, mk);
  const fcTarget = S.settings.fcMonthlyTarget || 0;
  gl.push(row(esc(S.settings.gamingName || 'Gaming'), money(gs.monthNet), { sub: gs.monthNet <= fcTarget ? '<span class="badge good">On target</span> ' + money(fcTarget) + '/month' : '<span class="badge warn">Above target</span> ' + money(fcTarget) + '/month', icon: ICON.game, ic: gs.monthNet <= fcTarget ? 'neutral' : 'warn', act: 'tab', data: { tab: 'goals' } }));
  h += section('Goals', group(gl.join(''), true));

  h += section('', group(
    row('Money flow', '', { sub: 'Spending, income, loan and card movements kept apart', icon: ICON.flow, ic: 'neutral', act: 'go', data: { page: 'moneyflow' } }) +
    row('Insights', '', { sub: 'Trends, categories, plan vs actual', icon: ICON.chart, ic: 'neutral', act: 'go', data: { page: 'insights' } }) +
    row('Back up & restore', '', { sub: last ? 'Last backup ' + fmtDate(last.slice(0, 10)) : 'No backup yet', icon: ICON.shield, ic: last ? 'neutral' : 'warn', act: 'openBackup' }), true));
  return h;
};

function verdictLines(b, isCur) {
  let main = '', cls = '';
  const pace = b.hasData && isCur ? (b.paceDelta > 0 ? '<span class="warn">' + money(b.paceDelta) + ' ahead of an even pace.</span> ' : '<span class="good">' + money(-b.paceDelta) + ' under an even pace.</span> ') : '';
  if (b.verdict === 'no_data') main = isCur ? 'Log purchases as they happen. After a week the app will tell you if ' + money(b.budget) + ' is realistic.' : 'Nothing was logged this month.';
  else if (b.verdict === 'too_early') main = 'Too early to judge. A verdict appears after 7 days.';
  else if (b.verdict === 'on_track') { main = 'On track for about ' + money(b.projected) + '.'; cls = 'good'; }
  else if (b.verdict === 'tight') { main = 'Heading for about ' + money(b.projected) + ', just over budget.'; cls = 'warn'; }
  else { main = 'Heading for about ' + money(b.projected) + ', ' + money(b.projected - b.budget) + ' over budget.'; cls = 'warn'; }
  const extra = [];
  if (b.plannedInScope > 0) extra.push(b.plannedLeftover > 0 ? 'Your food & supplement plan (' + money(b.plannedInScope) + ') leaves ' + money(b.plannedLeftover) + ' of this budget for everything else.' : 'Your food & supplement plan (' + money(b.plannedInScope) + ') is more than this budget on its own.');
  if (b.partialMonth) extra.push('Tracking began ' + fmtDate(S.settings.trackingStart) + ', so pace uses ' + plural(b.daysTotal, 'day') + '.');
  return '<p class="verdict">' + pace + '<span class="' + cls + '">' + main + '</span></p>' + (extra.length ? '<p class="verdict faint">' + extra.join(' ') + '</p>' : '');
}

function reviewShort(it) {
  if (it.kind === 'card_due') return 'Pay ' + money(it.remaining) + ' by ' + fmtDate(it.dueDate) + ' to avoid interest.';
  if (it.kind === 'reconcile') return 'Difference of ' + money(it.difference) + ' to check.';
  if (it.kind === 'duplicate') { const a = C.txById(S, it.txIds[0]); return a ? money(a.amount) + ' · ' + fmtDate(a.date) + ' recorded twice?' : ''; }
  if (it.kind === 'categorize_withdrawal') { const a = C.txById(S, it.txIds[0]); return a ? money(a.amount) + ' on ' + fmtDate(a.date) : ''; }
  return it.detail || '';
}

// ---------- transaction rows ----------
function txRow(x, opts) {
  opts = opts || {};
  const L = C.ledgerOf(x);
  let title, sub, val, vcls = '', icon, ic = '';
  if (L === 'expense') {
    title = x.description || catName(x.categoryId);
    const parts = [x.description ? catName(x.categoryId) : null, x.subcategory || null,
      x.type === 'cc_purchase' ? accountName(x.from) : x.method === 'flexi' ? 'From flexi loan' : x.method ? C.PAYMENT_METHODS[x.method] : (x.from ? accountName(x.from) : null)].filter(Boolean);
    sub = parts.map(esc).join(' · ');
    val = x.type === 'refund' ? '+' + money(x.amount) : money(x.amount);
    if (x.type === 'refund') { vcls = 'credit'; icon = ICON.refund; ic = 'good'; } else icon = catIcon(x.categoryId);
  } else {
    title = x.description || C.TX_TYPES[x.type].label;
    sub = esc(movementLine(x));
    val = money(x.amount); vcls = 'neutral';
    icon = TYPE_ICON[x.type] || ICON.swap; ic = x.type === 'income' ? 'good' : 'neutral';
  }
  const meta = [];
  if (x.recurring) meta.push(badge('Recurring'));
  (x.tags || []).forEach((tg) => meta.push(badge(tg, tg === 'impulse' || tg === 'avoidable' ? 'warn' : '')));
  if (x.linkId) meta.push(badge('Linked', 'info'));
  if (x.type === 'flexi_withdrawal' && (x.purpose || 'unclassified') === 'unclassified') meta.push(badge('Needs categorization', 'warn'));
  if (opts.balance != null) meta.push('<span class="badge">Balance after ' + money(opts.balance) + '</span>');
  return '<button class="row tx has-ic" type="button" data-act="txDetail" data-id="' + x.id + '"><span class="ic ' + ic + '">' + icon + '</span>' +
    '<span class="label"><span class="title">' + esc(title) + '</span><span class="sub">' + sub + (opts.showDate ? ' · ' + fmtDate(x.date) : '') + '</span>' + (meta.length ? '<span class="meta">' + meta.join('') + '</span>' : '') + '</span>' +
    '<span class="value ' + vcls + '">' + val + '</span></button>';
}
function movementLine(x) {
  const f = x.from ? accountName(x.from) : null, to = x.to ? accountName(x.to) : null;
  switch (x.type) {
    case 'income': return 'Income → ' + to;
    case 'transfer': return f + ' → ' + to;
    case 'flexi_deposit': return 'Deposit ' + (f ? 'from ' + f + ' ' : '') + '→ ' + to;
    case 'flexi_withdrawal': return 'Withdrawal · ' + C.WITHDRAWAL_PURPOSES[x.purpose || 'unclassified'] + (to ? ' → ' + to : '');
    case 'cc_payment': return 'Card bill → ' + to + (f ? ' from ' + f : ' (from flexi loan)');
    case 'loan_interest': return 'Interest charged by ' + f;
    case 'loan_fee': return 'Fee charged by ' + f;
    case 'principal_adjustment': return 'Principal repayment → ' + to;
    default: return C.TX_TYPES[x.type].label;
  }
}
function exclusionReason(x) {
  switch (x.type) {
    case 'income': return 'Income. Counted in income totals, never as spending.';
    case 'transfer': return 'Money moved between your own accounts. Not income or spending.';
    case 'flexi_deposit': return 'Deposit into the flexi loan. It lowers the utilized balance, and the interest charged, for as long as it stays there. It is not spending, and it is not a permanent principal repayment.';
    case 'flexi_withdrawal': {
      const p = x.purpose || 'unclassified';
      if (p === 'cc_bill') return 'Withdrawal that paid a card bill. The card purchases were already counted as spending on the days you made them.';
      if (p === 'living') return 'Withdrawal into your account for living costs. What you buy with it is logged as expenses, so the withdrawal itself is not spending.';
      if (p === 'purchase') return 'Financing for a purchase that is logged separately as an expense. Counted once, as that expense.';
      if (p === 'unclassified') return 'Needs categorization. Say what this paid for; it is not counted as spending meanwhile.';
      return 'Borrowing from the flexi loan. Not spending by itself; log anything you buy as an expense.';
    }
    case 'cc_payment': return 'Card bill payment. It reduces what you owe the card. It does not reverse or repeat the original purchases.';
    case 'loan_interest': return 'Interest charged on a loan or card. Shown under interest & fees and kept out of your spending budget.';
    case 'loan_fee': return 'A lender fee. Shown under interest & fees and kept out of your spending budget.';
    case 'principal_adjustment': return 'A permanent principal repayment recorded by the lender. Reduces the loan; not spending.';
    default: return '';
  }
}

// ---------- Activity ----------
function expRange() {
  const e = ui.exp, a = e.anchor;
  if (e.period === 'day') return [a, a, fmtDay(a)];
  if (e.period === 'week') { const s = C.weekStart(a), en = C.addDays(s, 6); return [s, en, fmtDate(s) + ' – ' + fmtDate(en)]; }
  if (e.period === 'custom') {
    const f = e.from || C.monthStart(C.monthKey(today())), t2 = e.to || today();
    return [f <= t2 ? f : t2, f <= t2 ? t2 : f, fmtDate(f) + ' – ' + fmtDate(t2)];
  }
  const mk = C.monthKey(a);
  return [C.monthStart(mk), C.monthEnd(mk), fmtMonth(mk)];
}
function matchesFilters(x) {
  const e = ui.exp;
  if (e.cat && x.categoryId !== e.cat) return false;
  if (e.method && (x.type === 'cc_purchase' ? 'credit_card' : x.method) !== e.method) return false;
  if (e.tag && !(x.tags || []).includes(e.tag)) return false;
  if (e.q) {
    const q = e.q.toLowerCase();
    const hay = [x.description, x.notes, x.subcategory, x.categoryId ? catName(x.categoryId) : '', C.TX_TYPES[x.type].label, String(x.amount)].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function groupedList(txs, opts) {
  if (!txs.length) return '';
  const byDate = {};
  txs.forEach((x) => { (byDate[x.date] = byDate[x.date] || []).push(x); });
  return Object.keys(byDate).sort().reverse().map((d) => {
    const list = byDate[d].sort(C.txSort).reverse();
    const daySpend = C.sum(list.map(C.spendValue));
    return '<div class="day-head"><span>' + fmtDay(d) + '</span><span class="tnum">' + (opts && opts.movements ? '' : money(daySpend)) + '</span></div>' + group(list.map((x) => txRow(x)).join(''), true);
  }).join('');
}

VIEWS.activity = function () {
  const e = ui.exp, t = today();
  const queue = C.reviewQueue(S, t);
  let h = '<div class="toolbar"><div class="seg" role="group" aria-label="Ledger view">' +
    [['spending', 'Spending'], ['movements', 'Movements'], ['review', 'Review']].map(([v, l]) =>
      '<button type="button" data-act="expView" data-v="' + v + '" aria-pressed="' + (e.view === v) + '">' + l + (v === 'review' && queue.length ? '<span class="count">' + queue.length + '</span>' : '') + '</button>').join('') + '</div>';
  if (e.view === 'review') return h + '</div>' + reviewView(queue);

  const [from, to, label] = expRange();
  const filtersOn = !!(e.cat || e.method || e.tag);
  h += '<div class="period">' + (e.period === 'custom' ? '<span></span>' : '<button class="arrow" type="button" data-act="expPrev" aria-label="Previous period">' + ICON.left + '</button>') +
    '<button class="label-btn" type="button" data-act="periodPicker">' + esc(label) + ICON.caret + '</button>' +
    (e.period === 'custom' ? '<span></span>' : '<button class="arrow" type="button" data-act="expNext" aria-label="Next period"' + (to >= t ? ' disabled' : '') + '>' + ICON.right + '</button>') + '</div>';
  h += '<div class="searchbar"><label class="search">' + ICON.search + '<input type="search" id="exp-q" placeholder="Search" value="' + esc(e.q) + '" data-input="expSearch" aria-label="Search entries"></label>' +
    '<button class="icon-btn' + (filtersOn || e.showFilters ? ' on' : '') + '" type="button" data-act="toggleFilters" aria-label="Filters" aria-expanded="' + e.showFilters + '">' + ICON.filter + (filtersOn ? '<span class="pip"></span>' : '') + '</button></div>';
  if (e.showFilters) {
    h += '<div class="card">' + field('Category', selectInput('fcat', [['', 'All categories']].concat(S.categories.map((c) => [c.id, c.name])), e.cat, 'data-change="expFilter" data-k="cat"')) +
      '<div class="field-row">' + field('Payment', selectInput('fmethod', [['', 'All']].concat(Object.entries(C.PAYMENT_METHODS)), e.method, 'data-change="expFilter" data-k="method"')) +
      field('Tag', selectInput('ftag', [['', 'All']].concat(C.TAGS.map((x) => [x, x[0].toUpperCase() + x.slice(1)])), e.tag, 'data-change="expFilter" data-k="tag"')) + '</div>' +
      (filtersOn ? '<button class="btn ghost" type="button" data-act="clearFilters">Clear filters</button>' : '') + '</div>';
  }
  h += '</div>';

  if (e.view === 'spending') {
    const txs = C.spendingTxs(S, from, to).filter(matchesFilters);
    const total = C.sum(txs.map(C.spendValue));
    const days = Math.max(1, C.diffDays(from, to < t ? to : t) + 1);
    h += '<div class="summary-line">' + (txs.length ? '<span class="big num">' + money(total) + '</span><span class="muted small">' + plural(txs.length, 'entry').replace('entrys', 'entries') +
      (e.period !== 'day' ? ' · ' + money(total / days) + '/day' : '') + '</span>' : '<span class="big empty">No data recorded</span>') + '</div>';
    h += txs.length ? groupedList(txs) : section('', group('<div class="empty"><h3>Nothing here yet</h3><span>Tap <b>+</b> to log an expense: amount, category, save.</span></div>'));
  } else {
    const txs = C.movementTxs(S, from, to).filter((x) => !e.q || matchesFilters(x));
    h += '<p class="footnote" style="padding:8px 4px 0">These change balances and debts, never your spending. <button class="link" type="button" data-act="info" data-k="movements">Why?</button></p>';
    h += txs.length ? groupedList(txs, { movements: true }) : section('', group('<div class="empty small">No account movements in this period.</div>'));
  }
  return h;
};
ACTIONS.expView = (d) => { ui.exp.view = d.v; render(); };
ACTIONS.periodPicker = () => {
  const e = ui.exp;
  openSheet('Show', '<div class="seg" role="group">' + [['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['custom', 'Custom']].map(([v, l]) =>
    '<button type="button" data-act="setPeriod" data-v="' + v + '" aria-pressed="' + (e.period === v) + '">' + l + '</button>').join('') + '</div>' +
    '<div class="field-row">' + field('From', '<input type="date" id="exp-from" data-change="expFrom" value="' + esc(e.from || C.monthStart(C.monthKey(today()))) + '">') +
    field('To', '<input type="date" id="exp-to" data-change="expTo" value="' + esc(e.to || today()) + '">') + '</div>' +
    '<p class="footnote" style="padding:0 2px">From and To apply to Custom.</p><button class="btn primary block" type="button" data-act="closeSheet">Done</button>');
};
ACTIONS.setPeriod = (d, el) => {
  ui.exp.period = d.v;
  $$('[data-act="setPeriod"]', el.closest('.sheet')).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === d.v)));
  render();
};
function shiftExp(dir) {
  const e = ui.exp;
  if (e.period === 'day') e.anchor = C.addDays(e.anchor, dir);
  else if (e.period === 'week') e.anchor = C.addDays(e.anchor, 7 * dir);
  else e.anchor = C.monthStart(C.addMonths(C.monthKey(e.anchor), dir));
  if (e.anchor > today()) e.anchor = today();
  render();
}
ACTIONS.expPrev = () => shiftExp(-1);
ACTIONS.expNext = () => shiftExp(1);
ACTIONS.toggleFilters = () => { ui.exp.showFilters = !ui.exp.showFilters; render(); };
ACTIONS.clearFilters = () => { Object.assign(ui.exp, { cat: '', method: '', tag: '', q: '' }); render(); };
CHANGES.expFrom = (el) => { ui.exp.from = el.value; ui.exp.period = 'custom'; render(); };
CHANGES.expTo = (el) => { ui.exp.to = el.value; ui.exp.period = 'custom'; render(); };
CHANGES.expFilter = (el) => { ui.exp[el.dataset.k] = el.value; render(); };
let searchTimer = null;
CHANGES.expSearch = (el) => {
  ui.exp.q = el.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('#exp-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } } }, 250);
};

function reviewView(queue) {
  if (!queue.length) return section('', group('<div class="empty"><h3>All clear</h3><span>Unclear withdrawals, possible duplicates, statement differences and due dates appear here.</span></div>'));
  return queue.map((it) => {
    const sevIc = it.severity === 'critical' ? 'bad' : it.severity === 'warn' ? 'warn' : 'neutral';
    let body = row(esc(it.title), '', { sub: esc(it.kind === 'reconcile' || it.kind === 'card_due' ? reviewShort(it) : it.detail), icon: ICON.flag, ic: sevIc });
    if (it.kind === 'reconcile') {
      body += '<div class="row"><span class="label small"><dl class="kv"><dt>Statement (' + fmtDate(it.statementDate) + ')</dt><dd>' + money(it.statementBalance) + '</dd><dt>Calculated by the app</dt><dd>' + money(it.calculated) + '</dd><dt>Difference</dt><dd>' + money(it.difference, { sign: true }) + '</dd></dl></span></div>';
      body += '<div class="row"><span class="label small muted">The statement balance is used from that date on. Your entries stay unchanged. A positive difference is often interest or fees not yet entered.</span></div>';
      body += '<div class="row btn-row">' + (it.difference > 0 ? '<button class="btn" data-act="recordDiff" data-st="' + it.statementId + '">Record ' + money(it.difference) + ' as interest</button>' : '') + '<button class="btn" data-act="ackStatement" data-st="' + it.statementId + '">Mark as checked</button></div>';
    } else if (it.kind === 'duplicate') {
      body += it.txIds.map((id) => { const x = C.txById(S, id); return x ? txRow(x, { showDate: true }) : ''; }).join('');
      body += '<div class="row btn-row"><button class="btn" data-act="dupKeep" data-a="' + it.txIds[0] + '" data-b="' + it.txIds[1] + '">Keep both</button><button class="btn danger" data-act="deleteTx" data-id="' + it.txIds[1] + '">Delete the second</button></div>';
    } else if (it.kind === 'categorize_withdrawal') {
      const x = C.txById(S, it.txIds[0]);
      body += txRow(x, { showDate: true });
      body += '<div class="row"><span class="label">' + selectInput('purpose-' + x.id, [['', 'Choose purpose…'], ['living', 'Living expenses'], ['emergency', 'Emergency'], ['other', 'Other']], '', 'data-change="setPurpose" data-id="' + x.id + '"') +
        '<span class="sub">Paid a card bill or a purchase? Delete it and use Pay card bill, or add an expense with "From flexi loan", so the link is recorded.</span></span></div>';
    } else if (it.kind === 'salary_missing') {
      body += '<div class="row btn-row"><button class="btn" data-act="addSalaryIncome" data-month="' + it.month + '">Add salary income</button><button class="btn" data-act="dismissReview" data-key="' + esc(it.key) + '">Dismiss</button></div>';
    } else if (it.kind === 'card_due') {
      body += '<div class="row btn-row"><button class="btn primary" data-act="payCard" data-id="' + it.accountId + '">Pay bill</button><button class="btn" data-act="dueReminder" data-id="' + it.accountId + '">Reminder</button></div>';
    } else if (it.kind === 'cooloff_done') {
      body += '<div class="row btn-row"><button class="btn primary" data-act="urgeDecide" data-id="' + it.gamingId + '">Decide</button></div>';
    } else if (it.txIds.length) {
      body += it.txIds.map((id) => { const x = C.txById(S, id); return x ? txRow(x, { showDate: true }) : ''; }).join('');
      if (it.kind === 'flagged') body += '<div class="row btn-row"><button class="btn" data-act="clearFlag" data-id="' + it.txIds[0] + '">Clear review flag</button></div>';
    }
    return section('', group(body, true));
  }).join('');
}

// ---------- Accounts ----------
VIEWS.accounts = function () {
  const t = today();
  const liabs = S.accounts.filter((a) => C.ACCOUNT_KINDS[a.kind].side === 'liability' && !a.archived);
  const owedKnown = liabs.map((a) => C.balanceAt(S, a.id, t)).filter((v) => v != null);
  const assets = accountsOf('bank', 'cash', 'savings');
  const assetVals = assets.map((a) => C.balanceAt(S, a.id, t));
  const cashKnown = assetVals.every((v) => v != null) && assets.length;
  let h = '<section class="hero"><span class="kicker">You owe</span><div class="big num">' + money(C.sum(owedKnown)) + '</div>' +
    '<div class="hero-meta"><span>Across loans and cards' + (owedKnown.length < liabs.length ? ' (some balances not set)' : '') + '</span>' +
    (cashKnown ? '<span>Cash & bank <b>' + money(C.sum(assetVals)) + '</b></span>' : '') + '</div></section>';

  const loans = [];
  const fx = flexiAcct();
  if (fx) { const i = C.balanceInfo(S, fx.id, t); loans.push(row(esc(fx.name), money(i.balance), { sub: STATUS_BADGE[i.status] + (fx.rate ? ' · ' + fx.rate + '%' : ''), icon: ICON.loan, act: 'go', data: { page: 'flexi' } })); }
  accountsOf('loan').forEach((ln) => { const i = C.balanceInfo(S, ln.id, t); loans.push(row(esc(ln.name), money(i.balance), { sub: STATUS_BADGE[i.status] + (ln.rate ? ' · ' + ln.rate + '%' : ''), icon: ICON.bank, ic: 'neutral', act: 'go', data: { page: 'loan', id: ln.id } })); });
  if (loans.length) h += section('Loans', group(loans.join(''), true));

  const cards = accountsOf('card').map((c) => {
    const s = C.cardSummary(S, c.id, t);
    const due = s.latest && s.remaining > 0 && s.daysToDue != null ? (s.daysToDue < 0 ? '<span class="badge bad">Overdue</span>' : '<span class="badge ' + (s.daysToDue <= 7 ? 'warn' : '') + '">Due ' + fmtDate(s.latest.dueDate) + '</span>') : (s.latest ? '<span class="badge good">Paid</span>' : 'No statement yet');
    return row(esc(c.name), money(s.balance), { sub: due, icon: ICON.card, ic: s.daysToDue != null && s.daysToDue <= 7 && s.remaining > 0 ? 'warn' : '', act: 'go', data: { page: 'card', id: c.id } });
  });
  cards.push(row('<span style="color:var(--link)">Add card</span>', '', { icon: ICON.plus, ic: 'neutral', act: 'addAccount', data: { kind: 'card' } }));
  h += section('Credit cards', group(cards.join(''), true), '<button class="link" data-act="info" data-k="cardCounting">How it counts</button>');

  const cash = assets.map((a, i) => row(esc(a.name), assetVals[i] == null ? '<span class="faint">Set balance</span>' : money(assetVals[i]),
    { sub: C.ACCOUNT_KINDS[a.kind].label, icon: a.kind === 'cash' ? ICON.cash : ICON.bank, ic: 'neutral', act: 'go', data: { page: 'cash' } }));
  cash.push(row('<span style="color:var(--link)">Add account</span>', '', { icon: ICON.plus, ic: 'neutral', act: 'addAccount' }));
  h += section('Cash & bank', group(cash.join(''), true));
  h += section('', group(infoRow('statuses')));
  return h;
};

PAGES.flexi = {
  title: () => (flexiAcct() || { name: 'Flexi loan' }).name,
  render: () => { const fx = flexiAcct(); return fx ? flexiPage(fx) : '<div class="empty">No flexi loan.</div>'; },
};
function flexiPage(fx) {
  const t = today(), mk = ui.month;
  const info = C.balanceInfo(S, fx.id, t);
  const series = C.flexiSeries(S, fx.id, C.addDays(t, -1), t);
  const daily = series.length ? series[series.length - 1].estInterest : null;
  const fm = C.flexiMonth(S, fx.id, mk, t);
  const hist = S.settings.history;
  let h = '<section class="hero"><span class="kicker">Utilized balance</span><div class="big num">' + money(info.balance) + '</div>' +
    '<div class="hero-meta"><span>' + STATUS_BADGE[info.status] + ' ' + esc(balanceSource(info)) + '</span></div></section>';
  h += quickActions([
    { label: 'Salary day', icon: ICON.salary, act: 'openMove', data: { kind: 'salary' }, primary: true },
    { label: 'Deposit', icon: ICON.down, act: 'openMove', data: { kind: 'deposit' } },
    { label: 'Withdraw', icon: ICON.up, act: 'openMove', data: { kind: 'withdraw' } },
    { label: 'Pay card', icon: ICON.card, act: 'openMove', data: { kind: 'paycard' } },
  ], [
    { label: 'Interest or fee charged', icon: ICON.percent, act: 'openMove', data: { kind: 'charge', acct: fx.id } },
    { label: 'Principal repayment', icon: ICON.check, act: 'openMove', data: { kind: 'principal', acct: fx.id } },
    { label: 'Add lender statement', icon: ICON.doc, act: 'openStatement', data: { acct: fx.id } },
    { label: 'Edit loan details', icon: ICON.pencil, act: 'editAccount', data: { id: fx.id } },
  ]);

  h += section('Month', group(
    row('Deposits', money(fm.deposits), { sub: fm.depositCount ? plural(fm.depositCount, 'deposit') + (fm.salaryDeposits ? ' · salary ' + money(fm.salaryDeposits) : '') : 'None recorded' }) +
    row('Withdrawals', money(fm.withdrawals), { sub: Object.entries(fm.byPurpose).map(([p, v]) => C.WITHDRAWAL_PURPOSES[p] + ' ' + money(v)).join(' · ') || 'None recorded' }) +
    row('Net principal change', money(-fm.netPrincipalChange, { sign: true }), { sub: 'Withdrawals − deposits − principal repaid' }) +
    row('Interest charged', fm.interestCharged ? money(fm.interestCharged) : '<span class="faint">Not entered</span>', { sub: 'From your lender statement' }) +
    row('Estimated interest', money(fm.estInterestMonth), { sub: mk === C.monthKey(t) ? money(fm.estInterestToDate) + ' so far, rest at today\'s balance' : 'Daily-balance estimate' }) +
    (fm.fees ? row('Fees charged', money(fm.fees)) : '') +
    row('Principal repaid', money(fm.principal), { sub: 'Only what the lender records as permanent' }) +
    row('Net balance change', fm.netBalanceChange != null ? money(fm.netBalanceChange, { sign: true }) : '—', { sub: fm.startBalance != null ? money(fm.startBalance) + ' → ' + money(fm.endBalance) : '' }) +
    row('Confirmed debt reduction', fm.confirmedReduction ? money(fm.confirmedReduction.amount) : '<span class="faint">Needs 2 statements</span>') +
    row('Interest saved by parking', '<span class="good">' + money(fm.estSavedToDate) + '</span>', { sub: 'Estimate' }) +
    infoRow('interestSaved')), monthPill());

  h += section('Loan', group(
    row('Original loan', fx.original != null ? money(fx.original) : '—', { sub: 'Reported' }) +
    (hist.flexiPrincipalReductionReported != null ? row('Principal reduced so far', money(hist.flexiPrincipalReductionReported), { sub: esc(hist.flexiReductionNote || 'As last reported') + ' · approx.' }) : '') +
    row('Interest rate', fx.rate + '% a year', { sub: 'Approx. · ' + (fx.dayCount || 365) + '-day year, daily balance' }) +
    row('Daily interest', daily != null ? money(daily, { dp: 2 }) : '—', { sub: 'Estimate' }) +
    row('Remaining tenure', '<span class="small">' + esc(fx.reportedTenure || 'Not set') + '</span>')));

  const anchors = C.anchorsFor(S, fx.id);
  if (anchors.length) {
    const start = anchors[0].date;
    const full = C.flexiSeries(S, fx.id, C.addDays(t, -179) > start ? C.addDays(t, -179) : start, t);
    h += section('Balance over time', '<div class="card chart-wrap">' + lineChart(full.map((p) => ({ x: p.date, y: p.balance, note: p.confirmed ? 'Confirmed' : (p.parked ? 'Parked deposits ' + money(p.parked) : '') })), { aria: 'Utilized balance by day' }) +
      '<span class="chart-caption">Deposits pull it down; withdrawals push it up.</span></div>');
  }
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(C.addMonths(C.monthKey(t), -i));
  const rows = months.map((m) => ({ m, fm: C.flexiMonth(S, fx.id, m, t) })).filter((r) => r.fm.series.length || r.fm.hasData);
  if (rows.length) {
    h += section('Monthly interest', '<div class="card chart-wrap">' +
      barChart(rows.map((r) => ({ label: fmtMonthShort(r.m), value: r.fm.interestCharged || r.fm.estInterestMonth, cls: r.fm.interestCharged ? '' : 'muted',
        tip: fmtMonth(r.m) + '\nEstimated ' + money(r.fm.estInterestMonth) + '\nCharged ' + (r.fm.interestCharged ? money(r.fm.interestCharged) : 'not entered') })), { aria: 'Monthly interest', h: 130 }) +
      '<div class="legend"><span><i style="background:var(--series)"></i>Charged</span><span><i style="background:var(--series-muted)"></i>Estimated</span></div></div>');
  }
  h += payoffSection(fx, info, t);
  const recs = C.reconcile(S, fx.id);
  h += section('Statements', group(recs.length ? recs.slice().reverse().map((r) => statementRow(r)).join('') :
    '<div class="empty small">Add your lender statement each month. Its balance becomes the confirmed figure, and any difference from the app is flagged.</div>'),
    '<button class="link" data-act="openStatement" data-acct="' + fx.id + '">Add</button>');
  const txs = S.transactions.filter((x) => C.effectOn(S, x, fx.id) !== 0).sort(C.txSort).reverse();
  h += section('History', txs.length ? group(txs.slice(0, 60).map((x) => txRow(x, { showDate: true, balance: C.balanceAt(S, fx.id, x.date) })).join(''), true) +
    (txs.length > 60 ? '<p class="footnote">Showing the latest 60. Export CSV for the full history.</p>' : '') : group('<div class="empty small">No movements yet.</div>'));
  return h;
}
function balanceSource(info) {
  if (info.status === 'unknown') return 'No starting balance set';
  const an = info.anchor;
  if (info.status === 'calculated') return (an.kind === 'statement' ? 'Statement of ' + fmtDate(an.date) : an.source) + ' plus your entries';
  return an.kind === 'statement' ? 'Lender statement of ' + fmtDate(an.date) : an.source;
}
function statementRow(r) {
  const st = r.statement;
  const diff = r.difference;
  const v = diff == null ? '' : Math.abs(diff) < 1 ? badge('Matches', 'good') : (st.acknowledged ? badge('Checked') : badge('Differs ' + money(diff, { sign: true }), 'warn'));
  return '<div class="row has-ic"><span class="ic neutral">' + ICON.doc + '</span><span class="label">' + fmtDate(st.date, true) + '<span class="sub">Closing ' + money(st.closingBalance) + (st.interestCharged ? ' · interest ' + money(st.interestCharged) : '') +
    (r.calculated != null ? ' · app ' + money(r.calculated) : ' · first statement') + '</span>' + (v ? '<span class="meta">' + v + '</span>' : '') + '</span>' +
    '<button class="btn ghost" data-act="deleteStatement" data-id="' + st.id + '" aria-label="Delete statement">Delete</button></div>';
}

function payoffSection(fx, info, t) {
  const bal = info.balance;
  if (bal == null) return section('Payoff', group('<div class="empty small">Set the utilized balance with <b>More → Edit loan details</b> to see a payoff projection.</div>'));
  const plan = C.payoffPlan(bal, fx.rate, fx.plannedMonthlyPrincipal, C.monthKey(t));
  const pattern = C.recordedPattern(S, fx.id, t);
  const req = fx.targetPayoffDate ? C.requiredPrincipal(bal, fx.targetPayoffDate, t) : null;
  let body = '<form data-form="payoff" class="card">' +
    '<div class="field-row">' + field('Principal cut per month', moneyInput('planned', fx.plannedMonthlyPrincipal || ''), esc(fx.plannedNote || 'Not guaranteed.')) +
    field('Target payoff date', '<input type="date" name="target" value="' + esc(fx.targetPayoffDate || '') + '">', 'Optional') + '</div>';
  if (plan) {
    body += '<dl class="kv"><dt>Months to clear</dt><dd>' + plan.months + '</dd>' +
      '<dt>Estimated payoff</dt><dd>' + fmtMonth(plan.payoffMonth) + '</dd>' +
      '<dt>First month: interest + principal</dt><dd>' + money(plan.firstInterest) + ' + ' + money(fx.plannedMonthlyPrincipal) + '</dd>' +
      '<dt>Total interest from today</dt><dd>' + money(plan.totalInterest) + '</dd></dl>';
  }
  if (req) body += '<div class="note info">To finish by ' + fmtDate(fx.targetPayoffDate, true) + ', cut about <b>' + money(req.perMonth) + '/month</b> of principal for ' + plural(req.months, 'month') + ', plus interest.</div>';
  if (pattern && pattern.average != null) {
    const m = pattern.average > 0 ? Math.ceil(bal / pattern.average) : null;
    body += '<div class="note">' + (pattern.average > 0
      ? '<span><b>Your recorded pattern:</b> the balance fell ' + money(pattern.average) + '/month on average over ' + plural(pattern.months.length, 'completed month') + ', which means payoff around ' + fmtMonth(C.addMonths(C.monthKey(t), m)) + '.</span>'
      : '<span><b>Your recorded pattern:</b> over ' + plural(pattern.months.length, 'completed month') + ' the balance did not fall on average (' + money(-pattern.average, { sign: true }) + '/month).</span>') +
      '<span>Enter interest from statements so this reflects the real balance.</span></div>';
  } else body += '<p class="footnote" style="padding:0">A projection from your actual pattern appears after one full month of records.</p>';
  return section('Payoff', body + '<button class="btn" type="submit">Update projection</button></form>');
}
FORMS.payoff = (form) => {

  fx.plannedMonthlyPrincipal = p || 0;

};

PAGES.cash = { title: () => 'Cash & bank', render: () => cashPage(today(), ui.month) };
function cashPage(t, mk) {
  const assets = accountsOf('bank', 'cash', 'savings');
  let unknown = 0, sumAssets = 0;
  const rows = assets.map((a) => {
    const info = C.balanceInfo(S, a.id, t);
    if (info.balance == null) unknown++; else sumAssets += info.balance;
    return row(esc(a.name), info.balance == null ? '<span style="color:var(--link)">Set balance</span>' : money(info.balance),
      { sub: info.balance != null ? STATUS_BADGE[info.status] + ' ' + esc(balanceSource(info)) : C.ACCOUNT_KINDS[a.kind].label, icon: a.kind === 'cash' ? ICON.cash : ICON.bank, ic: 'neutral', act: 'editAccount', data: { id: a.id } });
  }).join('');
  const ms = C.monthStart(mk), me = C.monthEnd(mk);
  const flow = C.sum(S.transactions.filter((x) => x.date >= ms && x.date <= me).map((x) => assets.reduce((s, a) => s + C.effectOn(S, x, a.id), 0)));
  let h = section('Accounts', group(rows + row('<span style="color:var(--link)">Add account</span>', '', { icon: ICON.plus, ic: 'neutral', act: 'addAccount' }), true));
  let o = row('Net cash flow', money(flow, { sign: true }), { sub: fmtMonth(mk) + ' · change in bank, cash and savings' });
  const target = S.settings.emergencyCashTarget;
  if (target) o += row('Emergency cash target', unknown ? '<span class="faint">Set balances</span>' : (sumAssets >= target ? badge('Met', 'good') : badge(money(target - sumAssets) + ' short', 'warn')), { sub: 'Target ' + money(target) });
  const liab = S.accounts.filter((a) => C.ACCOUNT_KINDS[a.kind].side === 'liability' && !a.archived).map((a) => C.balanceAt(S, a.id, t));
  o += unknown || liab.some((v) => v == null)
    ? row('Net financial position', '<span class="faint">Needs all balances</span>', { sub: 'Set every balance to see assets minus debts' })
    : row('Net financial position', money(sumAssets - C.sum(liab)), { sub: 'Assets ' + money(sumAssets) + ' − debts ' + money(C.sum(liab)) });
  h += section('Overview', group(o), monthPill());
  if (S.settings.history.liquidSavingsReported === 0 && unknown) h += '<p class="footnote">Liquid savings were last reported as ₹0. That is an old figure: set today\'s balances above.</p>';
  return h;
}

PAGES.moneyflow = { title: () => 'Money flow', kick: () => fmtMonth(ui.month), render: () => moneyFlowPage() };
function moneyFlowPage() {
  const mk = ui.month, tot = C.monthTotals(S, mk, today());
  return '<div style="display:flex;justify-content:flex-end">' + monthPill() + '</div>' +
    section('Spending', group(row('Actual spending', tot.hasSpendingData ? money(tot.spending) : '<span class="faint">No data</span>', { sub: 'Purchases and services, net of refunds', icon: ICON.activity }) +
      row('Credit-card purchases', money(tot.cardPurchases), { sub: 'Already part of spending', icon: ICON.card, ic: 'neutral' }), true)) +
    section('Income', group(row('Income received', money(tot.income), { icon: ICON.down, ic: 'good' }), true)) +
    section('Flexi loan', group(row('Deposits', money(tot.flexiDeposits), { sub: 'Lower the balance while they stay', icon: ICON.down, ic: 'neutral' }) +
      row('Withdrawals', money(tot.flexiWithdrawals), { sub: 'Borrowing again; not spending', icon: ICON.up, ic: 'neutral' }) +
      row('Interest saved', money(tot.estInterestSaved), { sub: 'Estimate, from parked deposits', icon: ICON.percent, ic: 'good' }), true)) +
    section('Cards & debt', group(row('Card payments', money(tot.cardPayments), { sub: 'Settle the card; not new spending', icon: ICON.check, ic: 'neutral' }) +
      row('Interest & fees', money(tot.interest + tot.fees), { sub: 'From statements you entered', icon: ICON.percent, ic: 'neutral' }) +
      row('Confirmed debt reduction', tot.confirmedDebtReduction != null ? money(tot.confirmedDebtReduction) : '<span class="faint">Needs statements</span>', { sub: 'Between two confirmed balances', icon: ICON.loan, ic: 'neutral' }), true)) +
    '<p class="footnote">These eight totals never feed into each other, so nothing is counted twice.</p>';
}

// ---------- Insights ----------
PAGES.insights = { title: () => 'Insights', kick: () => fmtMonth(ui.month), render: () => insightsPage() };
function insightsPage() {
  const t = today(), mk = ui.month;
  const ms = C.monthStart(mk), me = C.monthEnd(mk);
  const end = mk === C.monthKey(t) ? t : me;
  let h = '<div style="display:flex;justify-content:flex-end">' + monthPill() + '</div>';
  const days = C.dailySpending(S, ms, end);
  const b = C.budgetStatus(S, mk, t);
  const hasData = days.some((d) => d.count);
  h += section('Daily spending', '<div class="card chart-wrap">' + (hasData
    ? barChart(days.map((d) => ({ label: String(Number(d.date.slice(8))), value: d.count ? d.amount : null, tip: fmtDate(d.date) + '\n' + (d.count ? money(d.amount) + ' · ' + plural(d.count, 'entry').replace('entrys', 'entries') : 'No entries') })),
      { ref: b.budget / C.daysInMonth(mk), refLabel: 'Even pace ' + money(b.budget / C.daysInMonth(mk)) + '/day', labelEvery: 5, aria: 'Daily spending' })
    : '<div class="empty small">No data recorded for ' + fmtMonth(mk) + '.</div>') + '</div>');
  const trend = C.monthlyTrend(S, mk, 6);
  h += section('Monthly spending', '<div class="card chart-wrap">' +
    barChart(trend.map((m) => ({ label: fmtMonthShort(m.month), value: m.spending, cls: m.spending > S.settings.budget.amount ? 'over' : '', tip: fmtMonth(m.month) + '\n' + (m.hasData ? money(m.spending) : 'No data recorded') })),
      { ref: S.settings.budget.amount, refLabel: 'Budget ' + money(S.settings.budget.amount), showNoData: true, aria: 'Spending by month' }) +
    '<span class="chart-caption">Months without entries show "No data", not ₹0.</span></div>');
  const cats = C.byCategory(S, ms, me);
  const planned = S.categories.filter((c) => c.plan);
  const items = cats.map((c) => ({ name: c.name, value: c.amount, plan: (C.cat(S, c.id) || {}).plan || 0 }));
  planned.forEach((c) => { if (!items.some((i) => i.name === c.name)) items.push({ name: c.name, value: 0, plan: c.plan }); });
  h += section('By category', group(cats.length ? hbars(items, { legend: planned.length > 0 }) : '<div class="empty small">No data recorded for ' + fmtMonth(mk) + '.</div>'));
  if (planned.length) {
    const rowsP = planned.map((c) => { const a = cats.find((x) => x.id === c.id); return [c.name, c.plan, a ? a.amount : 0]; });
    const tp = C.sum(rowsP.map((r) => r[1])), ta = C.sum(rowsP.map((r) => r[2]));
    h += section('Plan vs actual', group('<div class="table-wrap"><table class="data"><thead><tr><th>Category</th><th>Plan</th><th>Actual</th><th>Diff</th></tr></thead><tbody>' +
      rowsP.map((r) => '<tr><td>' + esc(r[0]) + '</td><td>' + money(r[1]) + '</td><td>' + (hasData ? money(r[2]) : '—') + '</td><td class="' + (r[2] > r[1] ? 'warn' : '') + '">' + (hasData ? money(r[2] - r[1], { sign: true }) : '—') + '</td></tr>').join('') +
      '<tr class="total"><td>Total</td><td>' + money(tp) + '</td><td>' + (hasData ? money(ta) : '—') + '</td><td>' + (hasData ? money(ta - tp, { sign: true }) : '—') + '</td></tr></tbody></table></div>') +
      '<p class="footnote">Plans are the monthly amounts you reported. Edit them in Settings → Categories.</p>');
  }
  const pmk = C.addMonths(mk, -1);
  const prevCats = C.byCategory(S, C.monthStart(pmk), C.monthEnd(pmk));
  const prevHas = C.spendingTxs(S, C.monthStart(pmk), C.monthEnd(pmk)).length > 0;
  if (hasData || prevHas) {
    const ids = [...new Set(cats.map((c) => c.id).concat(prevCats.map((c) => c.id)))];
    h += section('Compared with ' + fmtMonthShort(pmk), group('<div class="table-wrap"><table class="data"><thead><tr><th>Category</th><th>' + fmtMonthShort(pmk) + '</th><th>' + fmtMonthShort(mk) + '</th><th>Change</th></tr></thead><tbody>' +
      ids.map((id) => { const a = (prevCats.find((c) => c.id === id) || {}).amount || 0, b2 = (cats.find((c) => c.id === id) || {}).amount || 0;
        return '<tr><td>' + esc(catName(id)) + '</td><td>' + (prevHas ? money(a) : 'No data') + '</td><td>' + (hasData ? money(b2) : 'No data') + '</td><td>' + (prevHas && hasData ? money(b2 - a, { sign: true }) : '—') + '</td></tr>'; }).join('') +
      '</tbody></table></div>'));
  }
  const st = C.spendingTxs(S, ms, me);
  const rec = C.sum(st.filter((x) => x.recurring).map(C.spendValue)), one = C.sum(st.filter((x) => !x.recurring).map(C.spendValue));
  h += section('Recurring & cards', group(
    row('Recurring', hasData ? money(rec) : '—', { sub: 'Entries marked recurring' }) +
    row('One-time', hasData ? money(one) : '—') +
    accountsOf('card').map((c) => row(esc(c.name), money(C.sum(st.filter((x) => x.type === 'cc_purchase' && x.from === c.id).map((x) => x.amount))), { sub: 'Card purchases' })).join('')));
  const gs = C.gamingStats(S, mk);
  const gm = []; for (let i = 5; i >= 0; i--) gm.push(C.addMonths(mk, -i));
  h += section('Gaming purchases', '<div class="card chart-wrap">' + (gs.lifetimeCount
    ? barChart(gm.map((m) => ({ label: fmtMonthShort(m), value: gs.byMonth[m] != null ? gs.byMonth[m] : (C.spendingTxs(S, C.monthStart(m), C.monthEnd(m)).length ? 0 : null), tip: fmtMonth(m) + '\n' + (gs.byMonth[m] != null ? money(gs.byMonth[m]) : 'None recorded') })), { aria: 'Gaming purchases by month', h: 120, showNoData: true })
    : '<div class="empty small">No gaming purchases recorded. Target: ' + money(S.settings.fcMonthlyTarget || 0) + '/month.</div>') + '</div>');
  const sm = []; for (let i = 5; i >= 0; i--) sm.push(C.addMonths(mk, -i));
  h += section('Surplus or deficit', group('<div class="table-wrap"><table class="data"><thead><tr><th>Month</th><th>Income</th><th>Spent</th><th>Interest</th><th>Surplus</th></tr></thead><tbody>' +
    sm.map((m) => { const tt = C.monthTotals(S, m, t); const any = tt.hasSpendingData || tt.income || tt.interest || tt.fees;
      if (!any) return '<tr><td>' + fmtMonthShort(m) + '</td><td colspan="4" class="faint" style="text-align:right">No data recorded</td></tr>';
      const sur = tt.income - tt.spending - tt.interest - tt.fees;
      return '<tr><td>' + fmtMonthShort(m) + '</td><td>' + money(tt.income) + '</td><td>' + (tt.hasSpendingData ? money(tt.spending) : 'No data') + '</td><td>' + money(tt.interest + tt.fees) + '</td><td class="' + (sur < 0 ? 'bad' : 'good') + '">' + money(sur, { sign: true }) + '</td></tr>'; }).join('') +
    '</tbody></table></div>') + '<p class="footnote">Income minus spending minus loan interest and fees. Deposits, withdrawals, card payments and transfers only move money, so they are left out.</p>');
  return h;
}

// ---------- Goals ----------
VIEWS.goals = function () {
  const t = today();
  let h = '';
  S.goals.forEach((g) => { h += goalSection(g, t); });
  if (!S.goals.length) h += section('', group('<div class="empty"><h3>No goals yet</h3><span>Save toward something you want instead of spending on impulse.</span></div>'));
  h += section('', group(row('<span style="color:var(--link)">Add a goal</span>', '', { icon: ICON.plus, ic: 'neutral', act: 'addGoal' }), true));
  h += gamingSection(t);
  return h;
};

function goalSection(g, t) {
  const p = C.goalProgress(S, g, t);
  let h = '<section class="hero" style="margin-top:4px"><span class="kicker">' + esc(g.name) + '</span><div class="big mid num">' + money(p.total) + '</div>' +
    '<div class="stack-bar">' + (p.saved > 0 ? '<div class="saved" style="width:' + (p.saved / g.target * 100).toFixed(1) + '%"></div>' : '') + (p.earmarked > 0 ? '<div class="earm" style="width:' + (p.earmarked / g.target * 100).toFixed(1) + '%"></div>' : '') + '</div>' +
    '<div class="hero-meta"><span>' + pct(p.pct) + ' of <b>' + money(g.target) + '</b>' + (g.targetStatus === 'illustrative' ? ' <span class="badge">Illustrative</span>' : '') + '</span><span>' + (p.eta ? 'About ' + fmtMonth(p.eta) : '') + '</span></div>' +
    '<div class="legend"><span><i style="background:var(--accent)"></i>Saved ' + money(p.saved) + '</span><span><i style="background:color-mix(in srgb,var(--accent) 38%,transparent)"></i>Earmarked ' + money(p.earmarked) + '</span></div></section>';
  h += quickActions([
    { label: 'Earmark', icon: ICON.plus, act: 'goalEntry', data: { goal: g.id, kind: 'earmark' }, primary: true },
    g.accountId ? { label: 'Move to savings', icon: ICON.down, act: 'goalTransfer', data: { goal: g.id, dir: 'in' } } : { label: 'Savings account', icon: ICON.bank, act: 'goalSetupAccount', data: { goal: g.id } },
    { label: 'Edit', icon: ICON.pencil, act: 'editGoal', data: { goal: g.id } },
  ], [
    { label: 'Release an earmark', icon: ICON.refund, act: 'goalEntry', data: { goal: g.id, kind: 'release' } },
  ].concat(g.accountId ? [{ label: 'Take money out of savings', icon: ICON.up, act: 'goalTransfer', data: { goal: g.id, dir: 'out' } }] : []));
  h += section('', group(
    row('Remaining', money(p.remaining)) +
    row('Monthly contribution', g.monthlyContribution ? money(g.monthlyContribution) : '<span class="faint">Not set</span>', { sub: p.months ? plural(p.months, 'month') + ' to go at this rate' : 'Set one in Edit to see a date' })) +
    '<p class="footnote"><b>Earmarked</b> money is a label and stays where it is; <b>saved</b> money has moved to a separate account. Neither counts as spending. Buy from saved money, not a new loan or card debt you cannot clear.</p>');
  const hist = (g.entries || []).map((e) => ({ date: e.date, html: row((e.kind === 'release' ? 'Released' : 'Earmarked') + (e.note ? ' · ' + esc(e.note) : ''), (e.kind === 'release' ? '−' : '+') + money(e.amount), { sub: fmtDate(e.date, true) + ' · label only', icon: e.kind === 'release' ? ICON.refund : ICON.plus, ic: 'neutral' }) }))
    .concat(p.transfers.map((x) => ({ date: x.date, html: txRow(x, { showDate: true }) })))
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  if (hist.length) h += section('History', group(hist.map((x) => x.html).join(''), true));
  return h;
}

function gamingSection(t) {
  const mk = C.monthKey(t);
  const gs = C.gamingStats(S, mk);
  const target = S.settings.fcMonthlyTarget || 0;
  const hist = S.settings.history;
  const fx = flexiAcct();
  const active = (S.gamingLog || []).filter((g) => g.kind === 'urge' && g.coolOffUntil && !g.outcome);
  let h = '<div class="section"><section class="hero"><span class="kicker">' + esc(gameLabel()) + ' this month</span><div class="big mid num">' + money(gs.monthNet) + '</div>' +
    '<div class="hero-meta"><span>Target ' + money(target) + ' ' + (gs.monthNet <= target ? badge('On target', 'good') : badge(money(gs.monthNet - target) + ' above', 'warn')) + '</span><span>' + plural(gs.urgesMonth, 'urge') + ' logged</span></div></section>';
  h += quickActions([
    { label: 'I want to buy', icon: ICON.timer, act: 'urgeStart', primary: true },
    { label: 'Attempt', icon: ICON.flag, act: 'logAttempt' },
    { label: 'Purchase', icon: ICON.plus, act: 'logGamingPurchase' },
    { label: 'Refund', icon: ICON.refund, act: 'logGamingRefund' },
  ]) + '</div>';
  if (active.length) {
    h += section('Cooling off', group(active.map((g) => {
      const ms = new Date(g.coolOffUntil) - new Date();
      const left = ms > 0 ? Math.floor(ms / 36e5) + 'h ' + Math.floor((ms % 36e5) / 6e4) + 'm' : 'Done';
      return row(esc(g.item || 'Purchase'), '<span class="timer">' + left + '</span>', { sub: (g.amount ? money(g.amount) + ' · ' : '') + 'started ' + fmtDate(g.date), icon: ICON.timer, ic: ms > 0 ? '' : 'warn', act: 'urgeDecide', data: { id: g.id } });
    }).join(''), true));
  }
  const interestEq = fx ? gs.lifetimeNet * (fx.rate / 100) : null;
  h += section('Record', group(
    row('Recorded in the app', money(gs.lifetimeNet), { sub: plural(gs.lifetimeCount, 'purchase') + ' · ' + gs.waitedPurchases + ' after waiting' }) +
    row('Urges skipped', String(gs.resisted), { sub: gs.resistedAmount ? money(gs.resistedAmount) + ' not spent' : '' }) +
    row('Attempts logged', String(gs.attempts), { sub: 'Started but not completed' }) +
    (gs.lifetimeNet > 0 ? row('If these had not happened', money(gs.lifetimeNet), { sub: 'Hypothetical' + (interestEq ? ' · ≈ ' + money(interestEq) + ' a year of flexi interest' : '') }) : '')));
  if (hist.fcEstimateLow != null) h += section('', '<details class="card"><summary class="small"><b>Reported history</b> <span class="faint">· approximate, not in totals</span></summary><dl class="kv small">' +
    '<dt>Earlier total spent</dt><dd>' + money(hist.fcEstimateLow) + '–' + money(hist.fcEstimateHigh) + '</dd>' +
    '<dt>Recent episode</dt><dd>' + money(hist.fcRecentEpisode.total) + '</dd>' +
    '<dt>Planned for that episode</dt><dd>' + esc(hist.fcRecentEpisode.intended) + '</dd></dl>' +
    '<span class="small muted">What you reported earlier. Kept out of every total. If the ' + money(hist.fcRecentEpisode.total) + ' episode falls in a month you track, log the actual purchases with their dates.</span></details>');
  const log = (S.gamingLog || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 12);
  if (log.length) {
    h += section('Urges & attempts', group(log.map((g) => row(
      (g.kind === 'attempt' ? 'Attempt' : 'Urge') + (g.item ? ': ' + esc(g.item) : ''),
      g.amount ? money(g.amount) : '',
      { sub: fmtDate(g.date) + (g.trigger ? ' · ' + C.GAMING_TRIGGERS[g.trigger] : '') + (g.outcome ? ' · ' + ({ resisted: 'Skipped', purchased: 'Bought', pending: 'Waiting' }[g.outcome] || g.outcome) : g.coolOffUntil ? ' · cooling off' : ''),
        icon: g.kind === 'attempt' ? ICON.flag : ICON.timer, ic: g.outcome === 'resisted' ? 'good' : 'neutral', act: 'urgeDecide', data: { id: g.id } })).join(''), true));
  }
  return h;
}

// ---------- entry sheets, forms and actions ----------

const assetOptions = () => accountsOf('bank', 'cash', 'savings').map((a) => [a.id, a.name]);
const bankOptions = () => accountsOf('bank', 'savings').map((a) => [a.id, a.name]);
const cardOptions = () => accountsOf('card').map((a) => [a.id, a.name]);
const liabilityOptions = () => S.accounts.filter((a) => C.ACCOUNT_KINDS[a.kind].side === 'liability' && !a.archived).map((a) => [a.id, a.name]);
const firstOf = (kind) => (accountsOf(kind)[0] || {}).id || '';

function categoryOrder() {
  const counts = {};
  S.transactions.slice(-300).forEach((x) => { if (x.categoryId) counts[x.categoryId] = (counts[x.categoryId] || 0) + 1; });
  return S.categories.filter((c) => !c.system && !c.hidden).slice().sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
}
function dateQuick(name, value) {
  const t = today();
  return '<div class="field"><span>Date</span><div style="display:flex;gap:8px;align-items:center">' +
    '<div class="chips" style="flex:none"><button type="button" class="chip-btn" data-act="setDate" data-name="' + name + '" data-v="' + t + '">Today</button>' +
    '<button type="button" class="chip-btn" data-act="setDate" data-name="' + name + '" data-v="' + C.addDays(t, -1) + '">Yesterday</button></div>' +
    '<div style="flex:1;min-width:0">' + dateInput(name, value) + '</div></div></div>';
}
ACTIONS.setDate = (d, el) => { const f = el.closest('form'); f.elements[d.name].value = d.v; };

// ---------- quick entry (expense / income / refund / move money) ----------
ACTIONS.quickAdd = (d) => openEntry({ mode: 'expense', prefill: d.card ? { method: 'credit_card', card: d.card } : {} });
ACTIONS.entryMode = (d) => { closeSheet(); if (d.mode === 'move') openMoveMenu(); else openEntry({ mode: d.mode }); };

function modeTabs(mode) {
  return '<div class="seg" role="group" aria-label="Entry type">' + [['expense', 'Expense'], ['income', 'Income'], ['refund', 'Refund'], ['move', 'Move money']].map(([v, l]) =>
    '<button type="button" data-act="entryMode" data-mode="' + v + '" aria-pressed="' + (mode === v) + '">' + l + '</button>').join('') + '</div>';
}

function openEntry({ mode, tx, prefill }) {
  prefill = prefill || {};
  if (mode === 'income') return openSheet(tx ? 'Edit income' : 'Add', (tx ? '' : modeTabs('income')) + incomeForm(tx, prefill));
  if (mode === 'refund') return openSheet(tx ? 'Edit refund' : 'Add', (tx ? '' : modeTabs('refund')) + refundForm(tx, prefill));
  return openSheet(tx ? 'Edit expense' : 'Add', (tx ? '' : modeTabs('expense')) + expenseForm(tx, prefill));
}

function expenseForm(tx, p) {
  const v = tx || {};
  const method = tx ? (tx.type === 'cc_purchase' ? 'credit_card' : tx.method || (C.kindOf(S, tx.from) === 'cash' ? 'cash' : 'upi')) : (p.method || S.settings.lastMethod || 'upi');
  const funded = tx && tx.linkRole === 'funded';
  const catId = v.categoryId || p.categoryId || '';
  const cats = categoryOrder();
  const cards = cardOptions();
  const subs = (C.cat(S, catId) || {}).subcategories || [];
  const show = (m) => (m.split(' ').includes(method) ? '' : ' hidden');
  return '<form data-form="expense" data-id="' + (v.id || '') + '">' +
    amountField('amount', v.amount != null ? v.amount : p.amount) +
    '<div class="field"><span>Category</span>' + chipRadio('categoryId', cats.map((c) => [c.id, c.name]).concat(catId === 'uncategorized' ? [['uncategorized', 'Needs categorization']] : []), catId) + '</div>' +
    '<div class="field" data-change="methodToggle"><span>Paid with</span>' + (funded
      ? '<div class="note small">Paid directly from the flexi loan, with a linked withdrawal. To change how it was paid, delete it and add it again.</div><input type="hidden" name="method" value="flexi">'
      : chipRadio('method', Object.entries(C.PAYMENT_METHODS).filter(([k]) => k !== 'bank_transfer'), method)) + '</div>' +
    '<div data-show="credit_card"' + show('credit_card') + '>' + (cards.length ? field('Card', selectInput('card', cards, v.from || p.card || cards[0][0])) : '<div class="note warn">Add your card under <b>Cards</b> first.</div>') + '</div>' +
    '<div data-show="upi debit"' + show('upi debit') + '>' + field('From account', selectInput('bankAcct', bankOptions(), (C.kindOf(S, v.from) !== 'cash' && v.from) || firstOf('bank'))) + '</div>' +
    '<div data-show="flexi"' + show('flexi') + '><div class="note small">Records a flexi-loan withdrawal linked to this purchase. The purchase counts as spending once; the withdrawal is shown as borrowing.</div></div>' +
    dateQuick('date', v.date || p.date) +
    field('Description', '<input name="description" id="f-description" value="' + esc(v.description || p.description || '') + '" placeholder="Optional, e.g. Eggs, 30 pcs" autocomplete="off">') +
    '<details class="more"' + (v.notes || v.subcategory || (v.tags && v.tags.length) || v.time ? ' open' : '') + '><summary>More details</summary><div>' +
    '<div class="field-row">' + field('Time', '<input type="time" name="time" value="' + esc(v.time || '') + '">') +
    field('Subcategory', '<input name="subcategory" list="subcats" value="' + esc(v.subcategory || '') + '" autocomplete="off"><datalist id="subcats">' + subs.map((s) => '<option value="' + esc(s) + '">').join('') + '</datalist>') + '</div>' +
    '<div class="field"><span>Tags</span>' + chipCheck('tags', C.TAGS.map((tg) => [tg, tg[0].toUpperCase() + tg.slice(1)]), v.tags || []) + '</div>' +
    '<label class="check"><input type="checkbox" name="recurring"' + (v.recurring ? ' checked' : '') + '><span>Recurring expense</span></label>' +
    field('Notes', '<textarea name="notes">' + esc(v.notes || '') + '</textarea>') +
    '<label class="check"><input type="checkbox" name="needsReview"' + (v.needsReview ? ' checked' : '') + '><span>Flag for review later</span></label>' +
    '</div></details>' + errorsBox() + '<div class="dup-warn"></div>' +
    '<div class="sticky-actions">' + (tx ? '' : '<button class="btn" type="submit" value="again">Add another</button>') + '<button class="btn primary" type="submit" value="save">Save</button></div></form>';
}
CHANGES.methodToggle = (el) => {
  const form = el.closest('form');
  const m = (form.querySelector('input[name="method"]:checked') || {}).value;
  $$('[data-show]', form).forEach((d) => { d.hidden = !d.dataset.show.split(' ').includes(m); });
};

function dupWarning(form, similar) {
  form.querySelector('.dup-warn').innerHTML = '<div class="note warn"><b>This looks like an entry you already have.</b>' +
    similar.slice(0, 2).map((x) => esc(fmtDate(x.date) + ' · ' + money(x.amount) + ' · ' + (x.description || (x.categoryId ? catName(x.categoryId) : C.TX_TYPES[x.type].label)))).join('<br>') +
    '<span>Save it anyway if both are real.</span><button class="btn" type="button" data-act="forceSave">Save anyway</button></div>';
  form.querySelector('.dup-warn').scrollIntoView({ block: 'nearest' });
}
ACTIONS.forceSave = (d, el) => { const f = el.closest('form'); f.dataset.force = '1'; f.requestSubmit(f.querySelector('button[value="save"]') || undefined); };

FORMS.expense = (form, submitter) => {
  const id = form.dataset.id;
  const old = id ? C.txById(S, id) : null;
  const methodEl = form.querySelector('input[name="method"]:checked') || form.elements.method;
  const method = methodEl ? methodEl.value : '';
  const catEl = form.querySelector('input[name="categoryId"]:checked');
  const base = {
    amount: famount(form, 'amount'), date: fval(form, 'date'), time: fval(form, 'time'),
    categoryId: catEl ? catEl.value : '', subcategory: fval(form, 'subcategory'), description: fval(form, 'description'),
    recurring: fchecked(form, 'recurring'), tags: fall(form, 'tags'), notes: fval(form, 'notes'), needsReview: fchecked(form, 'needsReview'), method,
  };
  if (!method) return showErrors(form, ['Choose how you paid.']);
  if (method === 'credit_card') { base.type = 'cc_purchase'; base.from = fval(form, 'card'); if (!base.from) return showErrors(form, ['Add the card under Cards first.']); }
  else if (method === 'flexi') { base.type = 'expense'; base.from = null; }
  else { base.type = 'expense'; base.from = method === 'cash' ? firstOf('cash') : fval(form, 'bankAcct'); }
  const fx = flexiAcct();
  if (old) {
    if (old.linkRole === 'funded' && method !== 'flexi') return showErrors(form, ['This purchase was paid from the flexi loan. Delete it and add it again to change how it was paid.']);
    if (old.linkRole !== 'funded' && method === 'flexi') return showErrors(form, ['To move this purchase onto the flexi loan, delete it and add it again with "From flexi loan".']);
  }
  if (!old && form.dataset.force !== '1') {
    const similar = C.findSimilar(S, base);
    if (similar.length && isFinite(base.amount)) return dupWarning(form, similar);
  }
  let res;
  if (old) res = C.updateTx(S, id, base);
  else if (method === 'flexi') {
    if (!fx) return showErrors(form, ['No flexi-loan account found.']);
    res = C.addExpenseFromFlexi(S, fx.id, base);
  } else res = C.addTx(S, base);
  if (!res.ok) return showErrors(form, res.errors);
  S.settings.lastMethod = method === 'flexi' ? S.settings.lastMethod : method;
  const saved = res.tx || res.txs.find((x) => x.type === 'expense');
  closeSheet();
  commit(old ? 'Changes saved' : money(saved.amount) + ' added to ' + catName(saved.categoryId));
  if (!old && C.isGamingTx(S, saved)) openReflection(saved.id);
  else if (submitter && submitter.value === 'again') openEntry({ mode: 'expense' });
};

FORMS.move = (form) => {
  const kind = form.dataset.kind, id = form.dataset.id;
  const old = id ? C.txById(S, id) : null;
  const fx = flexiAcct();
  const amount = famount(form, 'amount'), date = fval(form, 'date'), notes = fval(form, 'notes');
  let res, msg = 'Saved';
  if (kind === 'salary') {
    const dep = optAmount(form, 'deposit');
    if (Number.isNaN(dep) || (dep != null && dep < 0)) return showErrors(form, ['Enter the deposit as a number (0 to keep it all in the bank).']);
    if (dep != null && isFinite(amount) && dep > amount) return showErrors(form, ['The deposit is more than the salary. Record the extra as a separate deposit.']);
    if (form.dataset.force !== '1') {
      const sim = C.findSimilar(S, { type: 'income', amount, date, to: fval(form, 'bank') });
      if (sim.length) { form.insertAdjacentHTML('afterbegin', ''); return dupWarningMove(form, sim); }
    }
    res = C.addSalaryDay(S, { amount, depositAmount: dep == null ? amount : dep, date, bankId: fval(form, 'bank'), flexiId: fx.id });
    msg = 'Salary recorded once' + (dep ? ' and ' + money(dep) + ' parked in the flexi loan' : '');
  } else if (kind === 'deposit') {
    const base = { type: 'flexi_deposit', amount, date, from: fval(form, 'from') || null, to: old ? old.to : fx.id, source: (form.querySelector('input[name="source"]:checked') || {}).value || 'other', notes };
    res = old ? C.updateTx(S, id, base) : C.addTx(S, base);
    msg = 'Deposit recorded';
  } else if (kind === 'withdraw') {
    const base = { type: 'flexi_withdrawal', amount, date, from: old ? old.from : fx.id, to: fval(form, 'to'), purpose: (form.querySelector('input[name="purpose"]:checked') || {}).value || 'unclassified', description: fval(form, 'description'), notes };
    res = old ? C.updateTx(S, id, base) : C.addTx(S, base);
    msg = base.purpose === 'unclassified' ? 'Withdrawal saved. It is in Needs review until you say what it paid for.' : 'Withdrawal recorded';
  } else if (kind === 'paycard') {
    const source = fval(form, 'source');
    const cardId = old ? old.to : fval(form, 'card');
    if (old) res = C.updateTx(S, id, old.linkRole === 'funded' ? { amount, date, notes } : { amount, date, notes, from: source });
    else if (source === 'flexi') res = C.addCardPaymentFromFlexi(S, { cardId, flexiId: fx.id, amount, date, notes });
    else res = C.addTx(S, { type: 'cc_payment', amount, date, from: source, to: cardId, notes, description: 'Card bill payment' });
    msg = 'Card payment recorded. Spending is unchanged.';
  } else if (kind === 'transfer') {
    const base = { type: 'transfer', amount, date, from: fval(form, 'from'), to: fval(form, 'to'), notes, goalId: fval(form, 'goalId') || (old && old.goalId) || undefined };
    res = old ? C.updateTx(S, id, base) : C.addTx(S, base);
    msg = 'Transfer recorded';
  } else if (kind === 'charge') {
    const type = (form.querySelector('input[name="ctype"]:checked') || {}).value || 'loan_interest';
    const base = { type, amount, date, from: fval(form, 'acct'), notes, description: type === 'loan_interest' ? 'Interest charged' : 'Fee charged' };
    res = old ? C.updateTx(S, id, base) : C.addTx(S, base);
    msg = 'Charge recorded';
  } else if (kind === 'principal') {
    const base = { type: 'principal_adjustment', amount, date, from: fval(form, 'from') || null, to: fval(form, 'to'), notes, description: 'Principal repayment' };
    res = old ? C.updateTx(S, id, base) : C.addTx(S, base);
    msg = 'Principal repayment recorded';
  }
  if (!res || !res.ok) return showErrors(form, (res && res.errors) || ['Could not save.']);
  closeSheet(); commit(old ? 'Changes saved' : msg);
};
function dupWarningMove(form, sim) {
  const box = form.querySelector('.form-errors');
  box.innerHTML = 'Salary of ' + esc(money(sim[0].amount)) + ' is already recorded on ' + esc(fmtDate(sim[0].date)) + '. <button class="btn" type="button" data-act="forceMove">Record again</button>';
  box.scrollIntoView({ block: 'nearest' });
}

// ---------- transaction detail ----------
ACTIONS.txDetail = (d) => openTxDetail(d.id);
function openTxDetail(id) {
  const x = C.txById(S, id);
  if (!x) return toast('That entry no longer exists.');
  const L = C.ledgerOf(x);
  const rows = [];
  rows.push(['Type', C.TX_TYPES[x.type].label]);
  rows.push(['Date', fmtDate(x.date, true) + (x.time ? ', ' + x.time : '')]);
  if (x.categoryId) rows.push(['Category', catName(x.categoryId) + (x.subcategory ? ' · ' + x.subcategory : '')]);
  if (x.description) rows.push(['Description', x.description]);
  if (x.from) rows.push(['From', accountName(x.from)]);
  if (x.to) rows.push(['To', accountName(x.to)]);
  if (x.method) rows.push(['Paid with', C.PAYMENT_METHODS[x.method] || x.method]);
  if (x.type === 'flexi_withdrawal') rows.push(['Purpose', C.WITHDRAWAL_PURPOSES[x.purpose || 'unclassified']]);
  if (x.source) rows.push(['Source', x.source === 'salary' ? 'Salary' : 'Other']);
  if (x.tags && x.tags.length) rows.push(['Tags', x.tags.join(', ')]);
  if (L === 'expense') rows.push(['Recurring', x.recurring ? 'Yes' : 'No']);
  if (x.gaming) rows.push(['Check-in', [x.gaming.trigger ? C.GAMING_TRIGGERS[x.gaming.trigger] : null, x.gaming.waited ? { yes: 'Waited 24h+', some: 'Waited a little', no: 'No wait' }[x.gaming.waited] : null].filter(Boolean).join(' · ') || '—']);
  if (x.notes) rows.push(['Notes', x.notes]);
  if (x.importBatch) rows.push(['Source file', 'Imported statement']);
  const partners = C.linkedPartners(S, x);
  let h = '<div style="text-align:center;display:grid;gap:4px"><div class="num" style="font-size:34px;font-weight:700">' + (x.type === 'refund' ? '+' : '') + money(x.amount) + '</div><div class="muted">' + esc(x.description || C.TX_TYPES[x.type].label) + '</div></div>';
  h += L === 'expense'
    ? '<div class="note good small"><b>Counts toward spending</b>' + (x.type === 'refund' ? 'Reduces spending in ' + esc(catName(x.categoryId)) + '.' : x.type === 'cc_purchase' ? 'Counted on the purchase date. Paying the card bill later will not count it again.' : 'Counted once, on this date.') + '</div>'
    : '<div class="note info small"><b>Excluded from spending</b>' + esc(exclusionReason(x)) + '</div>';
  h += '<div class="group">' + rows.map(([k, v]) => row(esc(k), '<span style="white-space:normal">' + esc(v) + '</span>')).join('') + '</div>';
  if (partners.length) h += '<div class="eyebrow">Linked entries</div><div class="group">' + partners.map((p) => txRow(p, { showDate: true })).join('') + '</div>';
  h += '<div class="btn-row"><button class="btn" data-act="editTx" data-id="' + x.id + '">Edit</button><button class="btn" data-act="dupTx" data-id="' + x.id + '">Duplicate to today</button>' +
    '<button class="btn danger" data-act="deleteTx" data-id="' + x.id + '">Delete</button></div>';
  h += '<button class="btn ghost" data-act="toggleFlag" data-id="' + x.id + '">' + (x.needsReview ? 'Clear review flag' : 'Flag for review') + '</button>';
  openSheet('Entry', h);
}
ACTIONS.editTx = (d) => { closeSheet(); openEdit(C.txById(S, d.id)); };
function openEdit(x) {
  if (!x) return;
  switch (x.type) {
    case 'expense': case 'cc_purchase': return openEntry({ mode: 'expense', tx: x });
    case 'income': return openEntry({ mode: 'income', tx: x });
    case 'refund': return openEntry({ mode: 'refund', tx: x });
    case 'flexi_deposit': return openMove('deposit', { tx: x });
    case 'flexi_withdrawal': {
      if (x.linkRole === 'funding') {
        const p = C.linkedPartners(S, x).find((t) => t.linkRole === 'funded');
        if (p) return p.type === 'cc_payment' ? openMove('paycard', { tx: p }) : openEntry({ mode: 'expense', tx: p });
      }
      return openMove('withdraw', { tx: x });
    }
    case 'cc_payment': return openMove('paycard', { tx: x });
    case 'transfer': return openMove('transfer', { tx: x });
    case 'loan_interest': case 'loan_fee': return openMove('charge', { tx: x });
    case 'principal_adjustment': return openMove('principal', { tx: x });
  }
}
ACTIONS.dupTx = (d) => {
  const res = C.duplicateTx(S, d.id, today());
  if (!res.ok) return toast(res.errors[0]);
  closeSheet(); commit('Copied to today. Edit it if anything changed.');
  const copy = res.tx || res.txs.find((t) => t.linkRole === 'funded');
  openEdit(copy);
};
ACTIONS.toggleFlag = (d) => { const x = C.txById(S, d.id); x.needsReview = !x.needsReview; closeSheet(); commit(x.needsReview ? 'Flagged for review' : 'Flag cleared'); };
ACTIONS.clearFlag = (d) => { const x = C.txById(S, d.id); if (x) x.needsReview = false; commit('Flag cleared'); };
ACTIONS.deleteTx = async (d) => {
  const x = C.txById(S, d.id);
  if (!x) return;
  const partners = C.linkedPartners(S, x);
  const funded = partners.filter((p) => p.linkRole === 'funded' || p.linkRole === 'funding');
  let withLinked = true;
  const what = esc(money(x.amount) + ' · ' + C.TX_TYPES[x.type].label + ' · ' + fmtDate(x.date, true));
  if (funded.length) {
    const ok = await confirmBox({ title: 'Delete entry?', body: what + '<span>This also deletes the linked ' + esc(C.TX_TYPES[funded[0].type].label.toLowerCase()) + ', so the two always match.</span>', confirm: 'Delete both', danger: true });
    if (!ok) return;
  } else if (partners.length) {
    const ok = await confirmBox({ title: 'Delete entry?', body: what + '<span>It is linked to ' + esc(C.TX_TYPES[partners[0].type].label.toLowerCase()) + ' of ' + esc(money(partners[0].amount)) + '.</span>', confirm: 'Delete both', alt: 'Only this one', danger: true });
    if (!ok) return;
    withLinked = ok !== 'alt';
  } else {
    const ok = await confirmBox({ title: 'Delete entry?', body: what + '<span>This cannot be undone.</span>', confirm: 'Delete', danger: true });
    if (!ok) return;
  }
  C.deleteTx(S, x.id, { withLinked });
  closeAllSheets(); commit('Deleted');
};

// ---------- review actions ----------
ACTIONS.dupKeep = (d) => { S.dupDismissed.push(C.pairKey(d.a, d.b)); commit('Kept both entries'); };
ACTIONS.dismissReview = (d) => { S.reviewDismissed.push(d.key); commit('Dismissed'); };

ACTIONS.ackStatement = (d) => { const st = S.statements.find((s) => s.id === d.st); if (st) st.acknowledged = true; commit('Marked as checked'); };
ACTIONS.recordDiff = (d) => {
  const st = S.statements.find((s) => s.id === d.st);
  const r = C.reconcile(S, st.accountId).find((x) => x.statement.id === st.id);

  commit(money(r.difference) + ' recorded as interest');
};

ACTIONS.payCard = (d) => openMove('paycard', { card: d.id });
ACTIONS.dueReminder = (d) => {
  const s = C.cardSummary(S, d.id, today());

  const when = new Date(C.addDays(s.latest.dueDate, -2) + 'T09:00:00');
