<style>
/* Layout: one 600px column; sticky title bar, grouped iOS-style lists, fixed bottom tab bar, bottom sheets for entry. */
:root {
  --bg: #0b0d10;
  --surface: #15181c;
  --surface-2: #1e2227;
  --line: #2a2f36;
  --fg: #eef1f4;
  --fg-2: #a6afb9;
  --fg-3: #737c87;
  --accent: #5b9cf0;
  --accent-ink: #08111f;
  --accent-soft: rgba(91, 156, 240, 0.15);
  --good: #4cc38a;
  --warn: #e5ab48;
  --bad: #f07272;
  --good-soft: rgba(76, 195, 138, 0.14);
  --warn-soft: rgba(229, 171, 72, 0.15);
  --bad-soft: rgba(240, 114, 114, 0.15);
  --series: #3987e5;
  --series-muted: #4a525c;
  --backdrop: rgba(0, 0, 0, 0.55);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  --tabbar-h: 58px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f3f6; --surface: #ffffff; --surface-2: #f0f2f5; --line: #e1e4e9;
    --fg: #101317; --fg-2: #535b65; --fg-3: #7b838d;
    --accent: #1f66c9; --accent-ink: #ffffff; --accent-soft: rgba(31, 102, 201, 0.1);
    --good: #18874f; --warn: #a76a00; --bad: #c73b3b;
    --good-soft: rgba(24, 135, 79, 0.1); --warn-soft: rgba(167, 106, 0, 0.1); --bad-soft: rgba(199, 59, 59, 0.1);
    --series: #2a78d6; --series-muted: #c3c8cf; --backdrop: rgba(10, 14, 20, 0.35); --shadow: 0 10px 40px rgba(16, 24, 40, 0.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f3f6; --surface: #ffffff; --surface-2: #f0f2f5; --line: #e1e4e9;
  --fg: #101317; --fg-2: #535b65; --fg-3: #7b838d;
  --accent: #1f66c9; --accent-ink: #ffffff; --accent-soft: rgba(31, 102, 201, 0.1);
  --good: #18874f; --warn: #a76a00; --bad: #c73b3b;
  --good-soft: rgba(24, 135, 79, 0.1); --warn-soft: rgba(167, 106, 0, 0.1); --bad-soft: rgba(199, 59, 59, 0.1);
  --series: #2a78d6; --series-muted: #c3c8cf; --backdrop: rgba(10, 14, 20, 0.35); --shadow: 0 10px 40px rgba(16, 24, 40, 0.18);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.4;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.shell {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px));
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 8px; padding-block: 12px 10px;
}
.topbar h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; flex: 1; min-width: 0; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--line); color: var(--fg-2);
}
.icon-btn svg { width: 18px; height: 18px; }
.month-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.month-nav .label { flex: 1; text-align: center; font-weight: 600; }
.month-nav button { background: none; border: 0; color: var(--accent); padding: 6px 10px; font-size: 20px; line-height: 1; }
.month-nav button:disabled { color: var(--fg-3); opacity: 0.4; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar .inner { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--tabbar-h); }
.tabbar button {
  background: none; border: 0; color: var(--fg-3); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 10.5px; letter-spacing: 0.01em; padding: 0; min-width: 0;
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.fab {
  position: fixed; z-index: 24; right: max(16px, calc(50% - 284px), env(safe-area-inset-right, 0px));
  bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px));
  height: 52px; padding: 0 20px 0 16px; border-radius: 26px; border: 0; background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 16px; box-shadow: var(--shadow);
}
.fab svg { width: 20px; height: 20px; }

/* ---------- sections & grouped lists ---------- */
.section { display: grid; gap: 8px; margin-top: 22px; }
.section > .eyebrow, .eyebrow {
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--fg-3); padding-inline: 4px;
  display: flex; align-items: baseline; gap: 8px;
}
.eyebrow .end { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.eyebrow a, .eyebrow button.link { color: var(--accent); }
.group { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 48px; position: relative; width: 100%;
  background: none; border: 0; text-align: left; color: inherit;
}
.row + .row::before, .row + details::before, details + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--line); }
details.row-details { position: relative; }
.row .label { flex: 1; min-width: 0; }
.row .label .sub { display: block; font-size: 12.5px; color: var(--fg-2); margin-top: 1px; }
.row .value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .value .sub { display: block; font-size: 12px; color: var(--fg-3); }
button.row:active, a.row:active { background: var(--surface-2); }
.row .chev { color: var(--fg-3); flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--series-muted); }

.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.card.flat { background: transparent; padding: 0; }

/* hero */
.hero { padding: 18px 16px 16px; display: grid; gap: 10px; }
.hero .kicker { font-size: 13px; color: var(--fg-2); }
.hero .big { font-family: var(--font-num); font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; font-variant-numeric: tabular-nums; }
.hero .big.mid { font-size: 34px; }
.hero .line { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--fg-2); }
.hero .line b { color: var(--fg); font-weight: 600; }

.meter { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: visible; }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); max-width: 100%; }
.meter .fill.earmark { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.meter.over .fill { background: var(--bad); }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--fg); opacity: 0.75; }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-3); }

.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em;
  padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; vertical-align: middle;
}
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--accent-soft); color: var(--accent); }

.note { border-radius: 12px; padding: 12px 14px; background: var(--surface-2); color: var(--fg-2); font-size: 13.5px; display: grid; gap: 6px; }
.note b { color: var(--fg); }
.note.info { background: var(--accent-soft); }
.note.warn { background: var(--warn-soft); }
.note.bad { background: var(--bad-soft); }
.note.good { background: var(--good-soft); }

.alert-row .sev { width: 4px; align-self: stretch; border-radius: 2px; flex: none; background: var(--accent); }
.alert-row .sev.warn { background: var(--warn); } .alert-row .sev.critical { background: var(--bad); } .alert-row .sev.info { background: var(--accent); }

.empty { padding: 26px 18px; text-align: center; color: var(--fg-2); display: grid; gap: 10px; justify-items: center; }
.empty h3 { color: var(--fg); font-size: 16px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); padding: 10px 14px; font-weight: 600; font-size: 14.5px; min-height: 42px; text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > .btn { flex: 1 1 auto; }
.action-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.action-grid .btn { font-size: 13.5px; padding: 9px 10px; }
button.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button, .seg label { border: 0; background: none; padding: 7px 6px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--fg-2); text-align: center; position: relative; cursor: pointer; }
.seg button[aria-pressed="true"], .seg input:checked + span { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.seg label span { display: block; padding: 7px 4px; border-radius: 8px; margin: -7px -6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg .count { font-size: 11px; background: var(--warn); color: var(--accent-ink); border-radius: 8px; padding: 0 5px; margin-left: 4px; }

/* chips (radio/checkbox) */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span, button.chip-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 7px 12px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--line); font-size: 13.5px; white-space: nowrap; color: var(--fg); cursor: pointer;
}
.chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- forms ---------- */
form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .field > label.lbl { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.field .hint { font-size: 12.5px; color: var(--fg-3); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], input:not([type]), select, textarea {
  width: 100%; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
  font-size: 16px; appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input[type="date"], input[type="time"] { display: block; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.amount-input { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
.amount-input:focus-within { border-color: var(--accent); }
.amount-input .cur { font-family: var(--font-num); font-size: 30px; color: var(--fg-3); }
.amount-input input { border: 0 !important; background: none !important; font-family: var(--font-num); font-size: 34px; font-weight: 650; padding: 4px 0; min-height: 52px; font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.form-errors { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.form-errors:empty { display: none; }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 500; list-style: none; padding: 4px 0; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { margin-bottom: 12px; }
details.more > div { display: grid; gap: 14px; }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--backdrop); }
.sheet {
  position: relative; width: 100%; max-width: 600px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
  background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 17px; font-weight: 650; flex: 1; min-width: 0; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.sheet-body .group { background: var(--surface-2); }
.sheet-body .group .row + .row::before { border-color: var(--line); }
.sheet-body input, .sheet-body select, .sheet-body textarea, .sheet-body .amount-input { background: var(--bg); }
.sheet-body .seg { background: var(--bg); }
.sheet-body .seg button[aria-pressed="true"], .sheet-body .seg input:checked + span { background: var(--surface-2); }
.sheet-body .chip span { background: var(--bg); }
.sheet-body .note { background: var(--bg); }
.sheet-body .note.info { background: var(--accent-soft); } .sheet-body .note.warn { background: var(--warn-soft); }
.sheet-body .note.bad { background: var(--bad-soft); } .sheet-body .note.good { background: var(--good-soft); }
.sticky-actions { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; border-top: 1px solid var(--line); }
.sticky-actions .btn { flex: 1; }
@media (min-width: 640px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 18px; max-height: calc(100vh - 48px); }
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 70; bottom: calc(var(--tabbar-h) + 80px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: min(92vw, 440px); box-shadow: var(--shadow);
}
.toast[hidden] { display: none; }

/* ---------- transactions ---------- */
.day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-3); padding: 14px 4px 6px; font-weight: 600; }
.tx .label .title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.tx .value { font-weight: 600; }
.tx .value.credit { color: var(--good); }
.tx .value.neutral { color: var(--fg-2); font-weight: 500; }
.searchbar { display: flex; gap: 8px; }
.searchbar input { flex: 1; }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--fg-3); font-size: 10px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--fg-3); stroke-width: 1; opacity: 0.6; }
.chart .bar { fill: var(--series); }
.chart .bar.muted { fill: var(--series-muted); }
.chart .bar.over { fill: var(--bad); }
.chart .ref { stroke: var(--fg-2); stroke-width: 1.25; stroke-dasharray: 4 3; }
.chart .ref-label { fill: var(--fg-2); }
.chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--series); opacity: 0.13; }
.chart .endpoint { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; }
.chart .hit:hover + .bar, .chart g.col:hover .bar { opacity: 0.8; }
.chart .nodata { fill: var(--fg-3); font-size: 9px; }
.chart-wrap { position: relative; }
.chart-caption { font-size: 12.5px; color: var(--fg-3); }
.tip {
  position: fixed; z-index: 80; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12.5px; padding: 6px 9px;
  border-radius: 8px; white-space: pre-line; max-width: 220px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums;
}
.tip[hidden] { display: none; }
.hbars { display: grid; gap: 10px; padding: 14px; }
.hbar { display: grid; gap: 4px; }
.hbar .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.hbar .top .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; }
.hbar .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--series); }
.hbar .track .plan { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg-2); border-radius: 1px; }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 9px 12px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data thead th { border-top: 0; color: var(--fg-3); font-weight: 600; font-size: 12px; }
table.data tr.total td { font-weight: 650; }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }

</style>

<body>
<div class="shell">
  <header class="topbar">
    <h1 id="title">Overview</h1>
    <button class="icon-btn" id="gear" type="button" data-act="openSettings" aria-label="Settings"></button>
  </header>
